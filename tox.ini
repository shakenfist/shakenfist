[tox]
envlist = py3,flake8,cover
isolated_build = true

[testenv]
extras =
  test
sitepackages = true
commands =
    # NOTE: you can run any command line tool here - not just tests
    pip list
    stestr run {posargs}
    stestr slowest
allowlist_externals =
  bash
  find
  rm
  env
  tar
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  OS_STDOUT_CAPTURE=1
  OS_STDERR_CAPTURE=1
  OS_TEST_TIMEOUT=160
  PYTHONDONTWRITEBYTECODE=1
  SHAKENFIST_ETCD_HOST='127.0.0.1'
  SHAKENFIST_EVENTLOG_SUPPRESS_GRPC=1
  SHAKENFIST_LOG_TO_STDOUT=1

[testenv:flake8]
description =
  Run style checks on the changes made since HEAD~.
envdir = {toxworkdir}/shared
commands =
  bash tools/flake8wrap.sh -HEAD

[testenv:docs]
description =
  Ensure the docs build.
envdir = {toxworkdir}/shared
commands =
  mkdocs build {posargs}

[testenv:py3]
description =
  Run python3 unit tests

[testenv:failing]
description =
  List failed tests
envdir = {toxworkdir}/shared
commands =
  stestr failing

[testenv:cover]
description =
  Generate a coverage report in cover/.
setenv =
  PYTHON=coverage run --source shakenfist --parallel-mode
commands =
  coverage erase
  stestr run {posargs}
  coverage combine
  coverage html -d cover
  coverage report

[testenv:mypy]
description =
  Run type checks on the schema module (incremental mypy rollout).
envdir = {toxworkdir}/shared
commands =
  mypy --strict --ignore-missing-imports shakenfist/resource_health.py
  mypy --strict --ignore-missing-imports shakenfist/schema/sqlalchemy.py
  mypy --strict --ignore-missing-imports shakenfist/schema/object_state.py
  mypy --strict --ignore-missing-imports shakenfist/schema/object_types.py
  mypy --strict --ignore-missing-imports shakenfist/schema/external_view.py
  mypy --strict --ignore-missing-imports shakenfist/schema/dnsmasq.py
  mypy --strict --ignore-missing-imports --follow-imports=silent shakenfist/mariadb.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/managed_executables/managedexecutable.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/managed_executables/dnsmasq.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/eventlog.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call --disable-error-code=no-any-return --disable-error-code=arg-type --disable-error-code=assignment --disable-error-code=misc shakenfist/blob.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/daemons/database/main.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/upload.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/logship_spool.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/logship_drainer.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/logship.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/client/ctl.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/schema/operations/baseclusteroperation.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/schema/operations/util.py
  mypy --ignore-missing-imports --follow-imports=silent --disallow-untyped-defs --disable-error-code=no-untyped-call shakenfist/operations/baseoperation.py
  mypy --ignore-missing-imports --follow-imports=silent --disable-error-code=no-untyped-def --disable-error-code=no-untyped-call --disable-error-code=var-annotated --disable-error-code=misc --disable-error-code=attr-defined --disable-error-code=union-attr shakenfist/operations/artifact_fetch_op.py shakenfist/operations/imgcache_op.py shakenfist/operations/net_iface_ip_op.py shakenfist/operations/net_iface_op.py shakenfist/operations/net_ip_op.py shakenfist/operations/net_macaddr_ip_op.py shakenfist/operations/net_op.py shakenfist/operations/node_aop_op.py shakenfist/operations/node_blob_op.py shakenfist/operations/node_inst_net_iface_op.py shakenfist/operations/node_inst_netdesc_op.py shakenfist/operations/node_inst_op.py shakenfist/operations/node_inst_snap_op.py shakenfist/operations/node_net_op.py
