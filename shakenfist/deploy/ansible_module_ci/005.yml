# Tests: sf_instance metadata, instance affinity
#
# Also the regression coverage for issue 3669: these instances are created as
# system, so the server resolves debian_11_base to the blob behind the
# artifact scenario 004 resolved and records a blob_uuid in the disk_spec. The
# re-presentation below must still be judged idempotent despite that extra
# server populated key.

- hosts: localhost
  gather_facts: no
  collections:
    - shakenfist.shakenfist

  vars:
    # The disk base every create in this scenario boots from.
    # ansiblemoduletests.sh overrides this with an artifact imported from the
    # /srv/ci cache disk when that disk is present, so that CI does not fetch
    # ~407 MiB over the internet for bytes it already has (issue 4461). A hand
    # run without the cache disk gets the well known image name instead, and
    # with it the internet fetch.
    debian_11_base: "debian:11"

  tasks:
    - name: Create a test instance with metadata
      sf_instance:
        name: "ansibleci-005-a"
        cpu: 2
        ram: 2048
        disks:
          - "10@{{ debian_11_base }}"
        metadata:
          affinity:
            ci-worker: -10
          tags:
            - ci-worker
        state: present
      register: ci_instance_one

    - name: Assert the instance is new
      assert:
        that: ci_instance_one['changed']
        fail_msg: "changed should be true in {{ ci_instance_one }}"

    - name: Assert no errors
      assert:
        that: not ci_instance_one['failed']
        fail_msg: "failed should be false in {{ ci_instance_one }}"

    - name: Create the same test instance and check it hasn't changed
      sf_instance:
        name: "ansibleci-005-a"
        cpu: 2
        ram: 2048
        disks:
          - "10@{{ debian_11_base }}"
        metadata:
          affinity:
            ci-worker: -10
          tags:
            - ci-worker
        state: present
      register: ci_instance_one

    - name: Assert the instance is not new
      assert:
        that: not ci_instance_one['changed']
        fail_msg: "changed should be true in {{ ci_instance_one }}"

    - name: Assert no errors
      assert:
        that: not ci_instance_one['failed']
        fail_msg: "failed should be false in {{ ci_instance_one }}"

    - name: Assert we have instance details
      assert:
        that: ci_instance_one['meta'] | default({}, true) | length > 0
        fail_msg: "meta should be populated in {{ ci_instance_one }}"

    - name: Create a second instance using affinity via metadata
      sf_instance:
        name: "ansibleci-005-b"
        cpu: 2
        ram: 2048
        disks:
          - "10@{{ debian_11_base }}"
        metadata:
          affinity:
            ci-worker: -10
          tags:
            - ci-worker
        state: present
      register: ci_instance_two

    - name: Assert the instance is new
      assert:
        that: ci_instance_two['changed']
        fail_msg: "changed should be true in {{ ci_instance_two }}"

    - name: Assert no errors
      assert:
        that: not ci_instance_two['failed']
        fail_msg: "failed should be false in {{ ci_instance_two }}"

    - name: Log instance
      debug:
        msg: "{{ ci_instance_one }}"

    - name: Assert the two instances are on different hypervisors
      assert:
        that: ci_instance_one['meta']['node'] != ci_instance_two['meta']['node']
        fail_msg: "instances are both on {{ ci_instance_one['meta']['node'] }}, hypervisor should differ"

    - name: Delete the second instance
      sf_instance:
        uuid: "{{ ci_instance_two['meta']['uuid'] }}"
        state: "absent"
      register: ci_instance_two

    - name: Assert the instance was changed
      assert:
        that: ci_instance_two['changed']
        fail_msg: "changed should be true in {{ ci_instance_two }}"

    - name: Assert no errors
      assert:
        that: not ci_instance_two['failed']
        fail_msg: "failed should be false in {{ ci_instance_two }}"

    - name: Delete the first instance
      sf_instance:
        uuid: "{{ ci_instance_one['meta']['uuid'] }}"
        state: "absent"
      register: ci_instance_one

    - name: Assert the instance was changed
      assert:
        that: ci_instance_one['changed']
        fail_msg: "changed should be true in {{ ci_instance_one }}"

    - name: Assert no errors
      assert:
        that: not ci_instance_one['failed']
        fail_msg: "failed should be false in {{ ci_instance_one }}"