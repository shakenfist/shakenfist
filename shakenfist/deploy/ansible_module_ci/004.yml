# Tests: sf_instance

- hosts: localhost
  gather_facts: no
  collections:
    - shakenfist.shakenfist

  tasks:
    - name: Create a unique namespace name
      shell: pwgen 10 -n 1
      register: unique

    - name: Store unique name
      set_fact:
        namespace_name: "ansibleci-003-{{ unique['stdout'] }}"

    - name: Log namespace name
      debug:
        msg: "Test namespace is {{ namespace_name }}"

    - name: Ensure the namespace doesn't exist at the start
      sf_namespace:
        name: "{{ namespace_name }}"
        state: "absent"

    - name: Create a namespace
      sf_namespace:
        name: "{{ namespace_name }}"
        state: present
      register: ci_namespace

    - name: Assert the namespace is new
      assert:
        that: ci_namespace['changed']
        fail_msg: "changed should be true in {{ ci_namespace }}"

    - name: Assert no errors
      assert:
        that: not ci_namespace['failed']
        fail_msg: "failed should be false in {{ ci_namespace }}"

    - name: Ensure network doesn't exist at the start
      sf_network:
        name: "ansibleci-002"
        state: "absent"

    - name: Create the first test network
      sf_network:
        netblock: "10.0.0.0/24"
        name: "ansibleci-004-1"
        namespace: "{{ namespace_name }}"
        state: present
      register: ci_network_a

    - name: Assert the network is new
      assert:
        that: ci_network_a['changed']
        fail_msg: "changed should be true in {{ ci_network_a }}"

    - name: Assert no errors
      assert:
        that: not ci_network_a['failed']
        fail_msg: "failed should be false in {{ ci_network_a }}"

    - name: Create the second test network
      sf_network:
        netblock: "10.1.0.0/24"
        name: "ansibleci-004-2"
        namespace: "{{ namespace_name }}"
        state: present
      register: ci_network_b

    - name: Assert the network is new
      assert:
        that: ci_network_b['changed']
        fail_msg: "changed should be true in {{ ci_network_b }}"

    - name: Assert no errors
      assert:
        that: not ci_network_b['failed']
        fail_msg: "failed should be false in {{ ci_network_b }}"

    # NOTE(mikal): uefi and secure_boot are set explicitly, to the values the
    # server would have defaulted to anyway, because the idempotency assertion
    # below is the regression coverage for issue 4061: the module used to name
    # this parameter secureboot and compare it against a key the API never
    # returns (the API reports secure_boot), so any explicit value -- even one
    # matching the server -- was perpetually dirty and the instance was
    # replaced on every run.
    #
    # NOTE(mikal): we await this instance so that the debian:11 image is a
    # fully resolved artifact in this (non-system) namespace by the time we
    # return. Scenario 005 then creates an instance as system, which resolves
    # debian:11 to the blob behind this artifact and stores a blob_uuid in the
    # instance's disk_spec. Without the await, whether 005 sees a resolved
    # blob_uuid is a race against this image fetch, and 005's idempotency
    # assertion is the regression coverage for issue 3669 (the module used to
    # treat that server populated key as a specification change and recreate
    # the instance).
    #
    # This is the first scenario in the suite to touch debian:11, so this
    # create pays a cold ~407 MiB internet fetch inside its await budget. On
    # a slow uplink that fetch alone has been observed to take 578 seconds
    # (issue 4000), which leaves the default 600 second await_timeout with no
    # headroom, so give this create a larger budget.
    - name: Create a test instance that uses those networks
      sf_instance:
        name: "ansibleci-004"
        namespace: "{{ namespace_name }}"
        cpu: 2
        ram: 2048
        disks:
          - 10@debian:11
        diskspecs:
          - size=20,type=cdrom
        networks:
          - "{{ ci_network_a['meta']['uuid'] }}"
        networkspecs:
          - "network_uuid={{ ci_network_b['meta']['uuid'] }},address=10.1.0.5,float=True"
        uefi: false
        secure_boot: false
        state: present
        await: true
        await_timeout: 1200
      register: ci_instance

    - name: Assert the instance is new
      assert:
        that: ci_instance['changed']
        fail_msg: "changed should be true in {{ ci_instance }}"

    - name: Assert no errors
      assert:
        that: not ci_instance['failed']
        fail_msg: "failed should be false in {{ ci_instance }}"

    # NOTE(mikal): regression coverage for shakenfist/kerbside#355, where the
    # create blocked for an hour before the await started a fresh 600 second
    # clock on the same condition and the task took the sum. This is the only
    # place the real shakenfist_client is exercised on this path -- the unit
    # tests stub the client out, so they can only assert which value the
    # module passes, never what the client does with it. Both log lines are
    # matched loosely because which of the two create paths runs depends on
    # the client version pip resolved on the control node.
    - name: Assert the await ran on a budget, not on its own fresh clock
      assert:
        that:
          - ci_instance['log'] | select('search', 'create timeout') | list | length > 0
          - ci_instance['log'] | select('search', 'already spent') | list | length > 0
        fail_msg: "await budget not reported in {{ ci_instance['log'] }}"

    - name: Create the same test instance and check it hasn't changed
      sf_instance:
        name: "ansibleci-004"
        namespace: "{{ namespace_name }}"
        cpu: 2
        ram: 2048
        disks:
          - 10@debian:11
        diskspecs:
          - size=20,type=cdrom
        networks:
          - "{{ ci_network_a['meta']['uuid'] }}"
        networkspecs:
          - "network_uuid={{ ci_network_b['meta']['uuid'] }},address=10.1.0.5,float=True"
        uefi: false
        secure_boot: false
        state: present
      register: ci_instance

    - name: Assert the instance is not new
      assert:
        that: not ci_instance['changed']
        fail_msg: "changed should be true in {{ ci_instance }}"

    - name: Assert no errors
      assert:
        that: not ci_instance['failed']
        fail_msg: "failed should be false in {{ ci_instance }}"

    - name: Assert we have instance details
      assert:
        that: ci_instance['meta'] | default({}, true) | length > 0
        fail_msg: "meta should be populated in {{ ci_instance }}"

    # NOTE(mikal): we need to change the IP address here as well, otherwise we
    # bump into the deletion halo around the previous IP address.
    - name: Change the instance and check for replacement
      sf_instance:
        name: "ansibleci-004"
        namespace: "{{ namespace_name }}"
        cpu: 2
        ram: 2048
        disks:
          - 10@debian:11
        diskspecs:
          - size=30,type=cdrom
        networks:
          - "{{ ci_network_a['meta']['uuid'] }}"
        networkspecs:
          - "network_uuid={{ ci_network_b['meta']['uuid'] }},address=10.1.0.6,float=True"
        state: present
      register: ci_instance

    - name: Assert the instance is new
      assert:
        that: ci_instance['changed']
        fail_msg: "changed should be true in {{ ci_instance }}"

    - name: Assert no errors
      assert:
        that: not ci_instance['failed']
        fail_msg: "failed should be false in {{ ci_instance }}"

    - name: Delete the instance
      sf_instance:
        uuid: "{{ ci_instance['meta']['uuid'] }}"
        state: "absent"
      register: ci_instance

    - name: Assert the instance was changed
      assert:
        that: ci_instance['changed']
        fail_msg: "changed should be true in {{ ci_instance }}"

    - name: Assert no errors
      assert:
        that: not ci_instance['failed']
        fail_msg: "failed should be false in {{ ci_instance }}"

    - name: Delete the first network
      sf_network:
        uuid: "{{ ci_network_a['meta']['uuid'] }}"
        state: absent
      register: ci_network_a

    - name: Assert the network was changed
      assert:
        that: ci_network_a['changed']
        fail_msg: "changed should be true in {{ ci_network_a }}"

    - name: Assert no errors
      assert:
        that: not ci_network_a['failed']
        fail_msg: "failed should be false in {{ ci_network_a }}"

    - name: Delete the second network
      sf_network:
        uuid: "{{ ci_network_b['meta']['uuid'] }}"
        state: absent
      register: ci_network_b

    - name: Assert the network was changed
      assert:
        that: ci_network_b['changed']
        fail_msg: "changed should be true in {{ ci_network_b }}"

    - name: Assert no errors
      assert:
        that: not ci_network_b['failed']
        fail_msg: "failed should be false in {{ ci_network_b }}"