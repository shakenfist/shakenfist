# yaml-language-server: $schema=https://json.schemastore.org/ansible-playbook.json

# Install Shaken Fist on a series of Ubuntu or Debian machines. Some parts of this
# ansible playbook contain tags, but not all. Currently available tags are:
#
#   bootstrap: bootstrap the installer, you must always run this tag.
#   pki: tasks associated with setup of certifying authorities or PKI certificates
#     (for example those for the SPICE console).

- hosts: localhost
  gather_facts: yes
  connection: local
  become: yes
  tags: bootstrap
  vars:
    ram_system_reservation: 2.0
    dns_server: 8.8.8.8
    http_proxy:

  tasks:
    - name: Set global configurations as facts
      set_fact:
        "ram_system_reservation": "{{ ram_system_reservation }}"
        "dns_server": "{{ dns_server }}"
        "http_proxy": "{{ http_proxy }}"
        "topology_decoded": "{{ topology | from_json }}"
      delegate_to: localhost
      delegate_facts: true

    - include_tasks: tasks/distro-check.yml

    - name: Log topology
      debug:
        msg: "{{ topology_decoded }}"

    # Note: Group membership is set in the generated hosts file created by
    # deploy.py. However, node-specific variables (node_name, node_mesh_ip,
    # etc.) must be set via set_fact to avoid template recursion issues when
    # the hostname matches a variable value (e.g., node_name=localhost on a
    # host named localhost).

    - name: Record API URL from primary node
      set_fact:
        api_url: "{{ item['api_url'] }}"
      loop: "{{ topology_decoded }}"
      when: item.get('primary_node', False)

    - name: Set node facts for each host
      set_fact:
        node_name: "{{ item['name'] }}"
        node_egress_ip: "{{ item['node_egress_ip'] }}"
        node_egress_nic: "{{ item['node_egress_nic'] }}"
        node_mesh_ip: "{{ item['node_mesh_ip'] }}"
        node_mesh_nic: "{{ item['node_mesh_nic'] }}"
      delegate_to: "{{ item['name'] }}"
      delegate_facts: true
      loop: "{{ topology_decoded }}"

    - name: Set configuration file location
      set_fact:
        "template_path": "{{ playbook_dir }}/../templates"
      delegate_to: localhost
      delegate_facts: true

### Preinstall validation

- hosts: hypervisors, network_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: network
      vars:
        role_action: "validate_mtus"
        template_path: "{{ hostvars['localhost']['template_path'] }}"

- hosts: hypervisors
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: hypervisor
      vars:
        role_action: "validate_kvm"

### Base node setup

- hosts: allsf
  become: yes
  become_method: sudo
  tags: bootstrap
  gather_facts: yes
  connection: ssh
  roles:
    - role: base
      vars:
        role_action: "bootstrap"
        server_package: "{{ server_package }}"
        client_package: "{{ client_package }}"
        pip_extra: "{{ pip_extra }}"

### Networking

- hosts: network_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: network
      vars:
        role_action: "bootstrap"
        template_path: "{{ hostvars['localhost']['template_path'] }}"

### Internal PKI

- hosts: localhost
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: local
  tags: pki
  roles:
    - role: pki_internal_ca
      vars:
        role_action: "bootstrap"
        deploy_name: "{{ deploy_name }}"

- hosts: allsf
  become: yes
  become_method: sudo
  tags: pki
  gather_facts: yes
  connection: ssh
  roles:
    - role: pki_internal_ca
      vars:
        role_action: "host_certificate"
        deploy_name: "{{ deploy_name }}"
        hostname: "{{ inventory_hostname }}"

    - role: pki_internal_ca
      vars:
        role_action: "distribute_certificates"
        deploy_name: "{{ deploy_name }}"
        hostname: "{{ inventory_hostname }}"

### Hypervisors

- hosts: hypervisors
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: hypervisor
      vars:
        role_action: "bootstrap"
        template_path: "{{ hostvars['localhost']['template_path'] }}"

### Primary node

- hosts: primary_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: primary
      vars:
        role_action: "bootstrap"

### Write config and configure client

- hosts: allsf
  become: yes
  become_method: sudo
  tags: bootstrap
  gather_facts: yes
  connection: ssh
  roles:
    - role: base
      vars:
        role_action: "config"
        system_key: "{{ admin_password }}"
        mariadb_password: "{{ mariadb_password }}"
        sf_config_template_path: "{{ playbook_dir }}/roles/base/templates"

# Cluster config must run before register because register starts the
# sf-database daemon, and sf-database's ExecStartPre=verify-config
# requires AUTH_SECRET_SEED to already be in the cluster_config table.
# The cluster_config tasks delegate to etcd_master[0]; direct MariaDB
# access works because /etc/sf/config on that node has
# SHAKENFIST_MARIADB_HOST set to the operator-provided host.
- hosts: primary_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: primary
      vars:
        role_action: "cluster_config"
        mariadb_gateway_hosts:
          - "{{ hostvars[groups['etcd_master'][0]]['node_mesh_ip'] }}"
        auth_secret: "{{ hostvars['localhost']['auth_secret'] }}"
        ram_system_reservation: "{{ hostvars['localhost']['ram_system_reservation'] }}"
        lowest_mtu: "{{ hostvars[groups['primary_node'][0]]['lowest_mtu'] }}"
        dns_server: "{{ hostvars['localhost']['dns_server'] }}"
        http_proxy: "{{ hostvars['localhost']['http_proxy'] }}"
        extra_config: "{{ extra_config }}"

# Register all nodes in the database (init-node creates the node object).
- hosts: allsf
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: base
      vars:
        role_action: "register"
        node_name: "{{ node_name }}"
        node_mesh_ip: "{{ node_mesh_ip }}"

# Create the admin namespace. This only needs to run once, so we run it on the
# first database node.
- hosts: etcd_master
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: base
      vars:
        role_action: "create_admin_namespace"
        system_key: "{{ admin_password }}"
        node_mesh_ip: "{{ node_mesh_ip }}"
      when: inventory_hostname == groups['etcd_master'][0]

- hosts: primary_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: primary
      role_action: "postinstall"