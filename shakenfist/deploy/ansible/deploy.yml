# yaml-language-server: $schema=https://json.schemastore.org/ansible-playbook.json

# Install Shaken Fist on a series of Ubuntu or Debian machines. Some parts of this
# ansible playbook contain tags, but not all. Currently available tags are:
#
#   bootstrap: bootstrap the installer, you must always run this tag.
#   etcd: tasks associated with setup or upgrade of etcd itself.
#   pki: tasks associated with setup of certifying authorities or PKI certificates
#     (for example those for the SPICE console).

- hosts: localhost
  gather_facts: yes
  connection: local
  become: yes
  tags: bootstrap
  vars:
    ram_system_reservation: 2.0
    dns_server: 8.8.8.8
    http_proxy:

  tasks:
    - name: Set global configurations as facts
      set_fact:
        "ram_system_reservation": "{{ ram_system_reservation }}"
        "dns_server": "{{ dns_server }}"
        "http_proxy": "{{ http_proxy }}"
        "topology_decoded": "{{ topology | from_json }}"
      delegate_to: localhost
      delegate_facts: true

    - include_tasks: tasks/distro-check.yml

    - name: Log topology
      debug:
        msg: "{{ topology_decoded }}"

    - name: Add nodes from topology
      # This include is to work around the lack of blocks in loops
      include_tasks: includes/topology_add_node.yml
      loop: "{{ topology_decoded }}"

    - name: Set configuration file location
      set_fact:
        "template_path": "{{ playbook_dir }}/../templates"
      delegate_to: localhost
      delegate_facts: true

### Preinstall validation

- hosts: hypervisors, network_node, eventlog_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: network
      vars:
        role_action: "validate_mtus"
        template_path: "{{ hostvars['localhost']['template_path'] }}"

- hosts: hypervisors
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: hypervisor
      vars:
        role_action: "validate_kvm"

### Base node setup

- hosts: allsf
  become: yes
  become_method: sudo
  tags: bootstrap
  gather_facts: yes
  connection: ssh
  roles:
    - role: base
      vars:
        role_action: "bootstrap"
        server_package: "{{ server_package }}"
        agent_package: "{{ agent_package }}"
        client_package: "{{ client_package }}"
        pip_extra: "{{ pip_extra }}"

### Networking

- hosts: network_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: network
      vars:
        role_action: "bootstrap"
        template_path: "{{ hostvars['localhost']['template_path'] }}"

### Internal PKI

- hosts: localhost
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: local
  tags: pki
  roles:
    - role: pki_internal_ca
      vars:
        role_action: "bootstrap"
        deploy_name: "{{ deploy_name }}"

- hosts: allsf
  become: yes
  become_method: sudo
  tags: pki
  gather_facts: yes
  connection: ssh
  roles:
    - role: pki_internal_ca
      vars:
        role_action: "host_certificate"
        deploy_name: "{{ deploy_name }}"
        hostname: "{{ inventory_hostname }}"

    - role: pki_internal_ca
      vars:
        role_action: "distribute_certificates"
        deploy_name: "{{ deploy_name }}"
        hostname: "{{ inventory_hostname }}"

### Hypervisors

- hosts: hypervisors
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: hypervisor
      vars:
        role_action: "bootstrap"
        template_path: "{{ hostvars['localhost']['template_path'] }}"

### Primary node

- hosts: primary_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: primary
      vars:
        role_action: "bootstrap"

- hosts: allsf
  become: yes
  become_method: sudo
  tags: bootstrap
  gather_facts: yes
  connection: ssh
  roles:
    - role: base
      vars:
        role_action: "syslog"
        syslog_target: "{{ hostvars[groups['primary_node'][0]]['node_mesh_ip'] }}"

### etcd

#    ETCD_MAX_REQUEST_BYTES is from https://github.com/etcd-io/etcd/issues/9043
- hosts: etcd
  tags: etcd
  roles:
    - role: andrewrothstein.etcd-cluster
      vars:
        etcd_secure: False
        etcd_cluster_name: shakenfist
        etcd_enable_v2: False
        etcd_master_group_name: etcd_master
        etcd_iface_public: "{{node_mesh_nic}}"
        etcd_iface_cluster: "{{node_mesh_nic}}"
        etcd_address_cluster: "{{node_mesh_ip}}"
        etcd_additional_envvars:
          ETCD_MAX_REQUEST_BYTES: 100000000

### Write config and configure client

- hosts: allsf
  become: yes
  become_method: sudo
  tags: bootstrap
  gather_facts: yes
  connection: ssh
  roles:
    - role: base
      vars:
        role_action: "config"
        system_key: "{{ admin_password }}"
        sf_config_template_path: "{{ playbook_dir }}/roles/base/templates"

- hosts: primary_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: primary
      vars:
        role_action: "grafana"
        deploy_name: "{{ deploy_name }}"
        system_key: "{{ admin_password }}"
    - role: primary
      vars:
        role_action: "etcd_config"
        etcd_host: "{{ hostvars[groups['etcd_master'][0]]['node_mesh_ip'] }}"
        auth_secret: "{{ hostvars['localhost']['auth_secret'] }}"
        ram_system_reservation: "{{ hostvars['localhost']['ram_system_reservation'] }}"
        lowest_mtu: "{{ hostvars[groups['primary_node'][0]]['lowest_mtu'] }}"
        dns_server: "{{ hostvars['localhost']['dns_server'] }}"
        http_proxy: "{{ hostvars['localhost']['http_proxy'] }}"
        extra_config: "{{ extra_config }}"

# Register all nodes in etcd (init-node creates the node object)
- hosts: allsf
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: base
      vars:
        role_action: "register"
        etcd_host: "{{ hostvars[groups['etcd_master'][0]]['node_mesh_ip'] }}"
        node_name: "{{ node_name }}"
        node_mesh_ip: "{{ node_mesh_ip }}"

# The database daemon must start before eventlog when the database service
# is enabled (DATABASE_USE_DIRECT_ETCD=False). By default, direct etcd access
# is used and this step is skipped. This must run AFTER node registration
# because register-daemon requires the node to exist in etcd.
- hosts: etcd_master
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: database
      vars:
        role_action: "bootstrap"
      when: not (database_use_direct_etcd | default(true) | bool)

- hosts: eventlog_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: eventlog
      vars:
        role_action: "bootstrap"

- hosts: etcd_master
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: base
      vars:
        role_action: "create_admin_namespace"
        system_key: "{{ admin_password }}"
        etcd_host: "{{ hostvars[groups['etcd_master'][0]]['node_mesh_ip'] }}"
        node_mesh_ip: "{{ node_mesh_ip }}"
        eventlog_node_ip: "{{hostvars[groups['eventlog_node'][0]]['node_mesh_ip']}}"

- hosts: primary_node
  become: yes
  become_method: sudo
  gather_facts: yes
  connection: ssh
  roles:
    - role: primary
      role_action: "postinstall"