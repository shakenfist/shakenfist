---
# The database daemon provides a gRPC interface to MariaDB, centralizing all
# database access. The daemon must start before other daemons that depend on
# database access.

# This must run on the database node itself (etcd_master[0]) so that sf-ctl
# uses direct MariaDB access via MARIADB_HOST.
- name: Register the database daemon
  shell: |
    /srv/shakenfist/venv/bin/sf-ctl register-daemon database
  environment:
    SHAKENFIST_NODE_NAME: "{{node_name}}"
    SHAKENFIST_NODE_MESH_IP: "{{node_mesh_ip}}"

- name: Start the database daemon
  service:
    name: sf-database
    enabled: yes
    state: restarted
    daemon_reload: no
