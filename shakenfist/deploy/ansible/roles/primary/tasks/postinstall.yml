---
- name: Rotate logs and remove old logs
  shell: |
    journalctl --rotate
    journalctl --vacuum-time=2d
    /usr/sbin/logrotate -f /etc/logrotate.conf
  ignore_errors: True

- name: Make /usr/share/ansible/plugins/modules
  file:
    path: /usr/share/ansible/plugins/modules
    state: directory
    mode: u+rwx,go+rx

- name: Lookup the installed location of ansible modules
  shell: |
    /srv/shakenfist/venv/bin/sf-client admin ansible_module_path
  register: ansible_module_path
  ignore_errors: True

- name: Find sf_instance module
  set_fact:
    sf_instance_path: "{{ lookup('ansible.builtin.first_found', paths) }}"
  vars:
    paths:
      - "{{ ansible_module_path.stdout }}/sf_instance"
      - /srv/shakenfist/venv/share/shakenfist/ansible/sf_instance
      - /srv/shakenfist/venv/share/shakenfist/ansible/sf_instance.py

- name: Install sf_instance ansible module
  copy:
    src: "{{ sf_instance_path }}"
    dest: /usr/share/ansible/plugins/modules/sf_instance
    owner: root
    group: root
    mode: "0644"

- name: Find sf_network module
  set_fact:
    sf_network_path: "{{ lookup('ansible.builtin.first_found', paths) }}"
  vars:
    paths:
      - "{{ ansible_module_path.stdout }}/sf_network"
      - /srv/shakenfist/venv/share/shakenfist/ansible/sf_network
      - /srv/shakenfist/venv/share/shakenfist/ansible/sf_network.py

- name: Install sf_network ansible module
  copy:
    src: "{{ sf_network_path }}"
    dest: /usr/share/ansible/plugins/modules/sf_network
    owner: root
    group: root
    mode: "0644"

- name: Find sf_namespace module
  set_fact:
    sf_namespace_path: "{{ lookup('ansible.builtin.first_found', paths) }}"
  vars:
    paths:
      - "{{ ansible_module_path.stdout }}/sf_namespace"
      - /srv/shakenfist/venv/share/shakenfist/ansible/sf_namespace
      - /srv/shakenfist/venv/share/shakenfist/ansible/sf_namespace.py

- name: Install sf_namespace ansible module
  copy:
    src: "{{ sf_namespace_path }}"
    dest: /usr/share/ansible/plugins/modules/sf_namespace
    owner: root
    group: root
    mode: "0644"

- name: Find sf_snapshot module
  set_fact:
    sf_snapshot_path: "{{ lookup('ansible.builtin.first_found', paths) }}"
  vars:
    paths:
      - "{{ ansible_module_path.stdout }}/sf_snapshot"
      - "{{ ansible_module_path.stdout }}/sf_snapshot.py"
      - /srv/shakenfist/venv/share/shakenfist/ansible/sf_snapshot
      - /srv/shakenfist/venv/share/shakenfist/ansible/sf_snapshot.py

- name: Install sf_snapshot ansible module
  copy:
    src: "{{ sf_snapshot_path }}"
    dest: /usr/share/ansible/plugins/modules/sf_snapshot
    owner: root
    group: root
    mode: "0644"

# Sanity checks to verify the deployment succeeded
- name: Verify sf-api service is active
  shell: |
    systemctl is-active sf-api
  register: sf_api_status
  failed_when: sf_api_status.stdout != "active"

- name: Verify sf-queues service is active
  shell: |
    systemctl is-active sf-queues
  register: sf_queues_status
  failed_when: sf_queues_status.stdout != "active"

- name: Verify API is responding
  shell: |
    curl -s -o /dev/null -w "%{http_code}" http://localhost:13000/auth/namespaces
  register: api_response
  failed_when: api_response.stdout != "401"
  retries: 5
  delay: 2
  until: api_response.stdout == "401"

- name: Log deployment sanity check results
  debug:
    msg: |
      Deployment sanity checks passed:
      - sf-api: {{ sf_api_status.stdout }}
      - sf-queues: {{ sf_queues_status.stdout }}
      - API responding: HTTP {{ api_response.stdout }} (expected 401 Unauthorized)