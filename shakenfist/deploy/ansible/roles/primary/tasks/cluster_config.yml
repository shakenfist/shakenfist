---
# Cluster config runs before register.yml because sf-database's
# ExecStartPre=verify-config reads AUTH_SECRET_SEED at daemon
# startup. register.yml starts sf-database, so AUTH_SECRET_SEED
# must already be written by the time register runs.
#
# Each sf-ctl command is delegated to etcd_master[0] with
# SHAKENFIST_MARIADB_HOST=localhost so that set-config writes
# directly to MariaDB rather than routing through the
# not-yet-running database gRPC service.

- name: Ensure the MariaDB schema exists
  shell: |
    SHAKENFIST_MARIADB_HOST=localhost \
        /srv/shakenfist/venv/bin/sf-ctl ensure-mariadb-schema
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true

- name: Set auth secret in cluster config
  shell: |
    SHAKENFIST_MARIADB_HOST=localhost \
        /srv/shakenfist/venv/bin/sf-ctl set-config \
        AUTH_SECRET_SEED "{{ auth_secret }}"
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true

- name: Set ram reservation in cluster config
  shell: |
    SHAKENFIST_MARIADB_HOST=localhost \
        /srv/shakenfist/venv/bin/sf-ctl set-config \
        RAM_SYSTEM_RESERVATION "{{ ram_system_reservation }}"
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true

- name: Set lowest_mtu in cluster config
  shell: |
    SHAKENFIST_MARIADB_HOST=localhost \
        /srv/shakenfist/venv/bin/sf-ctl set-config \
        MAX_HYPERVISOR_MTU "{{ lowest_mtu }}"
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true

- name: Set DNS server in cluster config
  shell: |
    SHAKENFIST_MARIADB_HOST=localhost \
        /srv/shakenfist/venv/bin/sf-ctl set-config \
        DNS_SERVER "{{ dns_server }}"
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true

- name: Set HTTP proxy in cluster config
  shell: |
    SHAKENFIST_MARIADB_HOST=localhost \
        /srv/shakenfist/venv/bin/sf-ctl set-config \
        HTTP_PROXY "{{ http_proxy }}"
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true
  when: hostvars['localhost']['http_proxy'] | length != 0

- name: Log additional config
  debug:
    msg: "{{ extra_config | from_json }}"

- name: Apply additional config
  shell: |
    SHAKENFIST_MARIADB_HOST=localhost \
        /srv/shakenfist/venv/bin/sf-ctl set-config \
        "{{item['name']}}" "{{item['value']}}"
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true
  loop: "{{ extra_config | from_json }}"

- name: Verify configuration
  shell: |
    SHAKENFIST_MARIADB_HOST=localhost \
        /srv/shakenfist/venv/bin/sf-ctl verify-config
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true

- name: Parse back cluster configuration
  shell: |
    SHAKENFIST_MARIADB_HOST=localhost \
        /srv/shakenfist/venv/bin/sf-ctl show-config
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true
  register: cluster_config

- name: Log cluster config
  debug:
    msg: "{{ cluster_config.stdout }}"
