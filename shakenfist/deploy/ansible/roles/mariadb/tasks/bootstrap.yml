---
# Install and configure MariaDB server on etcd_master nodes

- name: Install MariaDB server and client
  apt:
    name:
      - mariadb-server
      - mariadb-client
      - python3-mysqldb
    state: latest
  register: apt_action
  retries: 100
  until: apt_action is success or ('Failed to lock apt for exclusive operation' not in apt_action.msg and '/var/lib/dpkg/lock' not in apt_action.msg)

- name: Enable and start MariaDB service
  service:
    name: mariadb
    enabled: yes
    state: started

- name: Create shakenfist database
  community.mysql.mysql_db:
    name: shakenfist
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create shakenfist database user
  community.mysql.mysql_user:
    name: shakenfist
    password: "{{ mariadb_password }}"
    priv: 'shakenfist.*:ALL'
    host: '%'
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Configure MariaDB to listen on mesh network only
  lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: 'bind-address = {{ node_mesh_ip }}'
  notify: Restart MariaDB
