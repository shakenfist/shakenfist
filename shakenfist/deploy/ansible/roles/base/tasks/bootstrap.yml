---
- name: Setup /etc/hosts
  template:
    src: templates/etc_hosts.tmpl
    dest: /etc/hosts
    owner: root
    group: root
    mode: u=r,g=r,o=r

- name: Make /etc/systemd/system-preset/
  file:
    path: /etc/systemd/system-preset
    state: directory
    mode: "0755"

- name: Disable auto-starting of dnsmasq on installation
  copy:
    content: |
      disable dnsmasq.service
    dest: /etc/systemd/system-preset/00-sf-disable-dnsmasq.preset
    owner: root
    group: root
    mode: u=r,g=r,o=r
  notify: Reload systemd

# As recommended on the ansible apt module documentation...
- name: Upgrade packages
  apt:
    upgrade: dist
    update_cache: yes
    autoremove: yes
  register: apt_action
  retries: 100
  until: apt_action is success or ('Failed to lock apt for exclusive operation' not in apt_action.msg and '/var/lib/dpkg/lock' not in apt_action.msg)

- name: Install qemu
  block:
    - name: Attempt to install qemu-kvm
      apt:
        name: qemu-kvm
  rescue:
    - name: Attempt to install qemu-system-x86 instead
      apt:
        name: qemu-system-x86

# We install libvirt, even on non-hypervisors, because we use it to track
# the CPU topology and load of the node.
- name: Install shared dependencies
  apt:
    name:
      - apparmor
      - arping
      - bridge-utils
      - build-essential
      - cpu-checker
      - git
      - libmagic-dev
      - libssl-dev
      - libvirt-daemon-system
      - libvirt-dev
      - lm-sensors
      - net-tools
      - ovmf
      - prometheus-node-exporter
      - python3-cffi
      - python3-dev
      - python3-libvirt
      - python3-pip
      - python3-venv
      - python3-wheel
      - pwgen
      - qemu-utils
      - rsyslog
      - unzip
      - xxhash
    state: latest

- name: Enable desired services
  service:
    name: "{{ item }}.service"
    enabled: yes
    state: started
  with_items:
    - apparmor
    - libvirtd
    - prometheus-node-exporter
    - rsyslog
  notify: Reload systemd

- name: Create python venv and install Shaken Fist server and agent packages
  shell: |
    mkdir -p /srv/shakenfist/venv
    python3 -mvenv --system-site-packages /srv/shakenfist/venv
    /srv/shakenfist/venv/bin/pip install -U pip uv
    /srv/shakenfist/venv/bin/uv pip install -U gunicorn
    /srv/shakenfist/venv/bin/uv pip install {{ pip_extra }} {{ agent_package }} {{ server_package }}

- name: Optionally install the Shaken Fist client package
  shell: |
    /srv/shakenfist/venv/bin/pip install {{ pip_extra }} {{ client_package }}
  when: inventory_hostname in groups.get('primary_node', []) or client_on_all_nodes

- name: Make /srv/shakenfist/
  file:
    path: /srv/shakenfist
    state: directory
    mode: "0755"
    
- name: Make /etc/sysctl.d/
  file:
    path: /etc/sysctl.d
    state: directory
    mode: u+rw,go+r
    
- name: Configure IPv6 to be disabled on boot
  copy:
    content: |
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
    dest: /etc/sysctl.d/10-sf-ipv6.conf
    owner: root
    mode: u=r,g=r,o=r

- name: Configure IPv6 to be disabled now
  shell: |
    sysctl -w net.ipv6.conf.all.disable_ipv6=1
    sysctl -w net.ipv6.conf.default.disable_ipv6=1
  ignore_errors: True

- name: Disable system suspend
  copy:
    content: |
      [Sleep]
      AllowSuspend=no
      AllowHibernation=no
      AllowSuspendThenHibernate=no
      AllowHybridSleep=no
    dest: /etc/systemd/sleep.conf
    owner: root
    mode: u=r,g=r,o=r

- name: Restart systemd-logind to disable system suspend
  service:
    name: systemd-logind
    state: restarted

- name: Configure journald to not consume heaps of disk
  copy:
    content: |
      [Journal]
      #Storage=auto
      #Compress=yes
      #Seal=yes
      #SplitMode=uid
      #SyncIntervalSec=5m
      #RateLimitIntervalSec=30s
      #RateLimitBurst=10000
      #SystemMaxUse=
      #SystemKeepFree=
      SystemMaxFileSize=1000M
      #SystemMaxFiles=100
      #RuntimeMaxUse=
      #RuntimeKeepFree=
      #RuntimeMaxFileSize=
      #RuntimeMaxFiles=100
      #MaxRetentionSec=
      #MaxFileSec=1month
      #ForwardToSyslog=yes
      #ForwardToKMsg=no
      #ForwardToConsole=no
      #ForwardToWall=yes
      #TTYPath=/dev/console
      #MaxLevelStore=debug
      #MaxLevelSyslog=debug
      #MaxLevelKMsg=notice
      #MaxLevelConsole=info
      #MaxLevelWall=emerg
      #LineMax=48K
      #ReadKMsg=yes
      #Audit=no
    dest: /etc/systemd/journald.conf
    owner: root
    mode: u=r,g=r,o=r

- name: Restart journald
  service:
    name: systemd-journald
    state: restarted
    
- name: Create storage directory
  file:
    path: /srv/shakenfist
    state: directory
    mode: "0755"