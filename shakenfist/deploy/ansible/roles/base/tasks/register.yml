---
# Bootstrap order is critical for the database microservice:
#
# 1. Ensure MariaDB schema exists (runs on etcd_master[0] with direct access)
# 2. Start the database daemon on etcd_master nodes (provides gRPC access)
# 3. Run initialise-node and register-daemon on all nodes (use gRPC service)
# 4. Start remaining daemons
#
# The sf-ctl commands use DATABASE_NODE_IP to contact the database service.
# On etcd_master nodes with MARIADB_HOST configured, direct access is used
# instead (for ensure-mariadb-schema which runs before the service starts).

# Step 1: Ensure MariaDB schema exists before anything else. This runs on
# etcd_master[0] which has direct MariaDB access via MARIADB_HOST.
- name: Ensure MariaDB schema exists
  shell: |
    /srv/shakenfist/venv/bin/sf-ctl ensure-mariadb-schema
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true

# Step 2: Start the database daemon on etcd_master nodes. This must happen
# before initialise-node runs on non-etcd-master nodes, as they need to
# contact the database service via gRPC.
#
# We use delegate_to and run_once to ensure this completes on the etcd_master
# BEFORE any node proceeds to initialise-node. Without this, Ansible would
# skip this task on non-etcd-master nodes and immediately proceed to the next
# task, causing a race condition.
- name: Start the database daemon on etcd_master nodes
  service:
    name: "sf-database"
    enabled: yes
    state: restarted
    daemon_reload: no
  delegate_to: "{{ groups['etcd_master'][0] }}"
  run_once: true

# Step 3: Now that the database service is running, initialize all nodes.
# Non-etcd-master nodes will use DATABASE_NODE_IP to contact the gRPC service.
# etcd_master nodes will use direct MariaDB access since they have MARIADB_HOST.
- name: Ensure the node exists in etcd
  shell: |
    /srv/shakenfist/venv/bin/sf-ctl initialise-node
  environment:
    SHAKENFIST_ETCD_HOST: "{{ etcd_host }}"
    SHAKENFIST_NODE_NAME: "{{ node_name }}"
    SHAKENFIST_NODE_MESH_IP: "{{ node_mesh_ip }}"
    SHAKENFIST_DATABASE_NODE_IP: "{{ hostvars[groups['etcd_master'][0]]['node_mesh_ip'] }}"

- name: Register the eventlog daemon if it runs on this node
  shell: |
    /srv/shakenfist/venv/bin/sf-ctl register-daemon eventlog
  environment:
    SHAKENFIST_ETCD_HOST: "{{ etcd_host }}"
    SHAKENFIST_NODE_NAME: "{{ node_name }}"
    SHAKENFIST_NODE_MESH_IP: "{{ node_mesh_ip }}"
    SHAKENFIST_DATABASE_NODE_IP: "{{ hostvars[groups['etcd_master'][0]]['node_mesh_ip'] }}"
  when: inventory_hostname in groups.get('eventlog_node', [])

- name: Register the database daemon if it runs on this node
  shell: |
    /srv/shakenfist/venv/bin/sf-ctl register-daemon database
  environment:
    SHAKENFIST_ETCD_HOST: "{{ etcd_host }}"
    SHAKENFIST_NODE_NAME: "{{ node_name }}"
    SHAKENFIST_NODE_MESH_IP: "{{ node_mesh_ip }}"
    SHAKENFIST_DATABASE_NODE_IP: "{{ hostvars[groups['etcd_master'][0]]['node_mesh_ip'] }}"
  when: inventory_hostname in groups.get('etcd_master', [])

- name: Register the other SF daemons
  shell: |
    /srv/shakenfist/venv/bin/sf-ctl register-daemon \
        sentinel-first sentinel-last privexec nodelock net resources \
        sidechannel queues api cleaner cluster transfers
  environment:
    SHAKENFIST_ETCD_HOST: "{{ etcd_host }}"
    SHAKENFIST_NODE_NAME: "{{ node_name }}"
    SHAKENFIST_NODE_MESH_IP: "{{ node_mesh_ip }}"
    SHAKENFIST_DATABASE_NODE_IP: "{{ hostvars[groups['etcd_master'][0]]['node_mesh_ip'] }}"

# Step 4: Start the remaining daemons. The ordering here is to match the order
# they must start in, not alphabetical order.
- name: Base daemons everywhere
  service:
    name: "sf-{{ item }}"
    enabled: yes
    state: restarted
    daemon_reload: no
  with_items:
    - sentinel-first
    - privexec
    - nodelock

- name: Now the the eventlog daemon
  service:
    name: "sf-eventlog"
    enabled: yes
    state: restarted
    daemon_reload: no
  when: inventory_hostname in groups.get('eventlog_node', [])

# TODO(mikal): this is a bit wrong. Some of these should only come up
# on nodes which are either a network node, hypervisor, or storage
# node...
- name: Restart the other SF daemons
  service:
    name: "sf-{{ item }}"
    enabled: yes
    state: restarted
    daemon_reload: no
  with_items:
    - net
    - resources
    - sidechannel
    - queues
    - api
    - cleaner
    - cluster
    - transfers
    - sentinel-last

- name: Make sure sf.target unit is active
  vars:
    cmdCheck: systemctl status sf.target
    cmdSet: systemctl isolate sf.target
  ansible.builtin.shell:
    cmd: '{{ cmdCheck }} && exit 0; {{ cmdSet }}; {{ cmdCheck }} && exit 1; exit 2'
  register: _
  changed_when: _.rc == 1
  failed_when: _.rc == 2

- name: Capture the list of running SF processes
  shell: |
    ps -ef | egrep "^root.*sf-"
  register: sf_processes

- name: Log SF processes
  debug:
    msg: "{{ sf_processes.stdout.split('\n') }}"

- name: Capture the status of the SF target
  shell: |
    systemctl status sf.target
  register: sf_systemd_status

- name: Log SF target status
  debug:
    msg: "{{ sf_systemd_status.stdout.split('\n') }}"

- name: Capture the SF target journal
  shell: |
    journalctl -u sf.target
  register: sf_systemd_journal

- name: Log SF target journal
  debug:
    msg: "{{ sf_systemd_journal.stdout.split('\n') }}"
