---
# Note: All sf-ctl commands during installation must use direct etcd access
# because the database microservice may not be running yet. The config file
# might have DATABASE_USE_DIRECT_ETCD=0 (use microservice), but we override
# that here to ensure bootstrap works correctly.
- name: Ensure the node exists in etcd
  shell: |
    /srv/shakenfist/venv/bin/sf-ctl initialise-node
  environment:
    SHAKENFIST_ETCD_HOST: "{{ etcd_host }}"
    SHAKENFIST_NODE_NAME: "{{ node_name }}"
    SHAKENFIST_NODE_MESH_IP: "{{ node_mesh_ip }}"
    SHAKENFIST_DATABASE_USE_DIRECT_ETCD: "True"

- name: Register the eventlog daemon if it runs on this node
  shell: |
    /srv/shakenfist/venv/bin/sf-ctl register-daemon eventlog
  environment:
    SHAKENFIST_ETCD_HOST: "{{ etcd_host }}"
    SHAKENFIST_NODE_NAME: "{{ node_name }}"
    SHAKENFIST_NODE_MESH_IP: "{{ node_mesh_ip }}"
    SHAKENFIST_DATABASE_USE_DIRECT_ETCD: "True"
  when: inventory_hostname in groups.get('eventlog_node', [])

- name: Register the database daemon if it runs on this node
  shell: |
    /srv/shakenfist/venv/bin/sf-ctl register-daemon database
  environment:
    SHAKENFIST_ETCD_HOST: "{{ etcd_host }}"
    SHAKENFIST_NODE_NAME: "{{ node_name }}"
    SHAKENFIST_NODE_MESH_IP: "{{ node_mesh_ip }}"
    SHAKENFIST_DATABASE_USE_DIRECT_ETCD: "True"
  when: inventory_hostname in groups.get('etcd_master', [])

- name: Register the other SF daemons
  shell: |
    /srv/shakenfist/venv/bin/sf-ctl register-daemon \
        sentinel-first sentinel-last privexec nodelock net resources \
        sidechannel queues api cleaner cluster transfers
  environment:
    SHAKENFIST_ETCD_HOST: "{{ etcd_host }}"
    SHAKENFIST_NODE_NAME: "{{ node_name }}"
    SHAKENFIST_NODE_MESH_IP: "{{ node_mesh_ip }}"
    SHAKENFIST_DATABASE_USE_DIRECT_ETCD: "True"

# The ordering of units here is to match the order they must start in, not
# alphabetical order. These must come up first on all machines.
#
# Start the database daemon on etcd_master nodes when the database service is
# enabled. Note: database_use_direct_etcd is a string "0" or "1", not a boolean.
- name: The database daemon must start first
  service:
    name: "sf-database"
    enabled: yes
    state: restarted
    daemon_reload: no
  when:
    - inventory_hostname in groups.get('etcd_master', [])
    - (database_use_direct_etcd | default("1")) == "0"

- name: Base daemons everywhere
  service:
    name: "sf-{{ item }}"
    enabled: yes
    state: restarted
    daemon_reload: no
  with_items:
    - sentinel-first
    - privexec
    - nodelock

- name: Now the the eventlog daemon
  service:
    name: "sf-eventlog"
    enabled: yes
    state: restarted
    daemon_reload: no
  when: inventory_hostname in groups.get('eventlog_node', [])

# TODO(mikal): this is a bit wrong. Some of these should only come up
# on nodes which are either a network node, hypervisor, or storage
# node...
- name: Restart the other SF daemons
  service:
    name: "sf-{{ item }}"
    enabled: yes
    state: restarted
    daemon_reload: no
  with_items:
    - net
    - resources
    - sidechannel
    - queues
    - api
    - cleaner
    - cluster
    - transfers
    - sentinel-last

- name: Make sure sf.target unit is active
  vars:
    cmdCheck: systemctl status sf.target
    cmdSet: systemctl isolate sf.target
  ansible.builtin.shell:
    cmd: '{{ cmdCheck }} && exit 0; {{ cmdSet }}; {{ cmdCheck }} && exit 1; exit 2'
  register: _
  changed_when: _.rc == 1
  failed_when: _.rc == 2

- name: Capture the list of running SF processes
  shell: |
    ps -ef | egrep "^root.*sf-"
  register: sf_processes

- name: Log SF processes
  debug:
    msg: "{{ sf_processes.stdout.split('\n') }}"

- name: Capture the status of the SF target
  shell: |
    systemctl status sf.target
  register: sf_systemd_status

- name: Log SF target status
  debug:
    msg: "{{ sf_systemd_status.stdout.split('\n') }}"

- name: Capture the SF target journal
  shell: |
    journalctl -u sf.target
  register: sf_systemd_journal

- name: Log SF target journal
  debug:
    msg: "{{ sf_systemd_journal.stdout.split('\n') }}"