---
argument_specs:
  main:
    short_description: Core per-node Shaken Fist setup.
    description:
      - >-
        Runs the bootstrap, config and register entry points in order: installs
        OS packages and base services, writes /etc/sf/config and the systemd
        units, and registers the node and its daemons. Folds in the database
        capability when node_is_database_node is true.
      - >-
        Every value is a plain role variable. The role reads no inventory group
        names and no other host's facts; the consuming playbook maps its
        inventory onto these variables and orders database-tier hosts first.
    options: &node_options
      node_name:
        type: str
        default: "localhost"
        description:
          - This node's Shaken Fist name. Becomes SHAKENFIST_NODE_NAME and the
            node identity used by sf-ctl initialise-node and register-daemon.
      node_egress_ip:
        type: str
        default: "127.0.0.1"
        description:
          - This node's egress (north/south) IP address. Becomes
            SHAKENFIST_NODE_EGRESS_IP.
      node_egress_nic:
        type: str
        default: "eth0"
        description:
          - This node's egress network interface. Becomes
            SHAKENFIST_NODE_EGRESS_NIC.
      node_mesh_ip:
        type: str
        default: "127.0.0.1"
        description:
          - This node's mesh (east/west) IP address. Becomes
            SHAKENFIST_NODE_MESH_IP and the mesh IP passed to
            sf-ctl initialise-node.
      node_mesh_nic:
        type: str
        default: "eth0"
        description:
          - This node's mesh network interface. Becomes
            SHAKENFIST_NODE_MESH_NIC.
      node_is_hypervisor:
        type: bool
        default: false
        description:
          - Whether this node runs instances. Becomes
            SHAKENFIST_NODE_IS_HYPERVISOR.
      node_is_network_node:
        type: bool
        default: false
        description:
          - Whether this node is the network node. Becomes
            SHAKENFIST_NODE_IS_NETWORK_NODE.
      node_is_database_node:
        type: bool
        default: false
        description:
          - >-
            Whether this node runs sf-database. When true the role renders
            SHAKENFIST_NODE_IS_DATABASE_NODE=True and the direct-MariaDB block,
            writes and registers the sf-database systemd unit, and starts the
            database daemon. This is the folded-in "database" capability.
      network_node_ip:
        type: str
        default: "127.0.0.1"
        description:
          - The mesh IP of the cluster's network node. Same value on every host.
            Becomes SHAKENFIST_NETWORK_NODE_IP. The example playbook computes it
            from the network_node inventory group.
      mariadb_gateway_hosts:
        type: list
        elements: str
        default: []
        description:
          - >-
            The mesh IPs of every database-tier host, as a list. Same value on
            every host. Rendered comma-joined into
            SHAKENFIST_MARIADB_GATEWAY_HOSTS. The example playbook computes it
            from the database inventory group.
      all_mesh_hosts:
        type: dict
        default: {}
        description:
          - >-
            A map of node name to mesh IP for every host in the cluster, used to
            render /etc/hosts. Same value on every host. The example playbook
            builds it from inventory.
      deploy_name:
        type: str
        default: "sf"
        description:
          - The deployment/zone name. Becomes SHAKENFIST_ZONE.
      api_url:
        type: str
        default: "http://localhost:13000"
        description:
          - The cluster's API URL, written into sfrc and the global auth file so
            sf-client on this node can reach the API.
      floating_network_ipblock:
        type: str
        default: "10.10.0.0/24"
        description:
          - The floating IP network block. Becomes SHAKENFIST_FLOATING_NETWORK.
      node_ram_reservation_gb:
        type: float
        default: 2.0
        description:
          - This node's RAM reservation, in GB. Becomes
            SHAKENFIST_NODE_RAM_RESERVATION_GB.
      node_cpu_reservation_threads:
        type: int
        default: 2
        description:
          - This node's CPU thread reservation. Becomes
            SHAKENFIST_NODE_CPU_RESERVATION_THREADS.
      node_disk_reservation_gb:
        type: float
        default: 20.0
        description:
          - This node's disk reservation, in GB. Becomes
            SHAKENFIST_NODE_DISK_RESERVATION_GB.
      maintain_stray_vxlan_grace_seconds:
        type: int
        default: 300
        description:
          - How long a vxlan device which matches no network this node should
            be on must persist before the network maintainer reaps it. Becomes
            SHAKENFIST_MAINTAIN_STRAY_VXLAN_GRACE_SECONDS.
      system_key:
        type: str
        default: "unknown"
        description:
          - The "system" namespace key, written into sfrc and the global auth
            file. Supply a real secret; the default is deliberately
            non-functional.
      vault_system_key_path:
        type: str
        required: false
        description:
          - >-
            Optional Hashicorp Vault path. When defined, system_key is looked up
            from Vault via the hashivault lookup plugin instead of being passed
            in directly.
      mariadb_host:
        type: str
        default: "localhost"
        description:
          - Direct MariaDB host. Rendered into SHAKENFIST_MARIADB_HOST only when
            node_is_database_node is true.
      mariadb_port:
        type: int
        default: 3306
        description:
          - Direct MariaDB port. Rendered only when node_is_database_node.
      mariadb_user:
        type: str
        default: "shakenfist"
        description:
          - Direct MariaDB user. Rendered only when node_is_database_node.
      mariadb_password:
        type: str
        default: "unknown"
        description:
          - Direct MariaDB password. Rendered only when node_is_database_node;
            supply a real secret.
      mariadb_database:
        type: str
        default: "sf"
        description:
          - Direct MariaDB database name. Rendered only when
            node_is_database_node.
      loki_base_url:
        type: str
        default: ""
        description:
          - Loki log shipping endpoint. Empty leaves the shipper dormant.
            Rendered into SHAKENFIST_LOKI_BASE_URL when set.
      loki_tenant:
        type: str
        default: ""
        description:
          - Loki tenant. Rendered into SHAKENFIST_LOKI_TENANT when set.
      loki_auth_header:
        type: str
        default: ""
        description:
          - Loki auth header (a secret). Rendered into
            SHAKENFIST_LOKI_AUTH_HEADER on every node when set, because every
            daemon ships its own logs.
      kerbside_url: &kerbside_url_option
        type: str
        default: ""
        description:
          - >-
            Base URL of a Kerbside VDI console proxy, for example
            https://kerbside.example.com. Rendered into
            SHAKENFIST_KERBSIDE_URL on every node when set; empty, the
            default, leaves the proxied-console integration off and makes
            the kerbside_preflight and kerbside_credentials entry points do
            nothing. The value is used verbatim as the console token
            audience, so it must equal the Kerbside deployment's
            SF_CONSOLE_TOKEN_AUDIENCE exactly.
          - >-
            When set, kerbside_credentials ensures the console token signing
            key exists with sf-ctl ensure-kerbside-signing-key, and
            kerbside_preflight refuses to deploy while a KERBSIDE_URL or
            KERBSIDE_TOKEN_DURATION cluster_config row differs from its
            variable, or while extra_config sets either. Deploying Kerbside
            itself is a separate job.
      kerbside_token_duration: &kerbside_token_duration_option
        type: int
        default: 300
        description:
          - >-
            Lifetime in seconds of a minted console token; must be positive.
            Rendered into SHAKENFIST_KERBSIDE_TOKEN_DURATION on every node,
            but only when kerbside_url is set, since a duration without a URL
            means nothing.
      sf_ctl_path: &sf_ctl_path_option
        type: str
        default: /srv/shakenfist/venv/bin/sf-ctl
        description:
          - >-
            The sf-ctl which the kerbside_preflight and kerbside_credentials
            entry points run on cluster_db_host. A variable only so a test can
            substitute a stub.
      kerbside_system_key: &kerbside_system_key_option
        type: str
        default: ""
        no_log: true
        description:
          - >-
            The key Kerbside authenticates to Shaken Fist with (a secret).
            When set, kerbside_credentials mints it as the "kerbside" key in
            the system namespace on every deploy, as system_key is minted as
            the "deploy" key, so changing it rotates it. It requires
            kerbside_url, must differ from system_key, and must be at least
            16 characters. Empty, the default, mints nothing; removing it
            later does not delete the key, which is revoked with
            sf-client namespace delete-key system kerbside.
      federation_jwks_ca_bundle:
        type: str
        default: ""
        description:
          - >-
            Path on the node to a PEM bundle of extra certificate authorities
            to trust when fetching a federated identity provider's JWKS.
            Empty, the default, means the system trust store alone. Set this
            when the provider is behind a private CA, which a self hosted
            Authentik or Keycloak usually is. The anchors are added to the
            system ones rather than replacing them, so a private provider and
            a public one such as GitHub can both be configured at once.
            Rendered into SHAKENFIST_FEDERATION_JWKS_CA_BUNDLE.
      server_package:
        type: str
        default: "shakenfist"
        description:
          - >-
            The Shaken Fist server package installed into /srv/shakenfist's
            virtualenv. Either a PyPI name (the default) or a local wheel path
            such as /tmp/shakenfist-0.8.x.whl for local/CI installs. Building
            and distributing the wheel is the consuming playbook's / CI's
            responsibility.
      client_package:
        type: str
        default: "shakenfist-client"
        description:
          - >-
            The Shaken Fist client package installed into /srv/shakenfist's
            virtualenv. Either a PyPI name (the default) or a local wheel path
            for local/CI installs, paralleling server_package.
      pip_extra:
        type: str
        default: ""
        description:
          - >-
            Extra arguments passed to uv pip install when installing the
            server and client packages, for example --index-url or proxy
            flags for local/CI installs. May be empty or expand to several
            arguments.
  bootstrap:
    short_description: Install OS packages and base services for a node.
    description:
      - >-
        Writes /etc/hosts, the systemd presets, disables IPv6 and system
        suspend, bounds journald disk use, upgrades packages, installs qemu
        and the shared dependencies (libvirt is installed even on
        non-hypervisors for CPU topology tracking), and creates the
        /srv/shakenfist virtualenv with the shakenfist server and client
        packages. Reads no inventory groups.
    options: *node_options
  config:
    short_description: Write a node's config and systemd units.
    description:
      - >-
        Writes /etc/sf/config, sfrc, the global auth file and all of the sf-*
        systemd units. The sf-database.service unit is written when
        node_is_database_node is true. The direct-MariaDB block in
        /etc/sf/config is rendered only on database nodes.
    options: *node_options
  register:
    short_description: Register a node and start its daemons.
    description:
      - >-
        Runs sf-ctl initialise-node and register-daemon locally for this node,
        then starts the daemons. The database daemon is registered and started
        only when node_is_database_node is true. sf-ctl auto-routes to direct
        MariaDB on database nodes and to the gRPC gateway elsewhere, so the
        ordering of database-tier hosts first is the consuming playbook's
        responsibility.
    options: *node_options
  kerbside_preflight:
    short_description: Refuse a Kerbside configuration a cluster_config row would shadow.
    description:
      - >-
        Run once per cluster, before anything writes to cluster_config. Does
        nothing at all unless kerbside_url is set. When it is, fails if
        kerbside_token_duration is not positive, or if extra_config sets
        KERBSIDE_URL or KERBSIDE_TOKEN_DURATION (the cluster config play would
        write that row this very run). It then reads the existing rows with
        sf-ctl show-config, never with --show-secrets, and fails if either row
        differs from its variable, naming the sf-ctl unset-config command which
        fixes it. A row equal to its variable is left alone with a warning.
        Rows are compared as strings, since set-config stores 300 as an
        integer.
      - >-
        Every sf-ctl call is delegated to cluster_db_host, which must have
        direct database access. Reads no inventory groups.
    options:
      kerbside_url: *kerbside_url_option
      kerbside_token_duration: *kerbside_token_duration_option
      extra_config: &extra_config_option
        type: str
        default: "[]"
        description:
          - >-
            The cluster's extra_config, as the JSON string the cluster config
            play receives: a list of objects with name and value keys.
      sf_ctl_path: *sf_ctl_path_option
      cluster_db_host: &cluster_db_host_option
        type: str
        required: true
        description:
          - >-
            The inventory name of the database-tier host every sf-ctl call is
            delegated to. The example playbook passes the first database-tier
            host.
  kerbside_credentials:
    short_description: Mint the Kerbside signing key and system namespace credential.
    description:
      - >-
        Run once per cluster, after the system namespace's deploy key is
        minted and before any daemon restarts. Does nothing at all unless
        kerbside_url or kerbside_system_key is set.
      - >-
        When kerbside_url is set, runs sf-ctl ensure-kerbside-signing-key,
        which creates the console token signing key if it is absent and
        otherwise changes nothing, so an sf-api restarted with KERBSIDE_URL set
        always finds a key.
      - >-
        When kerbside_system_key is set, refuses it unless kerbside_url is also
        set, it differs from system_key, and it is at least 16 characters, and
        then mints it as the "kerbside" key in the system namespace with sf-ctl
        bootstrap-system-key --key-from-stdin, on every run. The key reaches
        sf-ctl on stdin only and never appears in the output.
      - >-
        Every sf-ctl call is delegated to cluster_db_host. Reads no inventory
        groups.
    options:
      kerbside_url: *kerbside_url_option
      kerbside_system_key: *kerbside_system_key_option
      system_key:
        type: str
        default: "unknown"
        no_log: true
        description:
          - >-
            The system namespace's deploy key. Read only to refuse a
            kerbside_system_key equal to it.
      node_mesh_ip:
        type: str
        default: "127.0.0.1"
        description:
          - >-
            The mesh IP of cluster_db_host, passed to sf-ctl as
            SHAKENFIST_NODE_MESH_IP. The example playbook passes
            hostvars[cluster_db_host]['node_mesh_ip'].
      sf_ctl_path: *sf_ctl_path_option
      cluster_db_host: *cluster_db_host_option
