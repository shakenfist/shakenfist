---
# Defaults for the node role. The consuming playbook is expected to override
# the per-node identity, capability and cluster-wide values from its inventory;
# the values here are only safe single-host fallbacks. Secrets
# (mariadb_password, system_key) have deliberately non-functional defaults so a
# misconfigured deploy fails loudly rather than shipping a known key.

# Per-node identity.
node_name: "localhost"
node_egress_ip: "127.0.0.1"
node_egress_nic: "eth0"
node_mesh_ip: "127.0.0.1"
node_mesh_nic: "eth0"

# Capability flags. A single-host deploy sets all three true.
node_is_hypervisor: false
node_is_network_node: false
node_is_database_node: false

# Reservations. Literal fallbacks matching the server Field defaults, so a
# standalone/role-isolated run still renders a sane /etc/sf/config. The
# example playbook computes per-host values from inventory facts.
node_ram_reservation_gb: 2.0
node_cpu_reservation_threads: 2
node_disk_reservation_gb: 20

# Cluster-wide values (the same on every host). The example playbook computes
# these from inventory group membership.
network_node_ip: "127.0.0.1"
mariadb_gateway_hosts: []
all_mesh_hosts: {}

# Cluster identity and client configuration.
deploy_name: "sf"
api_url: "http://localhost:13000"
floating_network_ipblock: "10.10.0.0/24"
system_key: "unknown"

# Direct MariaDB access, rendered into /etc/sf/config only on database nodes.
mariadb_host: "localhost"
mariadb_port: 3306
mariadb_user: "shakenfist"
mariadb_password: "unknown"
mariadb_database: "sf"

# How long a vxlan device matching no network this node should be on must
# persist before the network maintainer reaps it. Matches the server default.
# The functional test for stray reaping waits this out and sizes its own
# deadline from whatever the node is configured with, so a CI deploy which
# wants that test to finish sooner should override this (30 is plenty) --
# nothing does today, so cluster CI pays the full five minutes. Production
# has no reason to lower it.
maintain_stray_vxlan_grace_seconds: 300

# Loki log shipping. Empty leaves the shipper dormant.
loki_base_url: ""
loki_tenant: ""
loki_auth_header: ""

# Kerbside VDI console proxy base URL. Empty leaves the proxied-console
# integration off. The value is also the minted token's audience claim, so it
# must equal the Kerbside deployment's SF_CONSOLE_TOKEN_AUDIENCE exactly.
# Deploying Kerbside itself, and provisioning the signing key with
# sf-ctl ensure-kerbside-signing-key, remain the operator's job.
kerbside_url: ""

# Extra certificate authorities to trust when fetching a federated identity
# provider's JWKS. Empty means the system trust store alone. Set this to a
# path on the nodes when the provider is behind a private CA, which a self
# hosted Authentik or Keycloak usually is. Getting the file onto the nodes is
# the operator's job; this only tells sf-api where to look for it.
federation_jwks_ca_bundle: ""

# Shaken Fist server/client package references installed into /srv/shakenfist's
# virtualenv. The defaults install the released packages from PyPI. For
# local/CI installs these may be overridden to local wheel paths (for example
# /tmp/shakenfist-0.8.x.whl), and pip_extra may carry extra uv pip flags such
# as --index-url or proxy options. pip_extra may be empty or expand to several
# arguments.
server_package: "shakenfist"
client_package: "shakenfist-client"
pip_extra: ""
