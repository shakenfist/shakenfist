---
# Mint what Shaken Fist must hold for a Kerbside: the console token signing
# key, and the "kerbside" key in the system namespace which Kerbside
# authenticates with.
#
#   * kerbside_url set: the signing key is ensured. This runs once per
#     cluster in the cluster config play, which precedes the plays that
#     restart daemons, so an sf-api restarted with KERBSIDE_URL set always
#     finds a key behind it.
#   * kerbside_system_key set: the key is minted on every run, exactly as the
#     cluster config play mints system_key as the "deploy" key. Rotation is
#     changing the variable. A re-mint with an unchanged value still issues a
#     new nonce, which Kerbside's client absorbs with one re-authentication.
#     Removing the variable deliberately does not delete the key: a secrets
#     file which failed to decrypt looks exactly like a removed variable, and a
#     credential should not vanish because of that. Revoke it with
#     sf-client namespace delete-key system kerbside.
#   * neither set: nothing runs.
#
# Every command is delegated to cluster_db_host, which the consuming playbook
# passes, so the entry point reads no inventory groups. The sf-ctl path is a
# variable so a test can drive this against a stub without root or a cluster.

# The key must not reach the output, but no_log on an assert would hide its
# message too, leaving an operator with nothing to act on. These asserts
# instead only ever print their own fixed messages and the text of their
# conditions, neither of which contains the key. They run before anything is
# minted, so a refused key leaves no Kerbside state behind.
- name: Check the Kerbside system key
  when: kerbside_system_key | length > 0
  block:
    # A Kerbside with nothing to point at is a configuration mistake rather
    # than a deliberate state.
    - name: Refuse a Kerbside system key without a Kerbside URL
      ansible.builtin.assert:
        that: kerbside_url | length > 0
        fail_msg: >-
          kerbside_system_key is set but kerbside_url is not. Set kerbside_url
          to the Kerbside deployment's URL, or remove kerbside_system_key.
        quiet: true

    - name: Refuse a Kerbside system key equal to the deploy key
      ansible.builtin.assert:
        that: kerbside_system_key != system_key
        fail_msg: >-
          kerbside_system_key is the same as system_key. Kerbside must have a
          credential of its own, so that it can be rotated or revoked without
          touching the deployer's. Generate a different value.
        quiet: true

    - name: Refuse a short Kerbside system key
      ansible.builtin.assert:
        that: kerbside_system_key | length >= 16
        fail_msg: >-
          kerbside_system_key is shorter than 16 characters. Generate a longer
          random value.
        quiet: true

# ensure-kerbside-signing-key prints the same two lines (the active kid and
# the number of published keys) whether it created the key or found one
# already there, so its output cannot say whether anything changed. Reporting
# changed on every run would be a lie on every run but the first, so this
# reports unchanged, which is a lie only on the first.
- name: Ensure the Kerbside console token signing key exists
  ansible.builtin.command: "{{ sf_ctl_path }} ensure-kerbside-signing-key"
  delegate_to: "{{ cluster_db_host }}"
  changed_when: false
  when: kerbside_url | length > 0

# The key is passed on stdin rather than as an argument so it never appears in
# the process table on the database host, and no_log keeps it out of the
# output. Mirrors the cluster config play's "deploy" key task, including the
# mesh IP sf-ctl needs to reach the database.
- name: Mint the Kerbside key in the system namespace
  ansible.builtin.command: "{{ sf_ctl_path }} bootstrap-system-key --key-from-stdin kerbside"
  args:
    stdin: "{{ kerbside_system_key }}"
  environment:
    SHAKENFIST_NODE_MESH_IP: "{{ node_mesh_ip }}"
  delegate_to: "{{ cluster_db_host }}"
  changed_when: true
  no_log: true
  when: kerbside_system_key | length > 0
