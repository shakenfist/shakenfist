---
# Per-node OS preparation for a Shaken Fist node: host file, systemd presets,
# IPv6 disable, journald limits, package installation, the /srv/shakenfist
# virtualenv with the shakenfist server/client packages, and the base services
# every node needs. This is entirely local to the host and reads no inventory
# groups.

- name: Setup /etc/hosts
  ansible.builtin.template:
    src: etc_hosts.tmpl
    dest: /etc/hosts
    owner: root
    group: root
    mode: ugo+r

- name: Make /etc/systemd/system-preset/
  ansible.builtin.file:
    path: /etc/systemd/system-preset
    state: directory
    mode: u+rwx,go+rx

- name: Disable auto-starting of dnsmasq on installation
  ansible.builtin.template:
    src: 00-sf-disable-dnsmasq.tmpl
    dest: /etc/systemd/system-preset/00-sf-disable-dnsmasq.preset
    owner: root
    group: root
    mode: ugo+r
  notify: Reload systemd

- name: Disable system suspend
  ansible.builtin.template:
    src: sleep.tmpl
    dest: /etc/systemd/sleep.conf
    owner: root
    mode: ugo+r
  notify: Restart logind

- name: Configure IPv6 to be disabled on boot
  ansible.builtin.template:
    src: 10-sf-ipv6.tmpl
    dest: /etc/sysctl.d/10-sf-ipv6.conf
    owner: root
    mode: ugo+r
  register: sf_ipv6_sysctl

# Only apply at runtime when the persisted sysctl.d file actually changed; on a
# no-op redeploy IPv6 is already disabled from boot, so this would otherwise
# report a spurious change every run.
- name: Configure IPv6 to be disabled now
  ansible.builtin.shell: |
    sysctl -w net.ipv6.conf.all.disable_ipv6=1
    sysctl -w net.ipv6.conf.default.disable_ipv6=1
  changed_when: true
  failed_when: false
  when: sf_ipv6_sysctl is changed

- name: Configure journald to not consume heaps of disk
  ansible.builtin.template:
    src: journald.tmpl
    dest: /etc/systemd/journald.conf
    owner: root
    mode: ugo+r
  notify: Restart journald

# As recommended on the ansible apt module documentation...
- name: Upgrade packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    autoremove: true
  register: apt_action
  retries: 100
  until: >-
    apt_action is success or
    ('Failed to lock apt for exclusive operation' not in apt_action.msg and
     '/var/lib/dpkg/lock' not in apt_action.msg)

- name: Install qemu
  block:
    - name: Attempt to install qemu-kvm
      ansible.builtin.apt:
        name: qemu-kvm
      register: apt_action
      retries: 100
      until: >-
        apt_action is success or
        ('Failed to lock apt for exclusive operation' not in apt_action.msg and
         '/var/lib/dpkg/lock' not in apt_action.msg)
  rescue:
    - name: Attempt to install qemu-system-x86 instead
      ansible.builtin.apt:
        name: qemu-system-x86
      register: apt_action
      retries: 100
      until: >-
        apt_action is success or
        ('Failed to lock apt for exclusive operation' not in apt_action.msg and
         '/var/lib/dpkg/lock' not in apt_action.msg)

# Ubuntu 24.04 requires qemu-system-modules-spice for SPICE support, otherwise
# instances fail to start.
- name: Install SPICE modules for Ubuntu 24.04
  ansible.builtin.apt:
    name: qemu-system-modules-spice
    state: latest
  register: apt_action
  retries: 100
  until: >-
    apt_action is success or
    ('Failed to lock apt for exclusive operation' not in apt_action.msg and
     '/var/lib/dpkg/lock' not in apt_action.msg)
  when: ansible_distribution | lower == "ubuntu" and ansible_distribution_version == "24.04"

# We install libvirt, even on non-hypervisors, because we use it to track
# the CPU topology and load of the node.
- name: Install shared dependencies
  ansible.builtin.apt:
    name:
      - apparmor
      - arping
      - bridge-utils
      - build-essential
      - cpu-checker
      - git
      - libmagic-dev
      - libmariadb-dev
      - libssl-dev
      - python3-mysqldb
      - libvirt-daemon-system
      - libvirt-dev
      - lm-sensors
      - net-tools
      - ovmf
      - python3-cffi
      - python3-dev
      - python3-libvirt
      - python3-pip
      - python3-venv
      - python3-wheel
      - pwgen
      - qemu-utils
      - unzip
      - xxhash
    state: latest
  register: apt_action
  retries: 100
  until: >-
    apt_action is success or
    ('Failed to lock apt for exclusive operation' not in apt_action.msg and
     '/var/lib/dpkg/lock' not in apt_action.msg)

# Create the /srv/shakenfist virtualenv and install the Shaken Fist server and
# client packages into it. This replicates the per-node work the legacy
# deploy/getsf script used to do (getsf lines ~895-940).
#
# server_package/client_package are EITHER PyPI names ("shakenfist" /
# "shakenfist-client", the default/release mode) OR local wheel paths like
# /tmp/shakenfist-0.8.x.whl (the local/CI mode that tests the current commit).
# In local/CI mode, BUILDING the wheels, DISTRIBUTING them to each node's /tmp,
# and overriding server_package/client_package (and pip_extra with any
# index/proxy flags) is the consuming playbook's / CI's responsibility
# (phase-6 steps 3 and 5), NOT this role's. This role only installs whatever
# package references it is handed.
#
# --system-site-packages is required so the venv can see apt-installed modules
# such as python3-libvirt. --reinstall is required so a re-deploy picks up a
# freshly-built wheel with the same version string.
- name: Ensure /srv/shakenfist exists
  ansible.builtin.file:
    path: /srv/shakenfist
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the Shaken Fist virtualenv
  ansible.builtin.command: python3 -m venv --system-site-packages /srv/shakenfist/venv
  args:
    creates: /srv/shakenfist/venv/bin/activate

- name: Upgrade pip and install uv in the virtualenv
  ansible.builtin.command: /srv/shakenfist/venv/bin/pip install -U pip uv
  changed_when: true

- name: Install the Shaken Fist server and client packages
  # noqa: command-instead-of-shell -- shell word-splitting is required because
  # pip_extra may be empty or expand to several whitespace-separated arguments.
  ansible.builtin.shell: >-
    /srv/shakenfist/venv/bin/uv pip install --reinstall
    {{ pip_extra }} {{ server_package }} {{ client_package }}
  environment:
    VIRTUAL_ENV: /srv/shakenfist/venv
  changed_when: true

# Restart-on-change (1 of 2): decide whether the installed Shaken Fist CODE
# actually changed this run. The install above always reports changed (--reinstall
# rewrites the venv unconditionally), and the wheels themselves are rebuilt from
# source on every deploy -- python3 -m build embeds build timestamps, so the wheel
# BYTES differ every morning even when the source did not. Neither is a faithful
# "did the code change" signal. What IS faithful is the content of the INSTALLED
# package files: identical source produces byte-identical installed .py files
# regardless of how the wheel was packed. We hash those files into a marker; the
# marker changing is the signal register.yml gates daemon restarts on. This fires
# whenever the code that actually runs changed -- a develop bump that touched the
# Python source, a CI dirty rebuild (same version string, changed source), or a
# first install (marker absent) -- and stays quiet otherwise, so folding the
# deploy into a daily rotation no longer bounces every daemon every morning.
# Deliberately narrow in two ways. The .dist-info metadata directories are not
# under these package paths, so a bump that changes only the version string (a
# docs- or CI-only commit) leaves the hash untouched and correctly restarts
# nothing. And a pure runtime-dependency bump with no SF source change is not
# caught either -- acceptable, because uv does not upgrade already-satisfied
# dependencies on --reinstall, so in practice a dependency only moves alongside a
# source change this hash already sees. __pycache__ is excluded because .pyc
# files carry their own embedded timestamps.
- name: Compute the installed Shaken Fist code signature
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      find /srv/shakenfist/venv/lib/python3*/site-packages/shakenfist
      /srv/shakenfist/venv/lib/python3*/site-packages/shakenfist_client
      -type f -not -path '*__pycache__*' -print0
      | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
    executable: /bin/bash
  register: sf_code_signature
  changed_when: false

- name: Record the deployed code signature
  ansible.builtin.copy:
    dest: /srv/shakenfist/.deployed-code.sha256
    content: "{{ sf_code_signature.stdout }}\n"
    owner: root
    group: root
    mode: u=rw,go=r
  register: sf_code_marker

# Persist the decision as a host fact: register.yml runs in a SEPARATE, later
# play (the example playbook rolls the database tier serial: 1), and registered
# results do not survive a play boundary but set_fact host facts do.
- name: Remember whether the installed code changed this run
  ansible.builtin.set_fact:
    sf_code_changed: "{{ sf_code_marker is changed }}"

- name: Enable desired services
  ansible.builtin.service:
    name: "{{ item }}.service"
    enabled: true
    state: started
  with_items:
    - apparmor
    - libvirtd
  notify: Reload systemd
