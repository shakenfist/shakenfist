---
# Copy the CA certificate and this host's key/certificate (generated on the
# control node by host_certificate.yml) onto {{ hostname }}. By default these
# land in /etc/pki/libvirt-spice for libvirt's SPICE TLS to use.

- name: Validate the role's parameters
  ansible.builtin.include_tasks: validate.yml

# The default cert_group, kvm, is created by udev rather than by anything this
# collection installs, and site.yml distributes the SPICE certificate to every
# node, not only hypervisors. Without this a node lacking the group fails
# partway through the copies below with a bare chgrp error. A numeric gid is
# looked up by number and reported under its name, hence the check for any
# missing entry rather than for cert_group by name.
- name: Look up cert_group on the host
  ansible.builtin.getent:
    database: group
    key: "{{ cert_group }}"
    fail_key: false
  register: cert_group_lookup

- name: Check cert_group exists on the host
  ansible.builtin.assert:
    that:
      - cert_group_lookup.ansible_facts.getent_group | dict2items | selectattr('value', 'none') | list | length == 0
    fail_msg: >-
      cert_group is {{ cert_group | to_json }}, but {{ inventory_hostname }}
      has no such group. The default, kvm, is created by udev; install udev,
      or pass a cert_group the host has and, on a hypervisor, QEMU belongs to.
    quiet: true

- name: Create /etc/pki/CA
  ansible.builtin.file:
    path: /etc/pki/CA
    state: directory
    mode: '0755'
  tags: [system-dirs]

- name: Create the certificate destination directory
  ansible.builtin.file:
    path: "{{ cert_dest_dir }}"
    state: directory
    mode: '0755'

- name: Copy CA certificate to host
  ansible.builtin.copy:
    src: "{{ ca_cert_path }}"
    dest: "{{ cert_dest_dir }}/{{ cert_dest_ca_name }}"
    owner: "{{ cert_owner }}"
    group: "{{ cert_group }}"
    mode: "{{ cert_mode }}"

# The host key is generated on the control node as root, mode 0400 (umask 277
# in host_certificate.yml), so a controller-side `copy: src:` read fails when
# ansible runs as a non-root user -- i.e. whenever the control node is separate
# from the target (the collection model), rather than the legacy
# getsf-on-the-node-as-root model. Read it with a privileged slurp on the
# control node and install it via content, so the key stays 0400 in staging.
- name: Read this host's key from the control node
  ansible.builtin.slurp:
    src: "{{ host_key_path }}"
  delegate_to: localhost
  become: true
  register: host_key_material
  no_log: true

- name: Install host key on host
  ansible.builtin.copy:
    content: "{{ host_key_material.content | b64decode }}"
    dest: "{{ cert_dest_dir }}/{{ cert_dest_key_name }}"
    owner: "{{ cert_owner }}"
    group: "{{ cert_group }}"
    mode: "{{ cert_key_mode }}"
  no_log: true

- name: Copy host certificate to host
  ansible.builtin.copy:
    src: "{{ host_cert_path }}"
    dest: "{{ cert_dest_dir }}/{{ cert_dest_cert_name }}"
    owner: "{{ cert_owner }}"
    group: "{{ cert_group }}"
    mode: "{{ cert_mode }}"
