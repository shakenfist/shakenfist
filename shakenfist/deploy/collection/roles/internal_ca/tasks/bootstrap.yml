---
# Create the deployment's internal certificate authority on the control node.
# Idempotent: if the CA certificate already exists, nothing is regenerated.

- name: Validate the role's parameters
  ansible.builtin.include_tasks: validate.yml

# The control node may be unprivileged (sfcbr deploys with become disabled
# for localhost), so only touch apt when a tool is actually missing. Even
# with both installed, an apt task is not a no-op: it runs apt-mark manual
# on a package installed as a dependency (openssl usually is), and with
# state: latest it upgrades whatever has a newer candidate. Both need root.
- name: Check whether the CA setup tools are already installed
  ansible.builtin.shell: command -v certtool && command -v openssl
  register: ca_tools
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [packages]

- name: Install CA setup tools
  ansible.builtin.apt:
    name:
      - gnutls-bin
      - openssl
    state: present
  when: ca_tools.rc != 0
  register: apt_action
  retries: 100
  until: >-
    apt_action is success or
    ('Failed to lock apt for exclusive operation' not in apt_action.msg and
     '/var/lib/dpkg/lock' not in apt_action.msg)
  tags: [packages]

- name: Create the CA directory
  ansible.builtin.file:
    path: "{{ ca_path }}"
    state: directory
    mode: u=rwx

- name: Check if the CA is already set up
  ansible.builtin.stat:
    path: "{{ ca_cert_path }}"
  register: ca_cert

- name: Set up the CA template
  ansible.builtin.template:
    src: ca_template.tmpl
    dest: "{{ ca_template_path }}"
    # No owner: the invoking user owns the CA material. A root-run
    # creates root-owned files anyway, and hardcoding owner: root
    # breaks rootless control nodes (chown as non-root fails).
    mode: u=r
  when: not ca_cert.stat.exists

- name: Create CA authority key
  ansible.builtin.shell: umask 277 && certtool --generate-privkey > "{{ ca_key_path }}"
  changed_when: true
  when: not ca_cert.stat.exists

- name: Set permissions on the CA authority key
  ansible.builtin.file:
    path: "{{ ca_key_path }}"
    mode: u=r

- name: Create CA certificate
  ansible.builtin.command: >-
    certtool --generate-self-signed
      --template "{{ ca_template_path }}"
      --load-privkey "{{ ca_key_path }}"
      --outfile "{{ ca_cert_path }}"
  changed_when: true
  when: not ca_cert.stat.exists

- name: Set permissions on the CA certificate
  ansible.builtin.file:
    path: "{{ ca_cert_path }}"
    mode: ugo=r
