---
argument_specs:
  main:
    short_description: Bootstrap the CA, issue, and distribute a host certificate.
    description:
      - >-
        Runs bootstrap, host_certificate, and distribute_certificates in order.
        This is the correct entry point for a single-host deployment where the
        control node is also the target host. Multi-host playbooks invoke the
        individual entry points as separate plays instead.
    options: &ca_options
      deploy_name:
        type: str
        default: "sf"
        description:
          - Friendly name for this deployment's CA, used in the subject and file names.
      hostname:
        type: str
        default: "undefined"
        description:
          - >-
            The host whose certificate is being managed. Set to
            inventory_hostname by the consuming playbook.
      ca_path:
        type: str
        default: "/srv/shakenfist/pki/CA"
        description:
          - Directory on the control node holding the CA and per-host material.
      ca_cert_path:
        type: str
        description:
          - Path to the CA certificate. Defaults to a value derived from ca_path and deploy_name.
      ca_key_path:
        type: str
        description:
          - Path to the CA private key. Defaults to a value derived from ca_path and deploy_name.
      ca_template_path:
        type: str
        description:
          - Path to the CA certtool template. Defaults to a value derived from ca_path and deploy_name.
      host_cert_path:
        type: str
        description:
          - Path to the host certificate on the control node. Defaults to a value derived from ca_path and hostname.
      host_key_path:
        type: str
        description:
          - Path to the host private key on the control node. Defaults to a value derived from ca_path and hostname.
      host_template_path:
        type: str
        description:
          - Path to the host certtool template. Defaults to a value derived from ca_path and hostname.
      cert_name:
        type: str
        description:
          - Name used for the per-host file names on the control node. Defaults to hostname.
      cert_cn:
        type: str
        description:
          - Subject common name of the issued certificate. Defaults to hostname.
      cert_san_dns:
        type: list
        elements: str
        default: []
        description:
          - Extra DNS subject alternative names, one dns_name entry each.
      cert_san_ip:
        type: list
        elements: str
        default: []
        description:
          - Extra IP subject alternative names, one ip_address entry each.
      cert_expiration_days:
        type: int
        default: 365
        description:
          - Lifetime in days of an issued certificate.
      cert_renew_days:
        type: int
        default: 90
        description:
          - Reissue the certificate when fewer than this many days remain.
      cert_dest_dir:
        type: str
        default: "/etc/pki/libvirt-spice"
        description:
          - Directory on the target host the CA, certificate and key are installed into.
      cert_dest_ca_name:
        type: str
        default: "ca-cert.pem"
        description:
          - File name of the CA certificate within cert_dest_dir.
      cert_dest_cert_name:
        type: str
        default: "server-cert.pem"
        description:
          - File name of the host certificate within cert_dest_dir.
      cert_dest_key_name:
        type: str
        default: "server-key.pem"
        description:
          - File name of the host private key within cert_dest_dir.
      cert_owner:
        type: str
        default: "root"
        description:
          - Owner of the installed files.
      cert_group:
        type: str
        default: "root"
        description:
          - Group of the installed files.
      cert_mode:
        type: str
        default: "0444"
        description:
          - Mode of the installed CA and host certificates.
      cert_key_mode:
        type: str
        default: "0444"
        description:
          - Mode of the installed host private key.
  bootstrap:
    short_description: Create the deployment's internal certificate authority.
    description:
      - >-
        Idempotently generates the CA private key and self-signed CA
        certificate on the control node. Run once. Invoke via include_role with
        tasks_from set to bootstrap.
    options: *ca_options
  host_certificate:
    short_description: Issue or renew a host TLS certificate (SPICE by default).
    description:
      - >-
        Generates the per-host key and certificate on the control node against
        the CA. By default this is a SPICE TLS certificate, but the subject,
        alternative names and file names are controlled by the cert_*
        parameters. Invoke per host via include_role with tasks_from set to
        host_certificate.
    options: *ca_options
  distribute_certificates:
    short_description: Distribute the CA and host certificate onto a host.
    description:
      - >-
        Copies the CA certificate and the host's key/certificate from the
        control node into cert_dest_dir on the host (by default
        /etc/pki/libvirt-spice, for libvirt SPICE TLS). Invoke per host via
        include_role with tasks_from set to distribute_certificates.
    options: *ca_options
