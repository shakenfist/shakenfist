# Expected sf-database load, as a model rather than a number.
#
# Shaken Fist's database load is dominated by polling whose rate is set
# by how many things exist rather than by any work performed, so an
# absolute "expect under N queries per second" tells a deployer nothing
# about their own cluster. This file expresses the expectation as a
# decomposition instead:
#
#   expected_qps = per_node_base_qps   x nodes
#                + cluster_base_qps                 (once per cluster)
#                + per_instance_qps   x standing_instances
#
# and every consumer -- the functional CI check, the generated
# Prometheus rules, `sf-ctl database-load`, and our own nightly report
# -- reads this file rather than carrying its own copy. See
# docs/operator_guide/database.md for the operator's view and
# docs/plans/PLAN-database-load-reduction-phase-07-regression-detection.md
# for how the numbers were derived.
#
# DO NOT hand-edit levels to make a check pass. A budget that tracks
# whatever the code currently does is not a budget. If load has moved,
# either it is a regression worth fixing or the model has changed and
# the change belongs in a commit that says so.

version: 1

_doc:
  derived_from: sfcbr
  window: 2026-08-21T00:00:00Z/2026-08-24T18:00:00Z
  samples: 181 points at 1800s, each a 30m rate
  cluster_shape:
    nodes: 6
    roles: 6 hypervisors, of which 1 also network and 2 also database
    standing_instances: 8 minimum, 47 peak, 18.2 mean
  method: >-
    Per (operation, caller_daemon) pair, an ordinary least squares fit of
    the pair's rate against the cluster's standing instance count over
    the window. The fitted slope becomes per_instance_qps where it is
    significant (r-squared at least 0.30 and contributing at least
    0.15/s at 40 instances); the intercept becomes the base term.
  base_term_caveat: >-
    The split of the base between per_node_base_qps and cluster_base_qps
    is assigned from what the loop does, not fitted: sfcbr's node count
    did not vary across the window, so the data cannot separate the two.
    Work done by the elected cluster daemon is cluster_base_qps; work
    done by a daemon on every node is per_node_base_qps. A cluster with
    a different role mix -- a node that runs no hypervisor, say -- will
    read low against the per-node terms, and that is a modelling limit
    rather than a fault in the cluster.
  coverage_caveat: >-
    Only figures taken after 2026-08-11 are usable. Until #3708,
    database_requests_total was incremented by a gRPC server interceptor
    that could not see daemons co-located with MariaDB, which on sfcbr
    was two nodes of six and the whole cluster daemon whenever the
    maintenance lock sat on one of them. Coefficients from before that
    date undercount, and phase 6 spent a fortnight discovering it.
  coverage_of_total: >-
    These 105 pairs are the pairs averaging at least 0.10/s. They carry
    97.2% of measured load; the remaining 296 pairs together average
    4.1/s and none individually exceeds 0.10/s. An unbudgeted pair
    sustaining more than defaults.unbudgeted_fixed_rate_qps is treated
    as a new poll: it fails the CI check and fires
    ShakenFistUnbudgetedDatabasePolling. The inclusion cut sits well
    below that threshold on purpose. Deriving at 0.30 left five pairs
    which were quiet across a window averaging 18 standing instances
    and crossed 0.25/s once the same cluster reached 32, so each was a
    standing false alarm on the cluster the budget came from.
  rederive: >-
    tools/derive-database-load-budget.py, pointed at a Prometheus that
    has scraped an sf-database tier for several days across a range of
    instance counts. Re-derive after any change that removes a polling
    loop, and never from a window shorter than the slowest loop.

defaults:
  # A pair is over budget when it exceeds
  #   modelled x tolerance_multiplier + tolerance_floor_qps
  # The multiplier is deliberately generous: these detectors exist to
  # catch a new fixed-rate poll or a loop that lost its bulk read, not
  # to police a 10% drift on shared CI hardware.
  tolerance_multiplier: 2.0
  tolerance_floor_qps: 0.5
  # An (operation, caller_daemon) pair with no entry here is expected to
  # be activity-driven and near zero at idle. Sustaining more than this
  # on an idle cluster means something new is polling.
  unbudgeted_fixed_rate_qps: 0.25

