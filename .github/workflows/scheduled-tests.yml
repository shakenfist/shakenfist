name: Scheduled tests

# The functional cluster lanes which do not gate a merge, run weekly against
# develop. What each lane deploys and runs is defined in functional-lanes.yml,
# shared with the merge queue's lanes in functional-tests.yml, so a lane moves
# between the two by moving its name between the two 'lanes' lists.
#
# These lanes are here to take their nested clusters off every merge's share
# of the sfcbr under-cloud. That trade is only honest if a red run reaches a
# person, so report_failures files an issue per failed lane (labelled
# ci-failure, one open issue per lane, later failures as comments) naming the
# commit tested and the last one the lane passed on. See
# tools/ci_report_scheduled_failures.py.
#
# The cron is a stopgap. GitHub's schedule: has run hours late, and some
# days not at all, across both orgs since 2026-08-26
# (https://github.com/shakenfist/private-ci/blob/master/docs/nightly-report-dispatch.md),
# and the work in
# https://github.com/shakenfist/private-ci/blob/master/docs/plans/PLAN-periodic-ci.md
# will have the conductor dispatch this workflow into gaps in sfcbr's load
# instead. workflow_dispatch therefore takes no inputs:
# the conductor dispatches workflows without them. When that lands, the
# schedule below goes.

permissions:
  contents: read

# What every workflow on the self-hosted runners sets. A workflow-level env
# does not reach a called workflow, so this is for report_failures: it is how
# a red weekly lane reaches anyone, so it gets the same network path as every
# other job.
env:
  http_proxy: http://192.168.1.15:3128
  https_proxy: http://192.168.1.15:3128
  PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/
  # Fall back to pypi so a devpi cold-cache miss (empty index on a
  # first-touch package) cannot hard-fail the job.
  PIP_EXTRA_INDEX_URL: https://pypi.org/simple/

on:
  workflow_dispatch:
  schedule:
    # 02:00 on Saturday in Canberra (01:00 outside daylight saving), which
    # is when sfcbr has the most headroom: a load survey recorded in
    # https://github.com/shakenfist/private-ci/blob/master/docs/plans/PLAN-periodic-ci.md
    # found the headroom concentrated overnight and at weekends.
    - cron: '00 15 * * 5'        # utc, fridays

# Queue rather than cancel, as ci-headroom-health.yml does and for the same
# reason. Every lane this workflow calls carries a job-level concurrency
# group with cancel-in-progress true, keyed outside a merge group on
# github.ref -- through smoke-cluster.yml for the lanes which use it, and in
# its own job for Node lifecycle. Two runs of this workflow on develop share
# that ref, so a second dispatch used to cancel the first run's lanes. The
# weekly run then concluded cancelled rather than failure, and a cancelled
# run neither reaches report_failures nor sends a GitHub failure
# notification, so nobody heard (issue #4869). That is not hypothetical for
# long: the periodic CI plan at
# https://github.com/shakenfist/private-ci/blob/master/docs/plans/PLAN-periodic-ci.md
# has the conductor dispatching this workflow into gaps in sfcbr's load,
# which can overlap the cron or a manual run.
#
# A workflow-level group is the whole fix rather than half of it, because a
# queued run starts no jobs at all: the lane-level groups never see two runs
# of this workflow concurrently, so there is nothing left for them to cancel
# and they need no edit (theirs lives in shakenfist/actions anyway).
#
# The residue, stated because it is a real one: GitHub holds at most one
# pending run per concurrency group, so a third dispatch arriving while one
# run is in flight and one is already pending displaces the pending run,
# which concludes cancelled. That run tested nothing and lost nothing, which
# is why it is acceptable, but it is a silent cancellation and it is this
# one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weekly_lanes:
    # tools/ci_report_scheduled_failures.py identifies a lane by this name,
    # and report_failures passes it as --caller; change them together.
    name: "Weekly lanes"
    uses: ./.github/workflows/functional-lanes.yml
    with:
      caller_key: weekly
      lanes: >-
        ["ubuntu-2404-slim-primary", "debian-13-slim-tier", "debian-13-localhost",
         "ansible-modules", "node-lifecycle"]

  report_failures:
    name: "Report failures"
    needs: [weekly_lanes]
    # Also on cancelled. A cancelled run is usually one which tested nothing,
    # but it can also be one cancelled mid-flight after a lane had already
    # failed, and skipping those buried a real failure: the run concludes
    # cancelled, so neither this job nor a GitHub notification ran. Reporting
    # a cancellation costs no noise, because FAILED_CONCLUSIONS in the
    # reporter does not count a cancelled job as a failure -- a cancelled run
    # with no failed lane reports nothing. --lanes-result is what tells the
    # reporter which of the two it is looking at; see its comment on the
    # unattributed fallback.
    if: >-
      always() && (needs.weekly_lanes.result == 'failure'
      || needs.weekly_lanes.result == 'cancelled')
    runs-on: [self-hosted, static]
    # A handful of GitHub API calls.
    timeout-minutes: 10
    # actions: read lists this run's jobs and earlier runs'; issues: write
    # files the report. Naming any scope sets every unnamed one to none, so
    # contents: read is restated for the checkout.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: File or update an issue per failed lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci_report_scheduled_failures.py
          --repo "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --workflow scheduled-tests.yml
          --caller "Weekly lanes"
          --lanes-result "${{ needs.weekly_lanes.result }}"
