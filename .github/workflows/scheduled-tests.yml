name: Scheduled tests

# The functional cluster lanes which do not gate a merge, run weekly against
# develop. What each lane deploys and runs is defined in functional-lanes.yml,
# shared with the merge queue's lanes in functional-tests.yml, so a lane moves
# between the two by moving its name between the two 'lanes' lists.
#
# These lanes are here to take their nested clusters off every merge's share
# of the sfcbr under-cloud. That trade is only honest if a red run reaches a
# person, so report_failures files an issue per failed lane (labelled
# ci-failure, one open issue per lane, later failures as comments) naming the
# commit tested and the last one the lane passed on. See
# tools/ci_report_scheduled_failures.py.
#
# The cron is a stopgap. GitHub's schedule: has run hours late, and some
# days not at all, across both orgs since 2026-08-26
# (shakenfist/private-ci docs/nightly-report-dispatch.md), and private-ci's
# PLAN-periodic-ci.md will have the conductor dispatch this workflow into
# gaps in sfcbr's load instead. workflow_dispatch therefore takes no inputs:
# the conductor dispatches workflows without them. When that lands, the
# schedule below goes.

permissions:
  contents: read

# What every workflow on the self-hosted runners sets. A workflow-level env
# does not reach a called workflow, so this is for report_failures: it is how
# a red weekly lane reaches anyone, so it gets the same network path as every
# other job.
env:
  http_proxy: http://192.168.1.15:3128
  https_proxy: http://192.168.1.15:3128
  PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/
  # Fall back to pypi so a devpi cold-cache miss (empty index on a
  # first-touch package) cannot hard-fail the job.
  PIP_EXTRA_INDEX_URL: https://pypi.org/simple/

on:
  workflow_dispatch:
  schedule:
    # 02:00 on Saturday in Canberra (01:00 outside daylight saving), which
    # is when sfcbr has the most headroom: PLAN-periodic-ci's phase 0 survey
    # found almost all of it overnight and at weekends.
    - cron: '00 15 * * 5'        # utc, fridays

jobs:
  weekly_lanes:
    # tools/ci_report_scheduled_failures.py identifies a lane by this name,
    # and report_failures passes it as --caller; change them together.
    name: "Weekly lanes"
    uses: ./.github/workflows/functional-lanes.yml
    with:
      lanes: >-
        ["ubuntu-2404-slim-primary", "debian-13-slim-tier", "debian-13-localhost"]

  report_failures:
    name: "Report failures"
    needs: [weekly_lanes]
    # Not on cancelled: a cancelled run tested nothing and has nothing to
    # report.
    if: always() && needs.weekly_lanes.result == 'failure'
    runs-on: [self-hosted, static]
    # A handful of GitHub API calls.
    timeout-minutes: 10
    # actions: read lists this run's jobs and earlier runs'; issues: write
    # files the report. Naming any scope sets every unnamed one to none, so
    # contents: read is restated for the checkout.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: File or update an issue per failed lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci_report_scheduled_failures.py
          --repo "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --workflow scheduled-tests.yml
          --caller "Weekly lanes"
