name: Scheduled tests

permissions:
  contents: read

# NOTE(mikal): git repos are checked out to /srv/github/_work/{repo}/{repo}
# which is available as GITHUB_WORKSPACE. You can find other environment
# variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '00 13 * * *'        # utc
  # pull_request:
  #   branches:
  #     - develop
  #   paths:
  #     - '.github/workflows/scheduled-tests.yml'


env:
  http_proxy: http://192.168.1.15:3128
  https_proxy: http://192.168.1.15:3128
  PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/

jobs:
  # Scheduled multi-OS functional coverage. Each matrix entry deploys via the
  # shakenfist.shakenfist ansible collection (the reusable smoke-cluster
  # workflow), with the topology's inventory groups driving node roles.
  functional_matrix_collection:
    name: "${{ matrix.os.description }} (collection)"
    strategy:
      fail-fast: false
      matrix:
        os: [
          {
            description: 'develop branch on debian 12 single machine',
            job_name: 'develop-debian-12-localhost',
            base_image: 'sf://label/ci-images/debian-12',
            base_image_user: 'debian',
            topology: 'localhost',
            tier: 'smoke',
            concurrency: 3,
            stestr_config: 'cluster-ci.conf'
          },
          {
            description: 'develop branch on debian 12 cluster',
            job_name: 'develop-debian-12-slim-primary',
            base_image: 'sf://label/ci-images/debian-12',
            base_image_user: 'debian',
            topology: 'slim-primary',
            tier: 'full',
            concurrency: 5,
            stestr_config: 'cluster-ci.conf'
          },
          {
            description: 'develop branch on ubuntu 24.04 cluster',
            job_name: 'develop-ubuntu-2404-slim-primary',
            base_image: 'sf://label/ci-images/ubuntu-2404',
            base_image_user: 'ubuntu',
            topology: 'slim-primary',
            tier: 'full',
            concurrency: 5,
            stestr_config: 'cluster-ci.conf'
          }
        ]
    uses: shakenfist/actions/.github/workflows/smoke-cluster.yml@main
    secrets: inherit
    with:
      component: shakenfist
      component_ref: ${{ github.sha }}
      tier: ${{ matrix.os.tier }}
      topology: ${{ matrix.os.topology }}
      base_image: ${{ matrix.os.base_image }}
      base_image_user: ${{ matrix.os.base_image_user }}
      stestr_config: ${{ matrix.os.stestr_config }}
      test_concurrency: ${{ matrix.os.concurrency }}
      concurrency_key: ${{ matrix.os.job_name }}

