# NOTE(mikal): we need to pin indirect dependencies because some of our
# dependencies don't pin things how we like to. If they're not pinned then when
# something multiple layers away does a release and breaks us it can be super
# confusing.
#
# NOTE(mikal): this job runs on the shared [self-hosted, static] runners, which
# are long-lived and provisioned out of band (see the shakenfist deployer's
# github runner role). The static base image is expected to already provide:
# gh, git, and the python build toolchain (python3, python3-venv, python3-dev,
# python3-pip, python3-wheel, python3-cffi, and a distro grpcio). If a static
# runner is rebuilt without these, this workflow will fail at the venv step
# (or later at the gh pr create step).

name: Pin indirect dependencies

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: '00 00 * * *'        # utc


env:
  http_proxy: http://192.168.1.15:3128
  https_proxy: http://192.168.1.15:3128
  PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/

jobs:
  indirect-dependencies:
    runs-on: [self-hosted, static]
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Set environment variables
        run: |
          echo "SHAKENFIST_NAMESPACE=$(hostname)" >> $GITHUB_ENV

      - name: Checkout shakenfist
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPENDENCIES_TOKEN }}

      - name: Install all our dependencies in a venv
        run: |
          rm -rf ${GITHUB_WORKSPACE}/ci-venv
          python3 -m venv --system-site-packages ${GITHUB_WORKSPACE}/ci-venv
          . ${GITHUB_WORKSPACE}/ci-venv/bin/activate

          cd ${GITHUB_WORKSPACE}

          pip3 install uv
          uv pip install -r pyproject.toml

      - name: List all our dependencies
        run: |
          ${GITHUB_WORKSPACE}/ci-venv/bin/pip freeze --local

      - name: Ensure all dependencies are pinned
        env:
          GITHUB_TOKEN: ${{ secrets.DEPENDENCIES_TOKEN }}
        run: |
          cd ${GITHUB_WORKSPACE}

          datestamp=$(date "+%Y%m%d")
          git checkout -b pin-dependencies-${datestamp}

          for depver in $(${GITHUB_WORKSPACE}/ci-venv/bin/pip freeze --local); do
            dep=$(echo ${depver} | sed 's/==.*//')

            if [ $(egrep -ic "${dep}==" pyproject.toml) -lt 1 ]; then
              sed -i "s/    # END_OF_INDIRECT_DEPS/    \"${depver}\",\n    # END_OF_INDIRECT_DEPS/" pyproject.toml
            fi
          done

          # Did we find something new?
          if [ $(git diff | wc -l) -gt 0 ]; then
            echo "New dependencies detected..."
            echo
            git diff

            git config --global user.name "shakenfist-bot"
            git config --global user.email "bot@shakenfist.com"
            git commit -a -m "Update pinned dependencies."
            git push -f origin pin-dependencies-${datestamp}
            echo
            # Ensure the label exists before creating the PR
            gh label create dependencies --color 0075ca \
                --description "Pull requests that update a dependency file" \
                2>/dev/null || true

            gh pr create \
                --assignee mikalstill \
                --reviewer mikalstill \
                --title "Update pinned dependencies." \
                --body "New indirect dependencies were detected." \
                --label dependencies
            echo
            echo "Pull request created."
          fi