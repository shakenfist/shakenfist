# Propose a fix for an open GitHub issue with Claude Code
#
# Designed to soak up spare CI capacity: an external conductor (or a
# human) dispatches this workflow, a cheap triage pass picks the most
# promising open issue, and Claude Code attempts a fix which is
# published as a draft pull request for human review. The commit is
# tagged with "Fixes #NNNN" so the issue closes automatically if the
# PR merges.
#
# The 'automated-fix-attempted' label is applied to the selected
# issue at the *start* of the attempt, so crashed or timed out
# attempts are still recorded and not retried. Remove the label to
# allow another attempt.
#
# SECURITY CONSIDERATIONS:
# - Issue text is untrusted model input in general. Triage only
#   considers issues authored by users with write access to the
#   repository, and only comments from such users are fed to the
#   model. Third parties therefore cannot inject instructions into
#   an agent with push access via the issue thread.
# - Dispatching with an explicit issue_number bypasses the author
#   check: doing so asserts a human has read and trusts the issue
#   text. Comment filtering still applies.
# - Only users with write access can dispatch this workflow.
# - The output is always a draft PR (or an issue comment); the
#   workflow has no path to merging code.
#
# NOTES:
# - Both jobs are told to consider docs/plans/. Triage skims
#   docs/plans/index.md and deprioritises issues a not-yet-landed
#   plan already owns; the fix job reads the relevant plan files
#   from the checkout before writing code, and declines with
#   NO_FIX when an outstanding phase is the proper home for the
#   fix. The plans are read at run time rather than summarised
#   into this prompt, because they change constantly.
# - The fix attempt runs through tools/claude-model-fallback.sh, which
#   tries each model in the `models` input in order and moves on when one
#   reports its subscription credit is exhausted (an HTTP 429 that the
#   claude CLI's own --fallback-model flag does not cover). Triage stays
#   pinned to Haiku, which is cheap enough not to need this.
# - GitHub does not run CI on pull requests created with the default
#   workflow token (this prevents recursive workflow triggering), so
#   the draft PR needs a human nudge -- push to it, or close and
#   reopen it -- before the full CI suite runs.
# - The model is asked for two blocks on stdout: a commit message and
#   a pull request description. The workflow falls back to a generic
#   template if either is missing, but a missing one is a real loss --
#   an automated PR whose description is just a diffstat costs the
#   reviewer the context the model already had. The "single shot"
#   section of the prompt exists because a run once backgrounded the
#   test suite and ended its turn waiting for it, which in -p mode
#   simply ends the session: the code changes survived, both blocks
#   did not.
# - Both blocks are pulled out of the captured output by
#   tools/extract-model-block.sh rather than by sed inline here. That
#   parsing has more edge cases than it looks (a model which emits a
#   block twice, a block with no closing marker, a block the model
#   wrapped in a fence anyway) and each is covered by
#   shakenfist/tests/test_extract_model_block.py. Extend the tests, not
#   this step, when a new shape of output turns up.
# - The model is asked to run tox -ecover and the workflow then runs it
#   again in "Verify fix". The duplication is deliberate: the model's
#   run is what lets it fix what it broke while it still has a turn,
#   and the workflow's run is the gate on publication, which cannot
#   trust the model's report of its own testing. Paying for the suite
#   twice is cheaper than publishing a broken fix or burning a whole
#   run on one.
# - The description is model output, so it is passed to gh with
#   --body-file. Never interpolate it into a shell string.
# - The issue-fix-<N> branches are owned by this workflow and are
#   force-updated on each attempt.
# - Scratch files (prompts, logs, captured output) live in
#   runner.temp, never the workspace: the workspace is the repo
#   checkout, and anything written there is swept into the commit by
#   "git add -A" and counted against the size cap.
#
# Template source: shakenfist/development/templates/issue-fix/

name: Propose issue fix with Claude Code

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Fix this specific issue (skips triage selection)'
        required: false
        default: ''
        type: string
      candidate_limit:
        description: 'Number of recent issues considered in triage'
        required: false
        default: '25'
        type: string
      max_turns:
        description: 'Maximum Claude turns for the fix'
        required: false
        default: '200'
        type: string
      max_diff_lines:
        description: 'Maximum non-test lines changed before the fix is too large for an automated PR'
        required: false
        default: '400'
        type: string
      models:
        description: 'Comma-separated models to try for the fix, in preference order'
        required: false
        default: 'claude-fable-5,claude-opus-5'
        type: string
      dry_run:
        description: 'Dry run (no label, no comments, no commits, no PR)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  http_proxy: http://192.168.1.15:3128
  https_proxy: http://192.168.1.15:3128
  PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/

  # Regular expression matching paths that are test changes. Lines
  # changed in matching files do not count against max_diff_lines.
  TEST_PATH_PATTERN: '^shakenfist/tests/|^shakenfist/deploy/shakenfist_ci/'
  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  triage:
    name: 'Select an issue to fix'
    runs-on: [self-hosted, claude-code]
    timeout-minutes: 30
    outputs:
      issue_number: ${{ steps.select.outputs.issue_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find candidate issues
        id: candidates
        if: inputs.issue_number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_LIMIT: ${{ inputs.candidate_limit }}
        run: |
          gh issue list \
            --repo ${{ github.repository }} \
            --search 'is:open -linked:pr -label:automated-fix-attempted sort:created-desc' \
            --limit "${CANDIDATE_LIMIT}" \
            --json number,title,body,author \
            > ${{ runner.temp }}/all-issues.json

          # Only issues filed by users with write access are
          # eligible: the issue text is fed to a model with push
          # access, and third parties must not be able to steer it.
          echo '{}' > ${{ runner.temp }}/perms.json
          for author in $(jq -r '[.[].author.login] | unique | .[]' \
              ${{ runner.temp }}/all-issues.json); do
            perm=$(gh api \
              "repos/${{ github.repository }}/collaborators/${author}/permission" \
              --jq '.permission' 2>/dev/null || echo 'none')
            jq --arg a "${author}" --arg p "${perm}" '. + {($a): $p}' \
              ${{ runner.temp }}/perms.json \
              > ${{ runner.temp }}/perms.tmp
            mv ${{ runner.temp }}/perms.tmp \
              ${{ runner.temp }}/perms.json
          done

          jq --slurpfile perms ${{ runner.temp }}/perms.json \
            '[.[] | select($perms[0][.author.login] as $p |
              $p == "admin" or $p == "write" or $p == "maintain")]' \
            ${{ runner.temp }}/all-issues.json \
            > ${{ runner.temp }}/eligible-issues.json

          count=$(jq length ${{ runner.temp }}/eligible-issues.json)
          echo "Found ${count} eligible issues"
          echo "count=${count}" >> $GITHUB_OUTPUT

      - name: Triage with Claude
        id: triage
        if: |
          inputs.issue_number == '' &&
          steps.candidates.outputs.count != '0'
        run: |
          cat > ${{ runner.temp }}/triage-prompt.txt << 'PROMPT_EOF'
          You are triaging open GitHub issues for this repository to
          select ONE issue for an automated fix attempt with a coding
          agent, or to decide that none are suitable.

          Selection criteria, in priority order:

          1. Achievable: the issue has a clear reproduction or a
             clear statement of expected behaviour, looks fixable at
             the root cause without major refactoring, and you
             estimate the fix at under 100 changed lines excluding
             tests. The fix must be coverable by unit tests.
          2. Not already owned by a plan: this repository plans
             significant work in advance as plan documents in
             docs/plans/. Skim docs/plans/index.md. If an issue is
             plainly the subject of a plan whose phases have not
             landed yet, prefer a different issue -- that fix
             belongs to the plan, not to an automated one-off.
          3. Important: among the issues which survive the first two
             criteria, prefer the most important (data loss >
             correctness > reliability > usability > cosmetic).

          The repository is checked out in the current directory.
          You may inspect the code to judge achievability, but keep
          it brief -- this is triage, not diagnosis. The index skim
          is a skim: the fix job does the real plan reading.

          Be conservative: selecting nothing is better than
          selecting an issue that needs deep design work.

          End your output with exactly these two lines:

          SELECTED_ISSUE: <number or none>
          REASON: <one sentence>

          # Candidate issues

          PROMPT_EOF

          jq -r '.[] | "## Issue #\(.number): \(.title)\n\n\(.body // "" | .[0:3000])\n\n---\n"' \
            ${{ runner.temp }}/eligible-issues.json \
            >> ${{ runner.temp }}/triage-prompt.txt

          claude -p "$(cat ${{ runner.temp }}/triage-prompt.txt)" \
            --dangerously-skip-permissions \
            --model claude-haiku-4-5 \
            --max-turns 15 \
            --output-format text \
            2>&1 | tee ${{ runner.temp }}/triage-output.txt \
            || true

          # Model output formatting varies (markdown emphasis,
          # trailing punctuation), so parse leniently: any 'none' on
          # the sentinel line means no selection, otherwise take the
          # first number on it. An unparseable line fails safe --
          # nothing is selected.
          sel_line=$(grep -i 'SELECTED_ISSUE' \
            ${{ runner.temp }}/triage-output.txt | \
            tail -1 || true)
          if echo "${sel_line}" | grep -qi 'none'; then
            selected='none'
          else
            selected=$(echo "${sel_line}" | \
              grep -oE '[0-9]+' | head -1 || true)
          fi
          echo "selected=${selected}" >> $GITHUB_OUTPUT

      - name: Record selection
        id: select
        env:
          EXPLICIT: ${{ inputs.issue_number }}
          TRIAGED: ${{ steps.triage.outputs.selected }}
        run: |
          if [ -n "${EXPLICIT}" ]; then
            selected="${EXPLICIT}"
          else
            selected="${TRIAGED}"

            # The selection is parsed from free-form model output,
            # and the issue bodies in the triage prompt could try to
            # spoof it. Re-assert that the selection is a member of
            # the eligible set, so a spoofed sentinel line cannot
            # redirect the fix job to a non-eligible issue.
            if echo "${selected}" | grep -qE '^[0-9]+$'; then
              member=$(jq --argjson n "${selected}" \
                'any(.[]; .number == $n)' \
                ${{ runner.temp }}/eligible-issues.json)
              if [ "${member}" != "true" ]; then
                echo "Triage selected #${selected}, which is not in"
                echo "the eligible set; ignoring the selection."
                selected='none'
              fi
            fi
          fi

          if echo "${selected}" | grep -qE '^[0-9]+$'; then
            echo "Selected issue #${selected}"
            echo "issue_number=${selected}" >> $GITHUB_OUTPUT
          else
            echo "No suitable issue found, nothing to do."
            echo "issue_number=" >> $GITHUB_OUTPUT
          fi

      - name: Upload triage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-fix-triage-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/all-issues.json
            ${{ runner.temp }}/eligible-issues.json
            ${{ runner.temp }}/triage-prompt.txt
            ${{ runner.temp }}/triage-output.txt
          retention-days: 14
          if-no-files-found: ignore

  fix:
    name: 'Attempt fix'
    needs: triage
    if: needs.triage.outputs.issue_number != ''
    runs-on: [self-hosted, claude-code]
    timeout-minutes: 120

    env:
      ISSUE_NUMBER: ${{ needs.triage.outputs.issue_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
      MODELS: ${{ inputs.models }}
      MAX_TURNS: ${{ inputs.max_turns }}
      MAX_DIFF_LINES: ${{ inputs.max_diff_lines }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "shakenfist-bot"
          git config --global user.email "bot@shakenfist.com"

      - name: Ensure labels exist
        if: inputs.dry_run != true
        run: |
          gh label create 'automated-fix-attempted' \
            --repo ${{ github.repository }} \
            --color 'D93F0B' \
            --description 'An automated fix was attempted; remove to allow a re-attempt' \
            2>/dev/null || true
          gh label create 'automated-fix' \
            --repo ${{ github.repository }} \
            --color '1D76DB' \
            --description 'Pull request proposed by the issue fix workflow' \
            2>/dev/null || true

      # The label is applied before any fix work so that crashes and
      # timeouts still leave the issue marked as attempted.
      - name: Mark attempt on issue
        if: inputs.dry_run != true
        run: |
          gh issue edit "${ISSUE_NUMBER}" \
            --repo ${{ github.repository }} \
            --add-label automated-fix-attempted
          gh issue comment "${ISSUE_NUMBER}" \
            --repo ${{ github.repository }} \
            --body "Starting an automated fix attempt.

          [View workflow run](${RUN_URL})

          The \`automated-fix-attempted\` label has been applied; remove it to allow a future re-attempt."

      - name: Create working branch
        run: |
          git branch -D "issue-fix-${ISSUE_NUMBER}" 2>/dev/null || true
          git checkout -b "issue-fix-${ISSUE_NUMBER}"

      # No apt step here: the claude-code runners have no passwordless
      # sudo, and none is needed -- the unit tests mock the database, so
      # the mariadb driver is never imported (see the sanity_checks
      # comment in functional-tests.yml). If system packages are ever
      # genuinely required, add them to the runner image in
      # mach33labs/33fl rather than apt-installing here.
      - name: Install project dependencies
        run: |
          python3 -mvenv ~/sf-venv
          . ~/sf-venv/bin/activate
          pip3 install uv
          uv pip install tox tox-uv

      - name: Fetch issue content
        run: |
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}" \
            > ${{ runner.temp }}/issue.json

          # Only comments from users with write access are passed to
          # the model -- anyone can comment on an issue, and those
          # comments must not be able to steer the fix. This is the
          # same collaborator-permission check triage applies to
          # issue authors (author_association is not used because
          # MEMBER does not imply write access to this repository).
          gh api --paginate \
            "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" | \
            jq -s 'add // []' \
            > ${{ runner.temp }}/comments-all.json

          echo '{}' > ${{ runner.temp }}/comment-perms.json
          for author in $(jq -r '[.[].user.login] | unique | .[]' \
              ${{ runner.temp }}/comments-all.json); do
            perm=$(gh api \
              "repos/${{ github.repository }}/collaborators/${author}/permission" \
              --jq '.permission' 2>/dev/null || echo 'none')
            jq --arg a "${author}" --arg p "${perm}" '. + {($a): $p}' \
              ${{ runner.temp }}/comment-perms.json \
              > ${{ runner.temp }}/comment-perms.tmp
            mv ${{ runner.temp }}/comment-perms.tmp \
              ${{ runner.temp }}/comment-perms.json
          done

          jq --slurpfile perms ${{ runner.temp }}/comment-perms.json \
            '[.[] | select($perms[0][.user.login] as $p |
              $p == "admin" or $p == "write" or $p == "maintain")]' \
            ${{ runner.temp }}/comments-all.json \
            > ${{ runner.temp }}/comments.json

      - name: Prepare Claude prompt
        run: |
          {
            echo "Please fix GitHub issue #${ISSUE_NUMBER}, described below."
            echo

            cat << 'CONTEXT_EOF'
          ## Context

          Shaken Fist is an opinionated, minimal cloud orchestration
          platform for VM and network management. Read AGENTS.md and
          ARCHITECTURE.md to understand the project structure before
          starting, and follow their links into docs/developer_guide/ --
          in particular coding_rules.md and standards.md -- before
          changing code. Both root files are indexes, so the rules
          themselves live behind those links.

          Code style: single quotes for strings, double quotes for
          docstrings, lines wrapped at 120 characters, no trailing
          whitespace.

          Unit tests are in shakenfist/tests/ and use
          testtools/stestr. Functional tests are in
          shakenfist/deploy/shakenfist_ci/.
          CONTEXT_EOF

            echo
            echo "## Issue #${ISSUE_NUMBER}: $(jq -r .title ${{ runner.temp }}/issue.json)"
            echo
            jq -r '.body // "(no description)"' ${{ runner.temp }}/issue.json
            echo
            echo '## Maintainer comments on the issue'
            echo
            jq -r '.[] | "### \(.user.login) at \(.created_at)\n\n\(.body)\n"' \
              ${{ runner.temp }}/comments.json

            cat << 'TASK_EOF'

          ## Before you start: check the design intent

          This project plans significant work in advance, as master
          plans and per-phase plans in docs/plans/, indexed by
          docs/plans/index.md. Many of those plans are only
          partially implemented. That matters to you in two ways: a
          plan whose early phases have landed has already
          established how code in its scope is expected to be
          written, and a plan whose later phases are outstanding
          often already describes the correct fix for a whole class
          of defect -- including, quite possibly, this issue.

          A fix which cuts across that intent is worse than no fix,
          because it has to be unpicked before the plan can
          proceed. So before you write any code:

          1. Read docs/plans/index.md: the sequencing narrative and
             the plan status table. Do not rely on any summary of
             it you may have seen elsewhere -- the plans change,
             and the file in this checkout is the current truth.
          2. Work out which plans, if any, have scope covering the
             code you expect to change or the class of defect this
             issue belongs to. Grep docs/plans/ for the modules,
             functions, tables and config options involved. Titles
             and the status table alone are not enough to judge
             this.
          3. READ those plan files, in full -- the master plan and
             the phase plans, both the phases which have landed and
             the phases which have not.

          Then decide, and state the decision in one sentence
          before you start work. If you are not declining, do not
          begin any line of that sentence with "NO_FIX:" -- the
          workflow treats such a line as a decision to stop:

          - No plan covers this: fix the issue normally.
          - A plan covers this and its landed phases established a
            pattern the fix should follow: follow that pattern,
            even where a smaller ad-hoc fix would also work.
          - A plan covers this and an outstanding phase would fix
            it properly: do NOT hand-roll a workaround now. Output
            "NO_FIX: owned by <plan file>, <which phase>" and stop.
            This is a good outcome, not a failure -- it is the
            reason this check exists.
          - A plan covers this and a small fix moves toward it
            without doing the plan's work: that is fine. Say which
            plan and why in the commit summary.

          ## How this run works

          You are a single, non-interactive `claude -p` invocation on
          a CI runner. Nothing will re-invoke you and nobody will
          answer you: when your turn ends the process exits, and any
          work you were intending to come back to is lost. So:

          - Do NOT background a long-running command and end your turn
            meaning to check on it later. The test suite in step 4 below
            takes a while: run it in the foreground and wait for it,
            however long it takes.
          - Do NOT end a turn describing what you are about to do. Do
            it instead.
          - The last thing you emit must be the two output blocks
            described below. A run which ends without them still
            commits the code, but under a placeholder commit message
            and a contentless pull request description -- which wastes
            the reviewer's time, not just the prose.

          ## Your task

          1. Diagnose the root cause of the issue. Fix the root
             cause, not the symptom.
          2. Include unit test coverage for the fix. If the fix is
             observable from the functional test suite, add
             functional coverage in shakenfist/deploy/shakenfist_ci/
             as well.
          3. Keep the non-test portion of the change small -- the
             target is under 100 changed lines excluding tests. If a
             correct fix genuinely requires major refactoring, do
             NOT attempt it: output "NO_FIX: <one line reason>",
             leave the tree unchanged, and stop.
          4. Run the test suite and ensure it passes:
             ```bash
             . ~/sf-venv/bin/activate
             tox -ecover
             ```
          5. Run `pre-commit run --all-files` and fix any issues.
          6. Stage all changes with git add (do NOT commit).
          7. Output a commit summary and a pull request description
             (see below).

          ## REQUIRED: Commit summary and PR description

          After completing your work and staging changes, you MUST
          output both of the blocks below, in this order, as the last
          thing you emit. Markers go on their own lines, and neither
          block is wrapped in a code fence. Inside a block, never write
          a line whose only content is one of the marker tokens: that
          ends the block early and the rest is discarded.

          ```
          COMMIT_SUMMARY_START
          <First line: 50 chars max, imperative mood, ends with period.>

          <Body: Wrap at 72 chars. Explain WHAT changed and WHY.>
          COMMIT_SUMMARY_END
          ```

          If any plan in docs/plans/ was relevant, end the body
          with a line of the form:

          Plan alignment: <plan file> -- <one sentence on how this
          change fits it>

          Do not include a "Fixes #NNNN" line in the summary -- the
          workflow adds that itself.

          ```
          PR_DESCRIPTION_START
          <Markdown, wrapped at 72 chars.>
          PR_DESCRIPTION_END
          ```

          This is what a reviewer reads before the diff, so write it
          for them rather than restating the issue back at them.
          Under whatever headings suit the change, cover:

          - What was actually wrong, and why. The root cause you
            found, not the symptom the issue reported. Where the
            issue's own diagnosis turned out to be incomplete or
            wrong, say so.
          - What you changed, and why each piece is needed. Call out
            anything a reviewer would otherwise have to
            reverse-engineer: a refactor done to make the fix
            possible, behaviour which deliberately did not change, a
            test which pins the old behaviour as a floor.
          - Anything in the issue you deliberately did NOT do, and
            why: a second cause you judged out of scope, follow-up
            work which deserves its own issue, a measurement which
            should be repeated once this merges.
          - Any judgement call a reviewer might reasonably make
            differently.

          Do NOT include a diffstat, a "Fixes #NNNN" line, a link to
          this workflow run, or a note about CI not starting -- the
          workflow appends all of those. Do not pad it either: a small
          mechanical fix deserves a short description.
          TASK_EOF
          } > ${{ runner.temp }}/claude-prompt.txt

          echo "Prompt prepared:"
          cat ${{ runner.temp }}/claude-prompt.txt

      - name: Run Claude Code to propose a fix
        id: claude_fix
        continue-on-error: true
        run: |
          if ! command -v claude &> /dev/null; then
            echo "claude_available=false" >> $GITHUB_OUTPUT
            echo "Error: Claude Code CLI not found"
            exit 1
          fi

          echo "claude_available=true" >> $GITHUB_OUTPUT

          start_time=$(date +%s)

          # Run the wrapper from a copy outside the workspace: Claude is
          # about to edit this checkout, and bash reads a script lazily as
          # it executes, so a fix which touched tools/ would corrupt the
          # running wrapper.
          cp tools/claude-model-fallback.sh ${{ runner.temp }}/

          # MODELS is tried in order, moving on when a model reports its
          # subscription credit is exhausted (HTTP 429). Every model being
          # out of credit exits 1 and produces no output, which the assess
          # step below sees as "no changes".
          ${{ runner.temp }}/claude-model-fallback.sh \
            --models "${MODELS}" \
            -- "$(cat ${{ runner.temp }}/claude-prompt.txt)" \
            --dangerously-skip-permissions \
            --max-turns "${MAX_TURNS}" \
            --output-format text \
            2>&1 | tee ${{ runner.temp }}/claude-output.txt \
            || true

          mkdir -p ${{ runner.temp }}/claude-logs
          find ~/.claude/projects -name "*.jsonl" \
            -newermt "@${start_time}" \
            -exec cp {} ${{ runner.temp }}/claude-logs/ \; \
            2>/dev/null || true

      - name: Assess Claude output
        id: assess
        if: steps.claude_fix.outputs.claude_available == 'true'
        run: |
          if grep -q '^NO_FIX:' ${{ runner.temp }}/claude-output.txt; then
            echo "Claude declined to fix this issue."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            if [ "${DRY_RUN}" != "true" ]; then
              reason=$(grep '^NO_FIX:' \
                ${{ runner.temp }}/claude-output.txt | head -1)
              gh issue comment "${ISSUE_NUMBER}" \
                --repo ${{ github.repository }} \
                --body "The automated fix attempt concluded this issue is not suitable for an automated fix:

          > ${reason}

          [View workflow run](${RUN_URL})"
            fi
            exit 0
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "Claude produced no changes."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            if [ "${DRY_RUN}" != "true" ]; then
              gh issue comment "${ISSUE_NUMBER}" \
                --repo ${{ github.repository }} \
                --body "The automated fix attempt produced no changes.

          [View workflow run](${RUN_URL})"
            fi
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Verify fix
        id: verify
        if: steps.assess.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          . ~/sf-venv/bin/activate
          set +e
          tox -ecover \
            2>&1 | tee ${{ runner.temp }}/verify-output.txt
          verify_exit_code=${PIPESTATUS[0]}
          set -e

          if [ ${verify_exit_code} -eq 0 ]; then
            echo "fix_succeeded=true" >> $GITHUB_OUTPUT
          else
            echo "fix_succeeded=false" >> $GITHUB_OUTPUT
          fi

          exit ${verify_exit_code}

      - name: Extract commit summary and PR description
        id: extract_summary
        if: steps.assess.outputs.has_changes == 'true'
        run: |
          # Both blocks are pulled out by tools/extract-model-block.sh,
          # which is unit tested in test_extract_model_block.py. The
          # parsing is subtle enough -- repeated blocks, truncated
          # blocks, fences the model was told not to emit -- that having
          # it inline here means having it untested here. Run it from a
          # copy outside the workspace for the same reason as the model
          # wrapper above: Claude has just edited this checkout and may
          # have touched tools/.
          cp tools/extract-model-block.sh ${{ runner.temp }}/

          summary_found=false
          description_found=false

          if ${{ runner.temp }}/extract-model-block.sh COMMIT_SUMMARY \
              ${{ runner.temp }}/claude-output.txt \
              ${{ runner.temp }}/commit-summary.txt
          then
            summary_found=true
          fi

          if ${{ runner.temp }}/extract-model-block.sh PR_DESCRIPTION \
              ${{ runner.temp }}/claude-output.txt \
              ${{ runner.temp }}/pr-description.txt
          then
            description_found=true
          fi

          # Neither block is fatal: the publish step falls back to a
          # generic body. Say so in the log, because a PR which turns up
          # with a contentless description is otherwise a mystery.
          if [ "${description_found}" != "true" ]; then
            echo "No usable PR description in the model output. The run"
            echo "probably ended its turn early -- check the tail of"
            echo "claude-output.txt in the artifacts."
          fi

          echo "summary_found=${summary_found}" >> $GITHUB_OUTPUT
          echo "description_found=${description_found}" >> $GITHUB_OUTPUT

      # The triage estimate of fix size is only an estimate. This is
      # the hard cap: an over-budget fix is never published as a PR,
      # but the branch is pushed for human inspection.
      - name: Measure change size
        id: measure
        if: steps.assess.outputs.has_changes == 'true'
        run: |
          git add -A
          nontest=$(git diff --cached --numstat | \
            awk -v pat="${TEST_PATH_PATTERN}" \
              '$3 !~ pat { if ($1 != "-") s += $1 + $2 } END { print s + 0 }')
          echo "Non-test lines changed: ${nontest} (cap: ${MAX_DIFF_LINES})"
          echo "nontest_lines=${nontest}" >> $GITHUB_OUTPUT

          if [ "${nontest}" -le "${MAX_DIFF_LINES}" ]; then
            echo "within_budget=true" >> $GITHUB_OUTPUT
          else
            echo "within_budget=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: |
          steps.verify.outputs.fix_succeeded == 'true' &&
          inputs.dry_run != true
        run: |
          if [ "${{ steps.extract_summary.outputs.summary_found }}" == "true" ]; then
            cat ${{ runner.temp }}/commit-summary.txt \
              > ${{ runner.temp }}/commit-message.txt
          else
            {
              echo "Fix issue #${ISSUE_NUMBER}."
              echo ""
              echo "Claude Code proposed a fix for this issue."
            } > ${{ runner.temp }}/commit-message.txt
          fi

          {
            echo ""
            echo "Fixes #${ISSUE_NUMBER}"
            echo ""
            echo "Triggered-By: issue-fix workflow, ${RUN_URL}"
            echo ""
            echo "Signed-off-by: Michael Still <mikal@stillhq.com>"
            echo "Assisted-By: Claude Code"
            echo "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>"
          } >> ${{ runner.temp }}/commit-message.txt

          git commit -F ${{ runner.temp }}/commit-message.txt

      - name: Publish draft PR
        if: |
          steps.verify.outputs.fix_succeeded == 'true' &&
          steps.measure.outputs.within_budget == 'true' &&
          inputs.dry_run != true
        run: |
          git push -f origin "issue-fix-${ISSUE_NUMBER}"
          sleep 5

          if [ "${{ steps.extract_summary.outputs.summary_found }}" == "true" ]; then
            PR_TITLE=$(head -1 \
              ${{ runner.temp }}/commit-summary.txt | \
              sed 's/\.$//')
          else
            PR_TITLE="Fix issue #${ISSUE_NUMBER}"
          fi

          # Second fallback tier: the commit message body, which is a
          # better summary than nothing. Extracted to a file first so it
          # can be tested for content -- a commit summary which is a bare
          # subject line with no body would otherwise publish a "##
          # Summary" heading with nothing under it, which reads as broken
          # rather than as terse.
          tail -n +2 ${{ runner.temp }}/commit-summary.txt 2>/dev/null | \
            sed '/./,$!d' > ${{ runner.temp }}/summary-body.txt || true

          # The description is model output, so it is written to a file
          # and passed with --body-file. It must never be interpolated
          # into a shell string: an unquoted heredoc would execute any
          # $(...) or backticks the model happened to write.
          {
            if [ "${{ steps.extract_summary.outputs.description_found }}" == "true" ]; then
              cat ${{ runner.temp }}/pr-description.txt
            elif [ -s ${{ runner.temp }}/summary-body.txt ]; then
              echo "## Summary"
              echo
              cat ${{ runner.temp }}/summary-body.txt
            else
              echo "## Summary"
              echo
              echo "Automated fix attempt for #${ISSUE_NUMBER}. The model"
              echo "left no usable prose describing the change, so read"
              echo "the diff rather than this."
            fi

            echo
            echo "Fixes #${ISSUE_NUMBER}"
            echo
            echo "## Changes"
            echo
            echo '```'
            git diff --stat HEAD~1
            echo '```'
            echo
            echo "## Automated verification"
            echo
            echo "The unit test suite (tox -ecover) passes on the runner."
            echo
            echo "Note: GitHub does not start CI on pull requests created"
            echo "with the default workflow token, so push to this PR or"
            echo "close and reopen it to trigger the full CI suite."
            echo
            echo "[Workflow run](${RUN_URL})"
            echo
            echo "---"
            echo "Generated with [Claude Code](https://claude.com/claude-code)"
          } > ${{ runner.temp }}/pr-body.md

          pr_url=$(gh pr create \
            --draft \
            --label automated-fix \
            --assignee mikalstill \
            --reviewer mikalstill \
            --title "${PR_TITLE}" \
            --body-file ${{ runner.temp }}/pr-body.md \
            --head "issue-fix-${ISSUE_NUMBER}")

          gh issue comment "${ISSUE_NUMBER}" \
            --repo ${{ github.repository }} \
            --body "An automated fix has been proposed in ${pr_url}."

      - name: Report over-budget fix
        if: |
          steps.verify.outputs.fix_succeeded == 'true' &&
          steps.measure.outputs.within_budget == 'false' &&
          inputs.dry_run != true
        run: |
          git push -f origin "issue-fix-${ISSUE_NUMBER}"

          gh issue comment "${ISSUE_NUMBER}" \
            --repo ${{ github.repository }} \
            --body "An automated fix was produced and passes tests, but it changes ${{ steps.measure.outputs.nontest_lines }} non-test lines (cap: ${MAX_DIFF_LINES}), which is too large to propose automatically.

          The changes have been pushed to the \`issue-fix-${ISSUE_NUMBER}\` branch for human review. No PR was created.

          [View workflow run](${RUN_URL})"

      - name: Report failure
        if: |
          steps.assess.outputs.has_changes == 'true' &&
          steps.verify.outputs.fix_succeeded != 'true' &&
          inputs.dry_run != true
        run: |
          TEST_OUTPUT=$(tail -c 2000 \
            ${{ runner.temp }}/verify-output.txt \
            2>/dev/null || echo "See workflow logs for details.")

          gh issue comment "${ISSUE_NUMBER}" \
            --repo ${{ github.repository }} \
            --body "An automated fix was attempted but the test suite does not pass with the changes, so nothing has been proposed.

          [View workflow run](${RUN_URL})

          **Last 2KB of test output:**
          \`\`\`
          ${TEST_OUTPUT}
          \`\`\`"

      - name: Dry run summary
        if: inputs.dry_run == true
        run: |
          echo "Dry run: no label was applied, no comments were"
          echo "posted, nothing was committed or pushed."
          echo ""
          git status
          git diff --cached --stat

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-fix-${{ env.ISSUE_NUMBER }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/issue.json
            ${{ runner.temp }}/comments.json
            ${{ runner.temp }}/claude-prompt.txt
            ${{ runner.temp }}/claude-output.txt
            ${{ runner.temp }}/verify-output.txt
            ${{ runner.temp }}/commit-summary.txt
            ${{ runner.temp }}/commit-message.txt
            ${{ runner.temp }}/pr-description.txt
            ${{ runner.temp }}/pr-body.md
            ${{ runner.temp }}/claude-logs/
          retention-days: 14
          if-no-files-found: ignore
