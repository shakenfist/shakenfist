# Triggers a re-review of a PR when an authorized user comments
# "@shakenfist-bot please re-review"
#
# Template source: shakenfist/development/templates/ci-review-automation/
#
# The trigger and the review are separate jobs on purpose. A claude-code
# runner is scarce, and doing the permission check, the reaction and the
# refusal reply on one would hold a claude-code runner for every comment
# containing the phrase -- including comments from people with no write
# access at all.
#
# The trigger handling is pr-bot-trigger rather than inline shell. An
# earlier version of this file open-coded it, and the copy drifted: it
# reacted with +1 rather than rocket, worded its refusal differently,
# never checked the trigger phrase itself so it could not tell "phrase
# not matched" from "not authorized", and -- once pr-bot-trigger grew a
# fork guard -- did not refuse fork pull requests at all. Using the
# shared action is what keeps this file getting fixes made elsewhere.
name: PR Re-review

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]

jobs:
  trigger-re-review:
    name: "Trigger re-review"
    # Only run on PR comments (not issue comments), and never on a
    # comment the bot itself posted: the automated review is
    # model-generated text posted to the pull request, and a review
    # that mentions a trigger phrase would re-fire the lane.
    # contains() does not care that the phrase is inside a quote.
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@shakenfist-bot please re-review')
    runs-on: [self-hosted, static]
    # Just a few gh API calls, so anything beyond this is a hang.
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.trigger.outputs.authorized }}
      same_repo: ${{ steps.trigger.outputs.same-repo }}
      pr_number: ${{ github.event.issue.number }}

    steps:
      # pr-bot-trigger refuses fork pull requests as well as
      # unauthorised commenters, and folds both into `authorized`.
      - name: Handle trigger
        id: trigger
        uses: shakenfist/actions/pr-bot-trigger@main
        with:
          trigger-phrase: 'please re-review'
          reaction: 'rocket'

      # The re-review job below requires same_repo as well as
      # authorized. If pr-bot-trigger ever renames or drops its
      # same-repo output, that expression reads empty and the re-review
      # silently never runs -- after the rocket reaction has been
      # posted, the acknowledgement-followed-by-silence the resolve step
      # works to avoid. The guard stays fail-closed either way; this
      # makes the failure visible. authorized already requires a
      # same-repository head inside the action, so anything other than
      # 'true' here is the action and this file disagreeing.
      #
      # Every output the job below depends on is checked, not only
      # same-repo: a step gated on authorized == 'true' would skip
      # itself exactly when authorized goes missing. triggered is read
      # first because the job's contains() is case-insensitive and the
      # action's phrase match is not, so a comment that differs only in
      # case legitimately gets triggered=false and no authorized at all.
      - name: Confirm pr-bot-trigger reported the pull request's origin
        env:
          TRIGGERED: ${{ steps.trigger.outputs.triggered }}
          AUTHORIZED: ${{ steps.trigger.outputs.authorized }}
          SAME_REPO: ${{ steps.trigger.outputs.same-repo }}
        run: |
          fail() {
            echo "$1"
            echo "Either the output was renamed or dropped in"
            echo "shakenfist/actions, or the action and this file disagree."
            echo "Refusing to go on to a re-review that would not run."
            exit 1
          }
          case "${TRIGGERED}" in
            false) exit 0 ;;
            true) ;;
            *) fail "pr-bot-trigger reported triggered as '${TRIGGERED}'." ;;
          esac
          case "${AUTHORIZED}" in
            false) exit 0 ;;
            true) ;;
            *) fail "pr-bot-trigger reported authorized as '${AUTHORIZED}'." ;;
          esac
          if [ "${SAME_REPO}" != "true" ]; then
            fail "pr-bot-trigger authorized this request but reported same-repo as '${SAME_REPO}'."
          fi

  re-review:
    name: "Re-review PR"
    needs: trigger-re-review
    # same_repo is redundant -- pr-bot-trigger already folds it into
    # authorized -- and it is here anyway. This job puts a pull
    # request's code on a runner holding a write-scoped token, so the
    # fork guard is the one thing in this file worth stating twice: a
    # regression in the shared action cannot quietly widen what runs
    # here, and a reader (or a scanner) can see the restriction without
    # leaving the file.
    if: >-
      needs.trigger-re-review.outputs.authorized == 'true' &&
      needs.trigger-re-review.outputs.same_repo == 'true'
    runs-on: [self-hosted, claude-code]
    # A review normally finishes in three to six minutes. Without this
    # the job inherits the six hour GitHub default, so a wedged Claude
    # run would hold a scarce claude-code runner for the rest of the day.
    timeout-minutes: 60
    # Two re-review requests in quick succession would otherwise run
    # concurrently on the scarce runner and post two reviews on the same
    # pull request. The automatic lane -- the reusable workflow at
    # shakenfist/actions/.github/workflows/pr-auto-review.yml, called
    # from this project's own CI workflow -- carries the same guard.
    concurrency:
      group: pr-re-review-${{ github.event.issue.number }}
      cancel-in-progress: true

    steps:
      # The pull request's code, not the default branch. Without a ref:
      # an issue_comment event checks out the default branch, and
      # review-pr-with-claude.sh opens every prompt by reading
      # AGENTS.md, ARCHITECTURE.md and README.md from the working
      # directory -- so a re-review would judge the change against the
      # conventions as they were *before* it. The diff itself comes
      # from the API and is unaffected, which is what makes the symptom
      # subtle: a real review, calibrated wrongly.
      # shakenfist/actions/.github/workflows/pr-auto-review.yml checks
      # out the merge ref for this reason and says so in its header. It
      # lives in that repository, not this one, so there is nothing
      # alongside this file to compare against.
      #
      # This puts the pull request's code on the runner, which is
      # exactly why pr-bot-trigger refusing fork pull requests above is
      # load bearing rather than tidiness.
      #
      # persist-credentials: false because this working tree holds the
      # pull request's code and the next step runs Claude Code over it
      # with --dangerously-skip-permissions. The default leaves a
      # write-scoped token in .git/config of exactly that tree.
      # review-pr-with-claude authenticates gh from GH_TOKEN and never
      # pushes, so it does not need the git credential helper.
      # The retired pr-address-comments.yml always did this; this
      # file did not.
      #
      # The merge ref is resolved rather than named, because a named one
      # is right only when GitHub's copy is both present and current,
      # and it can be neither.
      #
      # Present: refs/pull/N/merge exists only while GitHub can compute
      # a merge commit, so naming it can fail the checkout with a bare
      # "couldn't find remote ref" *after* the rocket reaction has been
      # posted -- an acknowledgement followed by silence. Note that a
      # conflicted pull request is not reliably that case: measured
      # against shakenfist/shakenfist on 2026-09-07, every open pull
      # request had a merge ref including the one GitHub reported as
      # CONFLICTING. The ref survives a conflict; it is simply not
      # guaranteed to.
      #
      # Current is the case which actually bites, and it is silent.
      # GitHub recomputes the merge commit asynchronously after a push,
      # so for a window afterwards the published ref still merges the
      # *previous* head. Reviewing it then produces a real review of the
      # wrong commit -- the same class of bug as reviewing the default
      # branch, which is what checking out a merge ref was introduced to
      # fix. Measured on the same day, shakenfist/shakenfist#4107 was
      # serving a merge ref one push behind its head.
      #
      # So: confirm the merge commit's second parent is the head this
      # review is for (a merge commit's parents are base then head),
      # give the recomputation a bounded moment to catch up, and only
      # then fall back to the head ref. The fallback is a review of the
      # right code seen without the base, which is worth having; a
      # review of superseded code is not.
      - name: Resolve the ref to review
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.trigger-re-review.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          # gh api rather than git ls-remote: this runs before the
          # checkout, and ls-remote against a private repository would
          # need the token in the URL, where it lands in the log.
          if ! head_sha=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" \
              --jq '.head.sha'); then
            echo "Cannot read the pull request, so there is no head to"
            echo "check a merge ref against. Failing rather than"
            echo "reviewing whatever a fallback would reach."
            exit 1
          fi

          # Everything below decides what to review by comparing this
          # value against a merge commit's parent, so it has to be a
          # sha rather than merely a string gh printed. --jq on an
          # absent field yields the literal "null", which would compare
          # equal to the "null" a single-parent commit yields for
          # .parents[1].sha -- two absent values agreeing is not a
          # match. The same reasoning as the stdout-on-404 note below,
          # applied to the other end of the comparison.
          case "${head_sha}" in
            '' | *[!0-9a-f]*)
              echo "The pull request reports its head as '${head_sha}',"
              echo "which is not a sha. Failing rather than comparing"
              echo "it against a merge commit's parent."
              exit 1
              ;;
          esac
          echo "Pull request head is ${head_sha}"
          echo "head_sha=${head_sha}" >> $GITHUB_OUTPUT

          # gh api writes the error body to *stdout* on a 404 and exits
          # non-zero, so the exit status is the only thing which says
          # whether a ref is there. An earlier draft of this step tested
          # the output for emptiness instead and read the "Not Found"
          # document as a sha: it still fell back, because that string
          # matches no head, but it logged "merge ref is behind" for a
          # ref which did not exist. A diagnostic which cannot tell the
          # two apart is how this sort of thing stays unnoticed.
          #
          # reason carries which of the three ways this can fail was
          # the last one seen, so the comment posted on the pull
          # request can say what actually happened rather than guessing
          # at the most quotable cause. It is only read when merged is
          # false.
          merged=false
          reason=absent
          for attempt in 1 2 3 4 5 6; do
            if ! merge_sha=$(gh api \
                "repos/${REPO}/git/ref/pull/${PR_NUMBER}/merge" \
                --jq '.object.sha' 2>/dev/null); then
              reason=absent
              echo "Attempt ${attempt}: no merge ref published"
            elif ! parent=$(gh api "repos/${REPO}/commits/${merge_sha}" \
                --jq '.parents[1].sha' 2>/dev/null); then
              reason=unreadable
              echo "Attempt ${attempt}: cannot read merge commit ${merge_sha}"
            elif [ "${parent}" = "${head_sha}" ]; then
              merged=true
              break
            else
              reason=stale
              echo "Attempt ${attempt}: merge ref merges ${parent}, not the head"
            fi
            # Only worth waiting if there is another attempt to wait for.
            # This step runs on the scarce claude-code runner.
            [ "${attempt}" = "6" ] || sleep 5
          done

          if [ "${merged}" = "true" ]; then
            echo "ref=refs/pull/${PR_NUMBER}/merge" >> $GITHUB_OUTPUT
            echo "merged=true" >> $GITHUB_OUTPUT
            echo "Reviewing the merge of ${head_sha} into the base"
          else
            echo "ref=refs/pull/${PR_NUMBER}/head" >> $GITHUB_OUTPUT
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "reason=${reason}" >> $GITHUB_OUTPUT
            echo "Falling back to the pull request head ${head_sha}"
          fi

      - name: Checkout the pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # core.hooksPath=/dev/null because the checkout above put the
      # pull request's code on the runner and the steps after it run
      # over that tree. Hooks are not tracked in a checkout, so this is
      # defence in depth rather than a hole being closed -- but the
      # security model claims the control, and a claimed control that
      # is not set is worse than one that was never promised. It sits
      # immediately after the checkout so the ordering the model
      # describes holds by construction: a step added below it inherits
      # the setting whether or not whoever added it was thinking about
      # hooks. Set on the repository rather than --global: this job
      # runs on the shared claude-code pool, and a global setting would
      # change state every other repository's jobs on that machine
      # inherit. The security model is documented at
      # https://github.com/shakenfist/development/blob/main/docs/ci-review-automation.md
      - name: Disable git hooks
        run: git config core.hooksPath /dev/null

      # The step above resolved a ref *name*, and a name is not the sha
      # it validated: between that step and the checkout a push can
      # move the head and GitHub can republish the merge ref, so what
      # landed here is not necessarily what was checked. The window is
      # small, but reviewing a commit nobody validated is the exact bug
      # the resolve step exists to close, so confirm what is actually
      # in the tree and fail loudly rather than quietly reviewing it.
      # The requester can ask again; a wrong review looks right.
      #
      # This runs on both paths. The head fallback checks out
      # refs/pull/N/head, which is just as much a name as the merge ref
      # and has the same race; an earlier version of this step ran only
      # on the merge path, so a push landing in that window on the
      # fallback path was reviewed with no warning.
      #
      # The two races are not the same failure. On the merge path the
      # tree is a merge of *superseded* code. On the head path it is the
      # *newer* head, which agrees with the diff the review fetches, so
      # the review would be current -- but of a commit the resolve step
      # never looked at. Failing on both is deliberate: the property
      # this step holds is "the tree is what was validated", not "the
      # review is stale", and one rule is easier to trust than two.
      - name: Confirm the checkout is the validated commit
        env:
          HEAD_SHA: ${{ steps.ref.outputs.head_sha }}
          MERGED: ${{ steps.ref.outputs.merged }}
        run: |
          case "${MERGED}" in
            true)
              # Explicit rather than left to `bash -e`, which would
              # abort the step on a non-merge HEAD with git's own
              # message and nothing about why this job cared.
              if ! reviewed=$(git rev-parse HEAD^2 2>/dev/null); then
                echo "The tree checked out is not a merge commit, so it is"
                echo "not the merge of ${HEAD_SHA} the resolve step validated."
                exit 1
              fi
              what="merge commit checked out merges"
              ;;
            false)
              if ! reviewed=$(git rev-parse HEAD 2>/dev/null); then
                echo "The tree checked out has no HEAD, so it is not"
                echo "the ${HEAD_SHA} the resolve step validated."
                exit 1
              fi
              what="head checked out is"
              ;;
            *)
              echo "The resolve step reported merged as '${MERGED}', so"
              echo "there is no way to say what this checkout should be."
              exit 1
              ;;
          esac
          if [ "${reviewed}" != "${HEAD_SHA}" ]; then
            echo "The ${what} ${reviewed}, but the resolve step validated"
            echo "${HEAD_SHA}. The head moved between the two, so this tree"
            echo "is not the code the review was asked for. Comment again"
            echo "to review the new head."
            exit 1
          fi
          echo "Checkout confirmed as ${HEAD_SHA} (merged=${MERGED})"

      # Which ref was reviewed is a property of the review, so say it on
      # the pull request rather than only in the run log. A review of the
      # head is worth having; a reader who thinks it is a review of the
      # merge result is not. Posted by the bot, so the bot-comment guard
      # on the trigger job above keeps it from re-firing this workflow.
      #
      # The cause comes from the resolve step rather than being asserted
      # here. An earlier draft named a conflict with the base, which is
      # the least likely of the three paths into this step and is the
      # one the measurement above disproved: a reader seeing it on a
      # pull request that merges cleanly would go looking for a conflict
      # which is not there. The body is assembled with a heredoc because
      # a multi-line --body argument keeps its newlines, and GitHub
      # renders those as line breaks -- the notice arrived as five short
      # broken lines rather than a paragraph.
      - name: Say that the head was reviewed, not the merge result
        if: steps.ref.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.trigger-re-review.outputs.pr_number }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.ref.outputs.reason }}
        run: |
          # Assembled by appending rather than written across source
          # lines: a literal newline inside cause survives into the
          # comment body, and GitHub renders single newlines as line
          # breaks.
          case "${REASON}" in
            stale)
              cause="the merge commit GitHub publishes for it still merges"
              cause="${cause} an earlier head, and had not caught up by the"
              cause="${cause} time this review started"
              ;;
            unreadable)
              cause="the merge commit GitHub publishes for it could not be"
              cause="${cause} read"
              ;;
            *)
              cause="GitHub is not publishing a merge commit for it at all,"
              cause="${cause} which can mean the branch conflicts with its"
              cause="${cause} base"
              ;;
          esac
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file - <<EOF
          Reviewing this pull request's head rather than its merge result: ${cause}. The review is of the proposed change itself, but it has not seen how that change lands on the base branch.
          EOF

      - name: Run automated reviewer
        uses: shakenfist/actions/review-pr-with-claude@main
        with:
          pr-number: ${{ needs.trigger-re-review.outputs.pr_number }}
          force: 'true'
