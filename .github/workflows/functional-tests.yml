name: Functional tests

permissions:
  contents: read

# The can_enqueue / can_merge scheme is as described at:
# https://boinkor.net/2023/11/neat-github-actions-patterns-for-github-merge-queues/
#
# Docs-only changes are detected by the check_paths job and skip the
# heavy test jobs. The can_enqueue / can_merge gates treat skipped
# dependencies as success, so docs-only PRs and merge queue entries
# pass through quickly.

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - develop
      - v*-releases


env:
  http_proxy: http://192.168.1.15:3128
  https_proxy: http://192.168.1.15:3128
  PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/

jobs:
  # Check if the last commit was from the bot to prevent infinite loops in
  # automated fixer jobs. This runs early so other jobs can depend on it.
  check_bot_commit:
    name: "Check bot commit"
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, static]
    outputs:
      is_bot: ${{ steps.check.outputs.is_bot }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check if last commit was from bot
        id: check
        run: |
          LAST_AUTHOR_EMAIL=$(git log -1 --format='%ae')
          echo "Last commit author: $LAST_AUTHOR_EMAIL"
          if [ "$LAST_AUTHOR_EMAIL" = "bot@shakenfist.com" ]; then
            echo "is_bot=true" >> $GITHUB_OUTPUT
            echo "Last commit was from bot - automated fixers will be skipped"
          else
            echo "is_bot=false" >> $GITHUB_OUTPUT
          fi

  # Detect docs-only changes so we can skip heavy tests. For
  # workflow_dispatch the filter step is skipped and the output defaults
  # to code_changed=true so all tests run.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!mkdocs.yml'
              - '!mkdocs.yml.tmpl'

  # These sanity checks used to be three separate jobs, but are now combined
  # to save a little time and reduce CI runner churn.
  sanity_checks:
    name: "Sanity checks"
    permissions:
      contents: read
      pull-requests: write
    runs-on: [self-hosted, vm, debian-12]
    needs: [enqueue_pr_comment, check_paths]
    if: needs.check_paths.outputs.code_changed != 'false'
    outputs:
      flake8_failed: ${{ steps.flake8.outcome == 'failure' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true

    steps:
      - name: Checkout code with two commits
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev python3-mysqldb

      - name: Upgrade base test tools
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-test
          . /tmp/venv-test/bin/activate
          pip3 install uv
          uv pip install tox 'tox-uv<1.33.2'

      - name: Lint with flake8
        id: flake8
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          tox -eflake8

      - name: Type check with mypy
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          tox -emypy

      - name: Lint Ansible playbooks
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          uv pip install ansible-lint
          # Install external role dependency required by deploy.yml
          ansible-galaxy install andrewrothstein.etcd-cluster
          ansible-lint --config-file shakenfist/deploy/ansible/.ansible-lint \
              shakenfist/deploy/ansible/

      - name: Attempt to install requirements
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-reqs
          . /tmp/venv-reqs/bin/activate
          pip3 install uv
          uv pip install -r pyproject.toml

      - name: Run python3 unit tests and gather coverage data
        id: py3_tests
        timeout-minutes: 10
        run: |
          . /tmp/venv-test/bin/activate
          tox -ecover
          zip -r cover.zip cover

      - name: List failing tests
        if: ${{ failure() && steps.py3_tests.outcome == 'failure' }}
        id: failures
        run: |
          echo "Gathering list of failed tests..."
          touch /srv/ci/failed
          . /tmp/venv-test/bin/activate
          tox -efailing || true > /srv/ci/failed
          echo

          failed=$(cat /srv/ci/failed | egrep "^FAIL: " | \
              sed -z 's/FAIL: shakenfist_ci\.//g;s/\n/, /g;s/, $/\n/')

          echo "Failed tests:"
          cat /srv/ci/failed
          echo

          echo "failures<<EOF" >> ${GITHUB_OUTPUT}
          echo "${failed}" >> ${GITHUB_OUTPUT}
          echo "EOF" >> ${GITHUB_OUTPUT}
          echo "GITHUB_OUTPUT is:"
          cat ${GITHUB_OUTPUT}

      - name: Post failing tests to PR
        if: ${{ failure() && steps.py3_tests.outcome == 'failure' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build the comment body
          cat > /tmp/pr-comment.md << 'COMMENT_EOF'
          ## Unit Test Failures

          The following unit tests failed:

          ```
          COMMENT_EOF

          cat /srv/ci/failed >> /tmp/pr-comment.md

          cat >> /tmp/pr-comment.md << 'COMMENT_EOF'
          ```

          [View full test output](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          COMMENT_EOF

          # Post the comment
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/pr-comment.md

      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          retention-days: 90
          if-no-files-found: error
          path: cover.zip

      # Failures get announced here before we cancel stuff
      - uses: slackapi/slack-github-action@v2.1.1
        if: failure()
        with:
          method: chat.update
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            ts: "${{ needs.enqueue_pr_comment.outputs.ts }}"
            text: |
              The PR test attempt job at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

              PR title: ${{ github.event.pull_request.title }}
              PR link: ${{ github.event.pull_request.html_url }}
              PR author: ${{ github.event.pull_request.user.login }}
            attachments:
              - color: "ee9090"
                fields:
                  - title: "Status"
                    short: true
                    value: "Failure in sanity tests"

  # Runs if the "Lint with flake8" step in the sanity_checks job fails.
  # Uses always() so it runs even when sanity_checks fails.
  # Skip if the last commit was from the bot (checked by check_bot_commit job).
  automated_delinter:
    name: "Automated delinter"
    runs-on: [self-hosted, claude-code]
    needs: [sanity_checks, check_bot_commit]
    if: >-
      ${{ always() &&
          needs.sanity_checks.outputs.flake8_failed == 'true' &&
          needs.check_bot_commit.outputs.is_bot != 'true' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-delinter
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use DEPENDENCIES_TOKEN (a PAT) instead of GITHUB_TOKEN so that
          # commits pushed by this workflow will trigger other workflows.
          # The default GITHUB_TOKEN deliberately doesn't trigger workflows
          # to prevent infinite loops.
          token: ${{ secrets.DEPENDENCIES_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "Claude Code run by Shakenfist Bot"
          git config user.email "bot@shakenfist.com"

      - name: Run automated delinter
        run: |
          tools/fix-lint-with-claude.sh --ci

  functional_matrix_pr:
    name: "${{ matrix.pr.name }}"
    if: >-
      always() && github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, vm, debian-12]
    needs: [enqueue_pr_comment, check_paths]
    outputs:
      # For matrix jobs, we use a JSON object keyed by job_name. Each matrix run
      # sets its own key, and the outputs get merged. The consuming job can then
      # check if any value in the object is 'true'.
      check_logs_failed: ${{ toJSON(steps.set_output.outputs) }}
      exceptions_found: ${{ toJSON(steps.set_exceptions_output.outputs) }}
    strategy:
      fail-fast: false
      matrix:
        pr: [
          {
            name: 'Smoke tests',
            job_name: 'smoke',
            base_image: 'sf://label/ci-images/debian-12',
            base_image_user: 'debian',
            topology: 'localhost',
            concurrency: 3,
            stestr_config: 'smoke-ci.conf'
          },
        ]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.pr.job_name }}
      cancel-in-progress: true

    steps:
      - name: Log matrix details
        run: |
          echo "job_name: ${{ matrix.pr.job_name }}"
          echo "base_image: ${{ matrix.pr.base_image }}"
          echo "base_image_user: ${{ matrix.pr.base_image_user }}"
          echo "topology: ${{ matrix.pr.topology }}"
          echo "concurrency: ${{ matrix.pr.concurrency }}"

      - name: Setup test environment
        uses: shakenfist/actions/setup-test-environment@main

      - name: Build infrastructure
        run: |
          cd ${GITHUB_WORKSPACE}/actions
          ansible-playbook -i /home/debian/ansible-hosts \
              --extra-vars "identifier=${SHAKENFIST_NAMESPACE} \
              base_image=${{ matrix.pr.base_image }} base_image_user=${{ matrix.pr.base_image_user }}" \
              ansible/ci-topology-${{ matrix.pr.topology }}.yml

          if [ "${{ matrix.pr.topology }}" == "localhost" ]; then
            echo "UPLOAD_TARGET=10.0.0.10" >> $GITHUB_ENV
          else
            nodes=(10.0.0.20 10.0.0.21 10.0.0.22 10.0.0.23 10.0.0.24)
            random_index=$(( RANDOM % 5 ))
            echo "UPLOAD_TARGET=${nodes[$random_index]}" >> $GITHUB_ENV
          fi

      - name: Log environmental configuration
        run: |
          echo "## ci-environment.sh"
          cat ${GITHUB_WORKSPACE}/ci-environment.sh
          echo
          echo "## Environment variables"
          echo "SF_HEAD_SHA = ${SF_HEAD_SHA}"
          echo "SHAKENFIST_NAMESPACE = ${SHAKENFIST_NAMESPACE}"
          echo "UPLOAD_TARGET = ${UPLOAD_TARGET}"

      - name: Copy CI tools to primary
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -rp tools \
              ${{ matrix.pr.base_image_user }}@${primary}:.

          echo ""
          echo "Copied tools:"
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary} "ls tools"

      - name: Log github actions buffering status
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} python3 tools/buffer.py

      - name: Run getsf installer on primary
        timeout-minutes: 45
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary} /tmp/getsf-wrapper

      - name: Wait for API to start answering
        run: |
          set +e

          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary} 'sudo chmod ugo+r /etc/sf/* /var/log/syslog'

          count=0
          while [ $count -lt 60 ]
          do
            ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary} \
              '. /etc/sf/sfrc; /srv/shakenfist/venv/bin/sf-client instance list'
            if [ $? == 0 ]; then
              exit 0
            fi

            count=$(( $count + 1 ))
            sleep 5
          done

          exit 1

      - name: Import cached images
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh

          setup="export PATH=$PATH:/srv/shakenfist/venv/bin;"
          setup="${setup} . /etc/sf/sfrc;"
          setup="${setup} export SHAKENFIST_API_URL=http://localhost:13000;"
          setup="${setup} /srv/shakenfist/venv/bin/sf-client artifact upload"
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${UPLOAD_TARGET} \
              "${setup} debian-12 /srv/ci/debian:12 --shared --no-checksum"

      - name: Make the traces directory
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary} "sudo mkdir -p /srv/ci/traces; sudo chown -R ${{ matrix.pr.base_image_user }}:${{ matrix.pr.base_image_user }} /srv/ci/traces"

      - name: Run functional tests
        timeout-minutes: 45
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/shakenfist \
              ${{ matrix.pr.base_image_user }}@${primary}:shakenfist
          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/client-python \
              ${{ matrix.pr.base_image_user }}@${primary}:client-python

          script="cd shakenfist/;"
          script="${script} . /etc/sf/sfrc;"

          script="${script} python3 -mvenv /tmp/functests;"
          script="${script} . /tmp/functests/bin/activate;"
          script="${script} pip3 install -U uv;"
          script="${script} uv pip install -U -r pyproject.toml --all-extras;"
          script="${script} echo -e '\n\nvenv pip after packages:\n';"
          script="${script} pip3 list;"
          script="${script} echo -e '\n---\n';"

          script="${script} echo -e '\n\nInstall client-python:\n';"
          script="${script} cd ~/client-python;"
          script="${script} pip3 install .;"

          script="${script} cd ~/shakenfist/shakenfist/deploy/;"
          script="${script} set -e;"
          script="${script} stestr run --config ${{ matrix.pr.stestr_config }} --concurrency=${{ matrix.pr.concurrency}};"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary} "${script}"

      - name: List slowest tests
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh

          script=". /tmp/functests/bin/activate;"
          script="${script} cd shakenfist/shakenfist/deploy;"
          script="${script} stestr slowest --config ${{ matrix.pr.stestr_config }} || true;"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary} "${script}"

      - name: List failing tests
        if: failure()
        id: failures
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh

          echo "Gathering list of failed tests..."
          touch /srv/ci/failed
          script=". /tmp/functests/bin/activate;"
          script="${script} cd shakenfist/shakenfist/deploy;"
          script="${script} stestr failing --config ${{ matrix.pr.stestr_config }} || true;"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary} "${script}" > /srv/ci/failed
          echo

          failed=$(cat /srv/ci/failed | egrep "^FAIL: " | \
              sed -z 's/FAIL: shakenfist_ci\.//g;s/\n/, /g;s/, $/\n/')

          echo "Failed tests:"
          cat /srv/ci/failed
          echo

          echo "failures<<EOF" >> ${GITHUB_OUTPUT}
          echo "${failed}" >> ${GITHUB_OUTPUT}
          echo "EOF" >> ${GITHUB_OUTPUT}
          echo "GITHUB_OUTPUT is:"
          cat ${GITHUB_OUTPUT}

      - name: Check for exceptions on disk
        id: check_exceptions
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions

          script="sudo mkdir /srv/shakenfist/exceptions;"
          script="${script} sudo find /srv/shakenfist/exceptions -type f -ls;"
          tools/run_remote ${primary} "${script}"
          echo

          # Check if any exception files exist and set output
          EXCEPTION_COUNT=$(ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary} \
              "sudo find /srv/shakenfist/exceptions -type f 2>/dev/null | wc -l")
          echo "Exception files found: ${EXCEPTION_COUNT}"
          if [ "${EXCEPTION_COUNT}" -gt 0 ]; then
            echo "exceptions_found=true" >> $GITHUB_OUTPUT
          else
            echo "exceptions_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Check logs
        id: check_logs
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} "sudo bash tools/ci_log_checks.sh develop ${{ matrix.pr.job_name }}"

      - name: Set check_logs output for matrix aggregation
        id: set_output
        if: always()
        run: |
          echo "${{ matrix.pr.job_name }}=${{ steps.check_logs.outcome == 'failure' }}" >> $GITHUB_OUTPUT

      - name: Set exceptions output for matrix aggregation
        id: set_exceptions_output
        if: always()
        run: |
          echo "${{ matrix.pr.job_name }}=${{ steps.check_exceptions.outputs.exceptions_found }}" >> $GITHUB_OUTPUT

      # On Ubuntu 22.04 the cleaner is rated a CPU hog because of etcd cleanup
      # cost. That's not really something we can control, so just ignore the CPU
      # usage of that process instead.
      - name: Check SF process CPU usage
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary} '. /etc/sf/sfrc; /srv/shakenfist/venv/bin/sf-client node cpuhogs -t 1.75 --ignore sf_cleaner'

      - name: Check for reasonable data rates
        timeout-minutes: 5
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} "sudo bash tools/ci_event_checks.sh develop"

      - name: Fetch and tweak inventory
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.pr.base_image_user }}@${primary}:/etc/sf/inventory.yaml /srv/github/
          sed -i 's|/root/.ssh|/home/debian/.ssh|g' /srv/github/inventory.yaml
          sed -i 's|localhost|primary|g' /srv/github/inventory.yaml

          echo "====="
          cat /srv/github/inventory.yaml

      - name: Gather logs
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh

          mkdir -p /srv/github/artifacts
          mkdir -p /srv/github/bundle
          chmod ugo+rwx /srv/github /srv/github/artifacts /srv/github/bundle

          # Fetch unit test tracing. Sometimes this isn't present if we failed
          # super early in the CI job.
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -rp \
              ${{ matrix.pr.base_image_user }}@${primary}:/srv/ci/traces \
              /srv/github/bundle/ || true

          # We need the ssh key in the place ansible expects it to be, which isn't
          # true on the CI worker node.
          cp /srv/github/id_ci /home/debian/.ssh/id_rsa
          cp /srv/github/id_ci.pub /home/debian/.ssh/id_rsa.pub

          ansible-playbook -i /srv/github/inventory.yaml \
              --extra-vars "base_image_user=${{ matrix.pr.base_image_user }} \
              ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
              ${GITHUB_WORKSPACE}/actions/ansible/ci-gather-logs.yml

          # Zip it all up
          cd /srv/github
          sudo chown -R debian:debian /srv/github
          sudo find . -ls

          echo
          zip -rq artifacts/bundle.zip bundle/*

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bundle-functional-cluster-${{ matrix.pr.job_name }}
          retention-days: 90
          if-no-files-found: error
          path: /srv/github/artifacts/bundle.zip

      # Failures get announced here before we cancel stuff
      - uses: slackapi/slack-github-action@v2.1.1
        if: failure()
        with:
          method: chat.update
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            ts: "${{ needs.enqueue_pr_comment.outputs.ts }}"
            text: |
              The PR test attempt job at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

              PR title: ${{ github.event.pull_request.title }}
              PR link: ${{ github.event.pull_request.html_url }}
              PR author: ${{ github.event.pull_request.user.login }}
            attachments:
              - color: "ee9090"
                fields:
                  - title: "Status"
                    short: true
                    value: "Failure in functional matrix tests"

      - uses: slackapi/slack-github-action@v2.1.1
        if: failure()
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            thread_ts: "${{ needs.enqueue_pr_comment.outputs.ts }}"
            text: |
              Failures are:

              ${{ steps.failures.outputs.failures }}

  # Runs if exceptions are found on disk in any functional_matrix_pr matrix job.
  # Uses !cancelled() so it runs even when functional_matrix_pr fails.
  # The exceptions_found output is a JSON object with job_name keys and boolean
  # values. We check if any value contains 'true' to trigger this job.
  # Skip if the last commit was from the bot (checked by check_bot_commit job).
  automated_exception_fixer:
    name: "Automated exception fixer"
    permissions:
      contents: read
      actions: read
    runs-on: [self-hosted, claude-code]
    needs: [functional_matrix_pr, check_bot_commit]
    if: >-
      ${{ !cancelled() &&
          contains(needs.functional_matrix_pr.outputs.exceptions_found, 'true') &&
          needs.check_bot_commit.outputs.is_bot != 'true' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-exception-fixer
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use DEPENDENCIES_TOKEN (a PAT) instead of GITHUB_TOKEN so that
          # commits pushed by this workflow will trigger other workflows.
          # The default GITHUB_TOKEN deliberately doesn't trigger workflows
          # to prevent infinite loops.
          token: ${{ secrets.DEPENDENCIES_TOKEN }}

      - name: List failed jobs from matrix
        id: failed_jobs
        run: |
          # Parse the JSON output to find which matrix jobs had exceptions
          # The output is like: {"smoke": "true", "other": "false"}
          EXCEPTIONS_OUTPUT='${{ needs.functional_matrix_pr.outputs.exceptions_found }}'
          echo "Raw exceptions_found output: $EXCEPTIONS_OUTPUT"

          FAILED_JOBS=$(echo "$EXCEPTIONS_OUTPUT" | jq -r 'to_entries | .[] | select(.value == "true") | .key' | tr '\n' ' ')
          echo "Matrix jobs with exceptions: $FAILED_JOBS"
          echo "failed_jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT

      - name: Download bundles for failed jobs
        env:
          FAILED_JOBS: ${{ steps.failed_jobs.outputs.failed_jobs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir bundles
          for job in ${FAILED_JOBS}; do
            echo "Downloading bundle for failed job: ${job}"
            gh run download ${{ github.run_id }} \
              --name "bundle-functional-cluster-${job}" \
              --dir "bundles/${job}"
          done

          echo
          echo "Downloaded bundles:"
          ls -lh bundles

      - name: Configure git
        run: |
          git config user.name "Claude Code run by Shakenfist Bot"
          git config user.email "bot@shakenfist.com"

      - name: Run automated exception fixer
        env:
          BUNDLES_DIR: bundles
        run: |
          tools/fix-exceptions-with-claude.sh --ci

  automated_reviewer:
    name: "Automated reviewer"
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: [self-hosted, claude-code]
    needs: [sanity_checks, functional_matrix_pr, check_bot_commit]
    if: |
      github.event_name == 'pull_request' &&
      needs.check_bot_commit.outputs.is_bot != 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-reviewer
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run automated reviewer
        uses: shakenfist/actions/review-pr-with-claude@main
        with:
          pr-number: ${{ github.event.pull_request.number }}

  functional_matrix_merge:
    name: "${{ matrix.merge.name }}"
    if: >-
      github.event_name == 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    needs: [merge_pr_comment, check_paths]
    outputs:
      exceptions_found: ${{ toJSON(steps.set_exceptions_output.outputs) }}
    strategy:
      fail-fast: false
      matrix:
        merge: [
          {
            name: 'Debian 12 cluster',
            job_name: 'debian-12-slim-primary',
            base_image: 'sf://label/ci-images/debian-12',
            base_image_user: 'debian',
            topology: 'slim-primary',
            concurrency: 5,
            stestr_config: 'cluster-ci.conf'
          },
          {
            name: 'Ubuntu 24.04 cluster',
            job_name: 'ubuntu-2404-slim-primary',
            base_image: 'sf://label/ci-images/ubuntu-2404',
            base_image_user: 'ubuntu',
            topology: 'slim-primary',
            concurrency: 5,
            stestr_config: 'cluster-ci.conf'
          },
          {
            name: 'Guests',
            job_name: 'guests',
            base_image: 'sf://label/ci-images/debian-12',
            base_image_user: 'debian',
            topology: 'slim-primary',
            concurrency: 5,
            stestr_config: 'guest-ci.conf'
          }
        ]
    runs-on: [self-hosted, vm, debian-12]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.merge.job_name }}
      cancel-in-progress: true

    steps:
      - name: Log matrix details
        run: |
          echo "job_name: ${{ matrix.merge.job_name }}"
          echo "base_image: ${{ matrix.merge.base_image }}"
          echo "base_image_user: ${{ matrix.merge.base_image_user }}"
          echo "topology: ${{ matrix.merge.topology }}"
          echo "concurrency: ${{ matrix.merge.concurrency }}"

      - name: Setup test environment
        uses: shakenfist/actions/setup-test-environment@main

      - name: Build infrastructure
        run: |
          cd ${GITHUB_WORKSPACE}/actions
          ansible-playbook -i /home/debian/ansible-hosts \
              --extra-vars "identifier=${SHAKENFIST_NAMESPACE} \
              base_image=${{ matrix.merge.base_image }} base_image_user=${{ matrix.merge.base_image_user }}" \
              ansible/ci-topology-${{ matrix.merge.topology }}.yml

          if [ "${{ matrix.merge.topology }}" == "localhost" ]; then
            echo "UPLOAD_TARGET=10.0.0.10" >> $GITHUB_ENV
          else
            nodes=(10.0.0.20 10.0.0.21 10.0.0.22 10.0.0.23 10.0.0.24)
            random_index=$(( RANDOM % 5 ))
            echo "UPLOAD_TARGET=${nodes[$random_index]}" >> $GITHUB_ENV
          fi

      - name: Log environmental configuration
        run: |
          echo "## ci-environment.sh"
          cat ${GITHUB_WORKSPACE}/ci-environment.sh
          echo
          echo "## Environment variables"
          echo "SF_HEAD_SHA = ${SF_HEAD_SHA}"
          echo "SHAKENFIST_NAMESPACE = ${SHAKENFIST_NAMESPACE}"
          echo "UPLOAD_TARGET = ${UPLOAD_TARGET}"

      - name: Copy CI tools to primary
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -rp tools \
              ${{ matrix.merge.base_image_user }}@${primary}:.

          echo ""
          echo "Copied tools:"
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} "ls tools"

      - name: Log github actions buffering status
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} python3 tools/buffer.py

      - name: Run getsf installer on primary
        timeout-minutes: 30
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} /tmp/getsf-wrapper

      - name: Wait for API to start answering
        run: |
          set +e

          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} 'sudo chmod ugo+r /etc/sf/* /var/log/syslog'

          count=0
          while [ $count -lt 60 ]
          do
            ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} '. /etc/sf/sfrc; /srv/shakenfist/venv/bin/sf-client instance list'
            if [ $? == 0 ]; then
              exit 0
            fi

            count=$(( $count + 1 ))
            sleep 5
          done

          exit 1

      - name: Import cached images
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh

          setup="export PATH=$PATH:/srv/shakenfist/venv/bin;"
          setup="${setup} . /etc/sf/sfrc;"
          setup="${setup} export SHAKENFIST_API_URL=http://localhost:13000;"
          setup="${setup} /srv/shakenfist/venv/bin/sf-client artifact upload"

          # The cluster CI image, used by all CI types
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                ${{ matrix.merge.base_image_user }}@${UPLOAD_TARGET} \
                "${setup} debian-12 /srv/ci/debian:12 --shared --no-checksum"

          # Additional images used only by guest CI
          if [ "${{ matrix.merge.stestr_config }}" == "guest-ci.conf" ]; then
              ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.merge.base_image_user }}@${UPLOAD_TARGET} \
                  "${setup} ubuntu-2004 /srv/ci/ubuntu:20.04 --shared --no-checksum"
              ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.merge.base_image_user }}@${UPLOAD_TARGET} \
                  "${setup} debian-12 /srv/ci/debian:12 --shared --no-checksum"
              ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  ${{ matrix.merge.base_image_user }}@${UPLOAD_TARGET} \
                  "${setup} cirros /srv/ci/cirros --shared"
          fi

      - name: Create a base level of activity in the cluster
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} \
              'echo "==== sfrc ===="; cat /etc/sf/sfrc; echo "==== end sfrc ===="'
          echo ""
          echo ""
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} \
              '. /etc/sf/sfrc; for i in `seq 100`; do /srv/shakenfist/venv/bin/sf-client --async=continue network create background-$i 10.$i.0.0/24 > /dev/null; echo -n "."; done'
          echo ""

      - name: Make the traces directory
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} "sudo mkdir -p /srv/ci/traces; sudo chown -R ${{ matrix.merge.base_image_user }}:${{ matrix.merge.base_image_user }} /srv/ci/traces"

      - name: Run functional tests
        timeout-minutes: 120
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/shakenfist \
              ${{ matrix.merge.base_image_user }}@${primary}:shakenfist
          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/client-python \
              ${{ matrix.merge.base_image_user }}@${primary}:client-python

          script="cd shakenfist/;"
          script="${script} . /etc/sf/sfrc;"

          script="${script} python3 -mvenv /tmp/functests;"
          script="${script} . /tmp/functests/bin/activate;"
          script="${script} pip3 install -U uv;"
          script="${script} uv pip install -U -r pyproject.toml --all-extras;"
          script="${script} echo -e '\n\nvenv pip after packages:\n';"
          script="${script} pip3 list;"
          script="${script} echo -e '\n---\n';"

          script="${script} echo -e '\n\nInstall client-python:\n';"
          script="${script} cd ~/client-python;"
          script="${script} pip3 install .;"

          script="${script} cd ~/shakenfist/shakenfist/deploy/;"
          script="${script} set -e;"
          script="${script} stestr run --config ${{ matrix.merge.stestr_config }} --concurrency=${{ matrix.merge.concurrency}};"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} "${script}"

      - name: List slowest tests
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh

          script=". /tmp/functests/bin/activate;"
          script="${script} cd shakenfist/shakenfist/deploy;"
          script="${script} stestr slowest --config ${{ matrix.merge.stestr_config }} || true;"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} "${script}"

      - name: List failing tests
        if: failure()
        id: failures
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh

          echo "Gathering list of failed tests..."
          touch /srv/ci/failed
          script=". /tmp/functests/bin/activate;"
          script="${script} cd shakenfist/shakenfist/deploy;"
          script="${script} stestr failing --config ${{ matrix.merge.stestr_config }} || true;"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} "${script}" > /srv/ci/failed
          echo

          failed=$(cat /srv/ci/failed | egrep "^FAIL: " | \
              sed -z 's/FAIL: shakenfist_ci\.//g;s/\n/, /g;s/, $/\n/')

          echo "Failed tests:"
          cat /srv/ci/failed
          echo

          echo "failures<<EOF" >> ${GITHUB_OUTPUT}
          echo "${failed}" >> ${GITHUB_OUTPUT}
          echo "EOF" >> ${GITHUB_OUTPUT}
          echo "GITHUB_OUTPUT is:"
          cat ${GITHUB_OUTPUT}

      - name: Check for exceptions on disk
        id: check_exceptions
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions

          script="sudo mkdir /srv/shakenfist/exceptions;"
          script="${script} sudo find /srv/shakenfist/exceptions -type f -ls;"
          tools/run_remote ${primary} "${script}"
          echo

          # Check if any exception files exist and set output
          EXCEPTION_COUNT=$(ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} \
              "sudo find /srv/shakenfist/exceptions -type f 2>/dev/null | wc -l")
          echo "Exception files found: ${EXCEPTION_COUNT}"
          if [ "${EXCEPTION_COUNT}" -gt 0 ]; then
            echo "exceptions_found=true" >> $GITHUB_OUTPUT
          else
            echo "exceptions_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Check logs
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} "sudo bash tools/ci_log_checks.sh develop ${{ matrix.merge.job_name }}"

      - name: Set exceptions output for matrix aggregation
        id: set_exceptions_output
        if: always()
        run: |
          echo "${{ matrix.merge.job_name }}=${{ steps.check_exceptions.outputs.exceptions_found }}" >> $GITHUB_OUTPUT

      - name: Check SF process CPU usage
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary} '. /etc/sf/sfrc; /srv/shakenfist/venv/bin/sf-client node cpuhogs -t 1.75'

      - name: Check for reasonable data rates
        timeout-minutes: 5
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} "sudo bash tools/ci_event_checks.sh develop"

      - name: Fetch and tweak inventory
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${{ matrix.merge.base_image_user }}@${primary}:/etc/sf/inventory.yaml /srv/github/
          sed -i 's|/root/.ssh|/home/debian/.ssh|g' /srv/github/inventory.yaml

          echo "====="
          cat /srv/github/inventory.yaml

      - name: Gather logs
        if: always()
        run: |
          # Fetch unit test tracing. Sometimes this isn't present if we failed
          # super early in the CI job.
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          mkdir -p /srv/github/bundle/
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -rp \
              ${{ matrix.merge.base_image_user }}@${primary}:/srv/ci/traces \
              /srv/github/bundle/ || true

          # We need the ssh key in the place ansible expects it to be, which isn't
          # true on the CI worker node.
          cp /srv/github/id_ci /home/debian/.ssh/id_rsa
          cp /srv/github/id_ci.pub /home/debian/.ssh/id_rsa.pub

          ansible-playbook -i /srv/github/inventory.yaml \
              --extra-vars "base_image_user=${{ matrix.merge.base_image_user }} \
              ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
              ${GITHUB_WORKSPACE}/actions/ansible/ci-gather-logs.yml

          # Zip it all up
          cd /srv/github
          sudo chown -R debian:debian /srv/github
          sudo find . -ls

          echo
          zip -rq artifacts/bundle.zip bundle/*

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bundle-functional-cluster-${{ matrix.merge.job_name }}
          retention-days: 90
          if-no-files-found: error
          path: /srv/github/artifacts/bundle.zip

      # Failures get announced here before we cancel stuff
      - uses: slackapi/slack-github-action@v2.1.1
        if: failure()
        with:
          method: chat.update
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            ts: "${{ needs.merge_pr_comment.outputs.ts }}"
            text: |
              The PR merge attempt job at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

              The PR commit message is:

              ${{ needs.merge_pr_comment.outputs.commit }}
            attachments:
              - color: "ee9090"
                fields:
                  - title: "Status"
                    short: true
                    value: "Failure in functional matrix tests"

      - uses: slackapi/slack-github-action@v2.1.1
        if: failure()
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            thread_ts: "${{ needs.merge_pr_comment.outputs.ts }}"
            text:  |
              Failures are:

              ${{ steps.failures.outputs.failures }}

      # We do this instead of "fast-fail: true" because we want to cancel jobs
      # outside of the matrix as well.
      # - uses: andymckay/cancel-action@0.5
      #   if: failure()
      #   name: Cancel entire workflow on failure

  # Display the most common exception found in merge queue tests.
  # This job does NOT attempt to fix the exception - it only displays it for
  # visibility. Fixes should be made in the PR stage, not the merge queue.
  display_merge_exceptions:
    name: "Display merge exceptions"
    permissions:
      actions: read
    runs-on: [self-hosted, vm, debian-12]
    needs: [functional_matrix_merge]
    if: >-
      ${{ !cancelled() &&
          contains(needs.functional_matrix_merge.outputs.exceptions_found, 'true') }}
    steps:
      - name: List failed jobs from matrix
        id: failed_jobs
        run: |
          # Parse the JSON output to find which matrix jobs had exceptions
          # The output is like: {"debian-12-slim-primary": "true", "other": "false"}
          EXCEPTIONS_OUTPUT='${{ needs.functional_matrix_merge.outputs.exceptions_found }}'
          echo "Raw exceptions_found output: $EXCEPTIONS_OUTPUT"

          FAILED_JOBS=$(echo "$EXCEPTIONS_OUTPUT" | jq -r 'to_entries | .[] | select(.value == "true") | .key' | tr '\n' ' ')
          echo "Matrix jobs with exceptions: $FAILED_JOBS"
          echo "failed_jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT

      - name: Download bundles for failed jobs
        env:
          FAILED_JOBS: ${{ steps.failed_jobs.outputs.failed_jobs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir bundles
          for job in ${FAILED_JOBS}; do
            echo "Downloading bundle for failed job: ${job}"
            gh run download ${{ github.run_id }} \
              --name "bundle-functional-cluster-${job}" \
              --dir "bundles/${job}"
          done

          echo
          echo "Downloaded bundles:"
          ls -lh bundles

      - name: Extract and display most common exception
        run: |
          echo "========================================"
          echo "Extracting exceptions from bundles..."
          echo "========================================"
          echo

          # Create working directory for exceptions
          mkdir -p exceptions

          for job_dir in bundles/*/; do
            job_name=$(basename "$job_dir")
            echo "Processing bundle for job: $job_name"

            if [ -f "${job_dir}/bundle.zip" ]; then
              unzip -q "${job_dir}/bundle.zip" -d "${job_dir}"

              # Copy exception files from srv/shakenfist/exceptions if they exist
              # The bundle structure is: bundle/<node_name>/srv/shakenfist/exceptions/
              for node_dir in "${job_dir}"/bundle/*/; do
                exc_dir="${node_dir}srv/shakenfist/exceptions"
                if [ -d "$exc_dir" ]; then
                  node_name=$(basename "$node_dir")
                  echo "  Found exceptions in node: $node_name"
                  # Copy files - same traceback hash from different nodes will
                  # have same filename, we'll aggregate counts later
                  for f in "$exc_dir"/*.json; do
                    if [ -f "$f" ]; then
                      base=$(basename "$f")
                      # If file already exists, we need to merge counts
                      if [ -f "exceptions/${base}" ]; then
                        # Merge events arrays and update count
                        jq -s '.[0] * {count: (.[0].count + .[1].count), events: (.[0].events + .[1].events)}' \
                            "exceptions/${base}" "$f" > "exceptions/${base}.tmp"
                        mv "exceptions/${base}.tmp" "exceptions/${base}"
                      else
                        cp "$f" "exceptions/${base}"
                      fi
                    fi
                  done
                fi
              done
            else
              echo "  Warning: No bundle.zip found in ${job_dir}"
            fi
          done

          echo
          exception_count=$(find exceptions -name "*.json" 2>/dev/null | wc -l)
          echo "Unique tracebacks found: ${exception_count}"

          if [ "${exception_count}" -eq 0 ]; then
            echo "No exception files found in bundles (unexpected)"
            exit 0
          fi

          echo
          echo "========================================"
          echo "Exception frequency (by traceback hash):"
          echo "========================================"
          for f in exceptions/*.json; do
            if [ -f "$f" ]; then
              hash=$(basename "$f" .json)
              count=$(jq -r '.count' "$f")
              echo "  ${hash}: ${count} occurrences"
            fi
          done | sort -t: -k2 -rn | head -10

          echo

          # Find the file with the highest count
          most_frequent_file=""
          highest_count=0

          for f in exceptions/*.json; do
            if [ -f "$f" ]; then
              count=$(jq -r '.count' "$f")
              if [ "${count}" -gt "${highest_count}" ]; then
                highest_count="${count}"
                most_frequent_file="$f"
              fi
            fi
          done

          if [ -z "${most_frequent_file}" ]; then
            echo "Error: Could not determine most frequent exception"
            exit 1
          fi

          traceback_hash=$(basename "${most_frequent_file}" .json)

          echo "========================================"
          echo "MOST COMMON EXCEPTION"
          echo "========================================"
          echo
          echo "Traceback hash: ${traceback_hash}"
          echo "Occurrences: ${highest_count}"
          echo
          echo "Traceback:"
          echo "----------------------------------------"
          jq -r '.traceback' "${most_frequent_file}"
          echo "----------------------------------------"
          echo
          echo "NOTE: This exception was detected during merge queue testing."
          echo "      Fixes should be applied via a new PR, not in the merge queue."

  ansible_modules:
    name: "Ansible modules"
    if: >-
      github.event_name == 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, vm, debian-12]
    needs: [merge_pr_comment, check_paths]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ansiblemodules
      cancel-in-progress: true

    steps:
      - name: Setup test environment
        uses: shakenfist/actions/setup-test-environment@main

      - name: Build infrastructure
        run: |
          cd ${GITHUB_WORKSPACE}/actions
          ansible-playbook -i /home/debian/ansible-hosts \
              --extra-vars "identifier=${SHAKENFIST_NAMESPACE} \
              base_image=sf://label/ci-images/debian-12 base_image_user=debian" \
              ansible/ci-topology-slim-primary.yml

          nodes=(10.0.0.20 10.0.0.21 10.0.0.22 10.0.0.23 10.0.0.24)
          random_index=$(( RANDOM % 5 ))
          echo "UPLOAD_TARGET=${nodes[$random_index]}" >> $GITHUB_ENV

      - name: Log environmental configuration
        run: |
          echo "## ci-environment.sh"
          cat ${GITHUB_WORKSPACE}/ci-environment.sh
          echo
          echo "## Environment variables"
          echo "SF_HEAD_SHA = ${SF_HEAD_SHA}"
          echo "SHAKENFIST_NAMESPACE = ${SHAKENFIST_NAMESPACE}"
          echo "UPLOAD_TARGET = ${UPLOAD_TARGET}"

      - name: Copy CI tools to primary
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -rp tools \
              debian@$primary:.

      - name: Run getsf installer on primary
        timeout-minutes: 30
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              debian@$primary /tmp/getsf-wrapper

      - name: Wait for API to start answering
        run: |
          set +e

          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@$primary 'sudo chmod ugo+r /etc/sf/* /var/log/syslog'

          count=0
          while [ $count -lt 60 ]
          do
            ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@$primary '. /etc/sf/sfrc; /srv/shakenfist/venv/bin/sf-client instance list'
            if [ $? == 0 ]; then
              exit 0
            fi

            count=$(( $count + 1 ))
            sleep 5
          done

          exit 1

      - name: Import cached images
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh

          setup="export PATH=$PATH:/srv/shakenfist/venv/bin;"
          setup="${setup} . /etc/sf/sfrc;"
          setup="${setup} export SHAKENFIST_API_URL=http://localhost:13000;"
          setup="${setup} /srv/shakenfist/venv/bin/sf-client artifact upload"

          # The cluster CI image, used by all CI types
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                debian@${UPLOAD_TARGET} \
                "${setup} debian-12 /srv/ci/debian:12 --shared --no-checksum"

      - name: Run ansible module tests
        timeout-minutes: 60
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/shakenfist \
              debian@$primary:shakenfist
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@$primary "cd shakenfist/shakenfist/deploy; . /etc/sf/sfrc; bash ansiblemoduletests.sh"

      - name: Check logs
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} "sudo bash tools/ci_log_checks.sh develop ansible-modules"

      - name: Check process CPU usage
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@$primary '. /etc/sf/sfrc; /srv/shakenfist/venv/bin/sf-client node cpuhogs -t 1.75'

      - name: Check for reasonable data rates
        timeout-minutes: 5
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} "sudo bash tools/ci_event_checks.sh develop"

      - name: Fetch and tweak inventory
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@$primary:/etc/sf/inventory.yaml /srv/github/
          sed -i 's|/root/.ssh|/home/debian/.ssh|g' /srv/github/inventory.yaml

          echo "====="
          cat /srv/github/inventory.yaml

      - name: Gather logs
        if: always()
        run: |
          # We need the ssh key in the place ansible expects it to be, which isn't
          # true on the CI worker node.
          cp /srv/github/id_ci /home/debian/.ssh/id_rsa
          cp /srv/github/id_ci.pub /home/debian/.ssh/id_rsa.pub
          chown -R debian.debian /home/debian/.ssh

          ansible-playbook -i /srv/github/inventory.yaml \
              --extra-vars "base_image_user=debian ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
              ${GITHUB_WORKSPACE}/actions/ansible/ci-gather-logs.yml

          # Zip it all up
          cd /srv/github
          sudo chown -R debian:debian /srv/github
          sudo find . -ls

          echo
          zip -rq artifacts/bundle.zip bundle/*

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bundle-functional-ansible-modules
          retention-days: 90
          if-no-files-found: error
          path: /srv/github/artifacts/bundle.zip

      # Failures get announced here before we cancel stuff
      - uses: slackapi/slack-github-action@v2.1.1
        if: failure()
        with:
          method: chat.update
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            ts: "${{ needs.merge_pr_comment.outputs.ts }}"
            text: |
              The PR merge attempt job at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

              The PR commit message is:

              ${{ needs.merge_pr_comment.outputs.commit }}
            attachments:
              - color: "ee9090"
                fields:
                  - title: "Status"
                    short: true
                    value: "Failure in ansible-modules tests"

      # We do this instead of "fast-fail: true" because we want to cancel jobs
      # outside of the matrix as well.
      # - uses: andymckay/cancel-action@0.5
      #   if: failure()
      #   name: Cancel entire workflow on failure

  node_lifecycle:
    name: "Node lifecycle"
    if: >-
      github.event_name == 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    needs: [merge_pr_comment, check_paths]
    runs-on: [self-hosted, vm, debian-12]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-nodelifecycle
      cancel-in-progress: true

    steps:
      - name: Setup test environment
        uses: shakenfist/actions/setup-test-environment@main

      - name: Build infrastructure
        run: |
          cd ${GITHUB_WORKSPACE}/actions
          ansible-playbook -i /home/debian/ansible-hosts \
              --extra-vars "identifier=${SHAKENFIST_NAMESPACE} \
              base_image=sf://label/ci-images/debian-12 base_image_user=debian" \
              ansible/ci-topology-slim-primary.yml

          nodes=(10.0.0.20 10.0.0.21 10.0.0.22 10.0.0.23 10.0.0.24)
          random_index=$(( RANDOM % 5 ))
          echo "UPLOAD_TARGET=${nodes[$random_index]}" >> $GITHUB_ENV

      - name: Log environmental configuration
        run: |
          echo "## ci-environment.sh"
          cat ${GITHUB_WORKSPACE}/ci-environment.sh
          echo
          echo "## Environment variables"
          echo "SF_HEAD_SHA = ${SF_HEAD_SHA}"
          echo "SHAKENFIST_NAMESPACE = ${SHAKENFIST_NAMESPACE}"
          echo "UPLOAD_TARGET = ${UPLOAD_TARGET}"

      - name: Copy CI tools to primary
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -rp tools \
              debian@$primary:.

      - name: Run getsf installer on primary
        timeout-minutes: 30
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              debian@$primary /tmp/getsf-wrapper

      - name: Wait for API to start answering
        run: |
          set +e

          . ${GITHUB_WORKSPACE}/ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@$primary 'sudo chmod ugo+r /etc/sf/* /var/log/syslog'

          count=0
          while [ $count -lt 60 ]
          do
            ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@$primary '. /etc/sf/sfrc; /srv/shakenfist/venv/bin/sf-client instance list'
            if [ $? == 0 ]; then
              exit 0
            fi

            count=$(( $count + 1 ))
            sleep 5
          done

          exit 1

      - name: Import cached images
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh

          setup="export PATH=$PATH:/srv/shakenfist/venv/bin;"
          setup="${setup} . /etc/sf/sfrc;"
          setup="${setup} export SHAKENFIST_API_URL=http://localhost:13000;"
          setup="${setup} /srv/shakenfist/venv/bin/sf-client artifact upload"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@${UPLOAD_TARGET} \
              "${setup} debian-12 /srv/ci/debian:12 --shared --no-checksum"

      - name: Run node lifecycle tests
        timeout-minutes: 60
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/shakenfist \
              debian@$primary:shakenfist
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@$primary "cd shakenfist/shakenfist/deploy; . /etc/sf/sfrc; bash nodelifecycletests.sh"

      - name: Check logs
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} "sudo bash tools/ci_log_checks.sh develop node-lifecycle"

      - name: Restart Shaken Fist nodes so we can collect logs
        if: always()
        run: |
          set -x
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          for node in ${sf1_uuid} ${sf2_uuid} ${sf3_uuid} ${sf4_uuid} ${sf5_uuid}; do
              tools/run_remote ${primary} \
                  ". /etc/sf/sfrc; /srv/shakenfist/venv/bin/sf-client instance reboot --hard ${node}"
          done
          sleep 90

      - name: Check for reasonable data rates
        timeout-minutes: 5
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} "sudo bash tools/ci_event_checks.sh develop"

      - name: Fetch and tweak inventory
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@$primary:/etc/sf/inventory.yaml /srv/github/
          sed -i 's|/root/.ssh|/home/debian/.ssh|g' /srv/github/inventory.yaml

          echo "====="
          cat /srv/github/inventory.yaml

      - name: Gather logs
        if: always()
        run: |
          # We need the ssh key in the place ansible expects it to be, which isn't
          # true on the CI worker node.
          cp /srv/github/id_ci /home/debian/.ssh/id_rsa
          cp /srv/github/id_ci.pub /home/debian/.ssh/id_rsa.pub
          chown -R debian.debian /home/debian/.ssh

          ansible-playbook -i /srv/github/inventory.yaml \
              --extra-vars "base_image_user=debian ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
              ${GITHUB_WORKSPACE}/actions/ansible/ci-gather-logs.yml

          # Zip it all up
          cd /srv/github
          sudo chown -R debian:debian /srv/github
          sudo find . -ls

          echo
          zip -rq artifacts/bundle.zip bundle/*

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bundle-functional-node-lifecycle
          retention-days: 90
          if-no-files-found: error
          path: /srv/github/artifacts/bundle.zip

      # Failures get announced here before we cancel stuff
      - uses: slackapi/slack-github-action@v2.1.1
        if: failure()
        with:
          method: chat.update
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            ts: "${{ needs.merge_pr_comment.outputs.ts }}"
            text: |
              The PR merge attempt job at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} failed.

              The PR commit message is:

              ${{ needs.merge_pr_comment.outputs.commit }}
            attachments:
              - color: "ee9090"
                fields:
                  - title: "Status"
                    short: true
                    value: "Failure in node-lifecycle tests"

      # We do this instead of "fast-fail: true" because we want to cancel jobs
      # outside of the matrix as well.
      # - uses: andymckay/cancel-action@0.5
      #   if: failure()
      #   name: Cancel entire workflow on failure

  enqueue_pr_comment:
    name: "Enqueue PR slack comment"
    if: always() && github.event_name == 'pull_request'
    runs-on: [self-hosted, static]
    permissions:
      pull-requests: write
    outputs:
      ts: "${{ steps.slack.outputs.ts }}"
    steps:
      - name: Log the github event
        run: |
          cat - <<EOF
          ${{ toJSON(github.event.pull_request) }}"
          EOF

      - name: Tell people a PR test attempt is running
        id: slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            text: |
              A PR test attempt is running at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} :rocket:

              PR title: ${{ github.event.pull_request.title }}
              PR link: ${{ github.event.pull_request.html_url }}
              PR author: ${{ github.event.pull_request.user.login }}
            attachments:
              - color: "9090ee"
                fields:
                  - title: "Status"
                    short: true
                    value: "In Progress"

  merge_pr_comment:
    name: "Merge attempt slack comment"
    if: always() && github.event_name == 'merge_group'
    runs-on: [self-hosted, static]
    permissions:
      pull-requests: write
    outputs:
      ts: "${{ steps.slack.outputs.ts }}"
      commit: "${{ steps.commit_message.outputs.commit }}"
    steps:
      - name: Log the github event
        run: |
          cat - <<EOF
          ${{ toJSON(github.event.merge_group) }}"
          EOF
      - name: Reformat the commit message as a quoted block
        id: commit_message
        run: |
          commit="${{ github.event.merge_group.head_commit.message }}"

          echo "Commit message is:"
          echo "${commit}"
          echo

          commit=$(echo ${commit} | sed 's/^/> /')
          echo "Quoted message is:"
          echo "${commit}"
          echo

          echo "commit<<EOF" >> ${GITHUB_OUTPUT}
          echo "${commit}" >> ${GITHUB_OUTPUT}
          echo "EOF" >> ${GITHUB_OUTPUT}
          echo "GITHUB_OUTPUT is:"
          cat ${GITHUB_OUTPUT}

      - name: Tell people a merge attempt is running
        id: slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            text: |
              A merge queue attempt is running at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} :rocket:

              The PR commit message is:

              ${{ steps.commit_message.outputs.commit }}
            attachments:
              - color: "9090ee"
                fields:
                  - title: "Status"
                    short: true
                    value: "In Progress"

  can_see_status:
    name: "Can see status"
    runs-on: [self-hosted, static]
    steps:
      - name: "Immediate success"
        run: true

  can_enqueue:
    name: "Can enqueue"
    needs:
      - functional_matrix_pr
      - enqueue_pr_comment
      - sanity_checks
      - check_paths
    if: always() && github.event_name != 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"
      - uses: slackapi/slack-github-action@v2.1.1
        if: success()
        with:
          method: chat.update
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            ts: "${{ needs.enqueue_pr_comment.outputs.ts }}"
            text: |
              The PR test attempt job at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} succeeded.

              PR title: ${{ github.event.pull_request.title }}
              PR link: ${{ github.event.pull_request.html_url }}
              PR author: ${{ github.event.pull_request.user.login }}
            attachments:
              - color: "90ee90"
                fields:
                  - title: "Status"
                    short: true
                    value: "Success"

  can_merge:
    name: "Can merge"
    needs:
      - functional_matrix_merge
      - ansible_modules
      - node_lifecycle
      - merge_pr_comment
      - check_paths
    if: always() && github.event_name == 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"
      - uses: slackapi/slack-github-action@v2.1.1
        if: success()
        with:
          method: chat.update
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_SHAKENFIST_CI }}
            ts: "${{ needs.merge_pr_comment.outputs.ts }}"
            text:
              The merge attempt job at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} succeeded.

              The PR commit message is:

              ${{ needs.merge_pr_comment.outputs.commit }}
              attachments:
              - color: "90ee90"
                fields:
                  - title: "Status"
                    short: true
                    value: "Success"
