name: Functional lanes

# Every functional cluster lane, defined once. Each lane deploys a topology
# via the shakenfist.shakenfist collection and runs a suite against it. Most
# do that by calling the reusable smoke-cluster workflow in
# shakenfist/actions; a lane whose teardown that workflow cannot do -- the
# node lifecycle lane powers nodes off -- shares only the deploy and runs its
# own steps here.
#
# This workflow decides what a lane *is*; its callers decide when it runs.
# functional-tests.yml selects the lanes which gate a merge, and
# scheduled-tests.yml selects the lanes which run weekly and file an issue
# when they fail. Moving a lane between the two is an edit to the callers'
# 'lanes' lists and nothing here. test_functional_lanes_workflow_seams.py
# checks every lane is selected by exactly one caller, and that every name a
# caller passes is a lane defined here. That second check is load bearing:
# a lane which is not selected skips, a called workflow whose jobs all skip
# succeeds, and "Can merge" would then go green having tested nothing. It
# also checks that no lane the weekly caller names is still in can_merge's
# needs: list, which would fail every merge group that touches code.
#
# A lane which calls the reusable workflow names itself in that workflow's
# concurrency_key input. A lane which runs its own steps has no inputs to
# name itself in, so its concurrency group carries the name instead and the
# seam test reads it from there.
#
# Each lane is its own job rather than an entry of one matrix, because a job
# level 'if' cannot read the matrix context, and because
# test_headroom_gate_workflow_seams.py derives each call site's job shape
# from literal inputs. Every shape input is therefore spelled out by each
# lane which arms that gate.
#
# A lane's job name is reported by the jobs API as '<caller job> / <lane> /
# Smoke tests (collection)', or '<caller job> / <lane>' for a lane which
# runs its own steps. tools/ci_headroom_harvest.py finds a lane's
# bundle by the lane segment of that name, so renaming a lane here needs a
# new row in its BUNDLE_TOPOLOGIES table. tools/ci_report_scheduled_failures.py
# finds a weekly lane's open ci-failure issue by the same segment, so a rename
# also files a fresh issue and orphans the old one.
#
# The headroom band gate: a lane passes either the CI_HEADROOM_GATE
# repository variable's off switch (set it to 'false' to stop a band
# violation failing these jobs without a commit; unset, or anything else,
# leaves the gate on), or a literal false. The switch may only be armed on a
# job shape a warn window measured, which test_headroom_gate_workflow_seams.py
# enforces. See docs/developer_guide/ci_cloud_sizing.md.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      lanes:
        description: >-
          A JSON array of the lanes to run, named by their concurrency_key,
          for example '["debian-13-slim-primary", "guests"]'.
        type: string
        required: true

jobs:
  debian_13_cluster:
    name: "Debian 13 cluster (collection)"
    if: contains(fromJSON(inputs.lanes), 'debian-13-slim-primary')
    uses: shakenfist/actions/.github/workflows/smoke-cluster.yml@main
    with:
      component: shakenfist
      component_ref: ${{ github.sha }}
      headroom_gate: ${{ vars.CI_HEADROOM_GATE != 'false' }}
      test_kind: functional
      tier: full
      topology: slim-primary
      base_image: 'sf://label/ci-images/debian-13'
      base_image_user: debian
      stestr_config: cluster-ci.conf
      test_concurrency: 5
      test_timeout_minutes: 60
      concurrency_key: debian-13-slim-primary

  ubuntu_2404_cluster:
    name: "Ubuntu 24.04 cluster (collection)"
    if: contains(fromJSON(inputs.lanes), 'ubuntu-2404-slim-primary')
    uses: shakenfist/actions/.github/workflows/smoke-cluster.yml@main
    with:
      component: shakenfist
      component_ref: ${{ github.sha }}
      headroom_gate: ${{ vars.CI_HEADROOM_GATE != 'false' }}
      test_kind: functional
      tier: full
      topology: slim-primary
      base_image: 'sf://label/ci-images/ubuntu-2404'
      base_image_user: ubuntu
      stestr_config: cluster-ci.conf
      test_concurrency: 5
      test_timeout_minutes: 60
      concurrency_key: ubuntu-2404-slim-primary

  guests:
    name: "Guests (collection)"
    if: contains(fromJSON(inputs.lanes), 'guests')
    uses: shakenfist/actions/.github/workflows/smoke-cluster.yml@main
    with:
      component: shakenfist
      component_ref: ${{ github.sha }}
      headroom_gate: ${{ vars.CI_HEADROOM_GATE != 'false' }}
      test_kind: functional
      tier: full
      topology: slim-primary
      base_image: 'sf://label/ci-images/debian-13'
      base_image_user: debian
      stestr_config: guest-ci.conf
      test_concurrency: 5
      test_timeout_minutes: 60
      concurrency_key: guests

  # slim-tier runs the same cluster suite on three nodes rather than
  # slim-primary's five, so it is still the slower of the two, but its nodes
  # are no longer allocation-starved: the 6 vCPU reshape took its cluster
  # ledger from 12 to 24. Six merge runs on that shape took 27 to 42 minutes,
  # so 60 carries the same headroom the other lanes have.
  #
  # This is also the lane with Kerbside on. Its deploy profile deploys
  # Kerbside on sf2, scraping the primary's sf-api, with its database on the
  # primary's MariaDB; deploys the cluster a second time and fails if any
  # sf-* or kerbside-* unit restarted; and tells the suite to expect a VDI
  # console proxy. It adds processes, not instances, so the headroom gate's
  # shape is unchanged. The second deploy costs time inside the build step,
  # not this timeout.
  debian_13_tier:
    name: "Debian 13 tier (collection)"
    if: contains(fromJSON(inputs.lanes), 'debian-13-slim-tier')
    uses: shakenfist/actions/.github/workflows/smoke-cluster.yml@main
    with:
      component: shakenfist
      component_ref: ${{ github.sha }}
      headroom_gate: ${{ vars.CI_HEADROOM_GATE != 'false' }}
      test_kind: functional
      tier: full
      topology: slim-tier
      base_image: 'sf://label/ci-images/debian-13'
      base_image_user: debian
      stestr_config: cluster-ci.conf
      test_concurrency: 5
      test_timeout_minutes: 60
      concurrency_key: debian-13-slim-tier
      deploy_profile: shakenfist/tools/ci-deploy-profiles/kerbside-slim-tier.yml.j2

  # The cluster suite on one node, deliberately, to find whatever in it
  # breaks when every role shares a machine. sizing.is_single_machine()
  # and cluster_ci_tests/test_nodes.py carve this deployment out of the
  # structural minimum, which no single node can meet. Not gated on the
  # headroom band: no warn window has measured the localhost shape.
  #
  # tier is passed as smoke but selects nothing: smoke-cluster.yml uses it
  # for the artifact name and the concurrency group only, so this lane runs
  # the same cluster-ci.conf suite as the multi-node lanes above -- 163
  # tests -- on one node at concurrency 3. It inherited the default 45
  # minute budget from the scheduled matrix it came from, and that budget
  # was never achievable: measured on 2026-11-06 it finished 156 of the 163
  # in 44m50s with 2.52 of its 3 workers busy, leaving about 6.7 minutes of
  # test time to go, so the suite wants roughly 48 minutes before any
  # overhead. 75 gives it about the same headroom over measured runtime
  # that debian-13-slim-tier has (34 minutes used of 60). If this lane is
  # ever to be a real smoke subset, that is a change to what it runs rather
  # than to the clock (shakenfist/shakenfist#4741).
  debian_13_single_machine:
    name: "Debian 13 single machine (collection)"
    if: contains(fromJSON(inputs.lanes), 'debian-13-localhost')
    uses: shakenfist/actions/.github/workflows/smoke-cluster.yml@main
    with:
      component: shakenfist
      component_ref: ${{ github.sha }}
      headroom_gate: false
      test_kind: functional
      tier: smoke
      topology: localhost
      base_image: 'sf://label/ci-images/debian-13'
      base_image_user: debian
      stestr_config: cluster-ci.conf
      test_concurrency: 3
      test_timeout_minutes: 75
      concurrency_key: debian-13-localhost

  # Native-module lifecycle CI: deploys via the reusable smoke-cluster workflow
  # (slim-primary) and runs ansiblemoduletests.sh against the installed
  # shakenfist.shakenfist collection.
  ansible_modules_collection:
    name: "Ansible modules (collection)"
    if: contains(fromJSON(inputs.lanes), 'ansible-modules')
    uses: shakenfist/actions/.github/workflows/smoke-cluster.yml@main
    with:
      component: shakenfist
      component_ref: ${{ github.sha }}
      # Not gated, although this job is now measured. shakenfist/actions#120
      # widened the probe steps to admit ansible-modules, so the collect step
      # runs here and banks a series. The band it would be gated against was
      # fitted to the shapes the warn window read, and this suite was not one
      # of them -- so the reusable workflow resolves CI_HEADROOM_GATE to false
      # for any test_kind but functional whatever a caller passes, and passing
      # false here is that policy stated where review sees it. See
      # functional-tests.yml's smoke tier job.
      headroom_gate: false
      tier: full
      topology: slim-primary
      base_image: 'sf://label/ci-images/debian-13'
      base_image_user: debian
      test_kind: ansible-modules
      concurrency_key: ansible-modules

  # Node lifecycle CI: deploys via the collection, then runs
  # nodelifecycletests.sh, which disturbs the cluster (powers nodes off), hence
  # the under-cloud node restart, ServerAlive ssh and node-lifecycle log tag in
  # the teardown. Does not use the reusable workflow (its teardown assumes nodes
  # stay up); only the deploy is shared.
  node_lifecycle_collection:
    name: "Node lifecycle (collection)"
    if: contains(fromJSON(inputs.lanes), 'node-lifecycle')
    # Carries a size element for the same reason smoke-cluster.yml does:
    # without one the conductor falls back to xs (1 vCPU / 2048 MB), and
    # this job drives a full ansible deploy from the runner. Measured
    # demand is ~2.5-2.7 GB against 1927 MB usable and no swap. See
    # shakenfist/shakenfist#3696.
    #
    # The size is s-cluster rather than s: the same footprint as s (the
    # runner is still an orchestrator), but a pending pool of its own
    # for jobs that build a multi-node cluster, so this job does not set
    # the capacity claim of every lint runner on s. This builds the
    # five-node slim-primary topology, which smoke-cluster.yml also
    # routes to s-cluster. See shakenfist/private-ci
    # docs/capacity-claims.md, "Cloud-building jobs".
    runs-on: [self-hosted, vm, debian-13, s-cluster]
    # The deploy and test steps below are capped at 90 and 60 minutes;
    # this is the backstop for the setup and teardown around them, and
    # is still far short of GitHub's six hour default.
    timeout-minutes: 180
    # The same key smoke-cluster.yml gives every other lane, so this lane
    # behaves as they do wherever it runs. The merge_group arm cannot fire
    # while the lane is weekly; it is kept so that moving the lane back into
    # the merge queue needs no edit here (see automated_delinter in
    # functional-tests.yml for why the queue wants it). The seam test reads
    # the lane name from this group, so it must stay in it.
    concurrency:
      group: >-
        ${{ github.workflow }}-node-lifecycle-collection-${{
        github.event_name == 'merge_group' && github.run_attempt == '1'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true

    # The network path every job on the self-hosted runners needs. The other
    # lanes here are calls to a reusable workflow, which a workflow level env
    # does not reach, so they set none and do not want one; these steps had it
    # from the merge queue workflow they used to live in and still need it.
    env:
      http_proxy: http://192.168.1.15:3128
      https_proxy: http://192.168.1.15:3128
      PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/
      # Fall back to pypi so a devpi cold-cache miss (empty index on a
      # first-touch package) cannot hard-fail the job.
      PIP_EXTRA_INDEX_URL: https://pypi.org/simple/

    steps:
      - name: Setup test environment
        uses: shakenfist/actions/setup-test-environment@main

      # The deploy is the build-smoke-cluster composite action (shared with
      # the reusable smoke-cluster workflow); only this job's teardown is
      # bespoke, because the lifecycle test powers nodes off.
      - name: Build the smoke cluster
        timeout-minutes: 90
        uses: shakenfist/actions/build-smoke-cluster@main
        with:
          topology: slim-primary

      # The lifecycle test kills nodes, so upload the cached image to a
      # random hypervisor rather than the primary the action selected --
      # matching the getsf-era behaviour of exercising non-primary uploads.
      - name: Choose a random upload target
        run: |
          nodes=(10.0.0.20 10.0.0.21 10.0.0.22 10.0.0.23 10.0.0.24)
          random_index=$(( RANDOM % 5 ))
          echo "UPLOAD_TARGET=${nodes[$random_index]}" >> $GITHUB_ENV

      - name: Import cached images to the random target
        run: |
          set -e
          . ${GITHUB_WORKSPACE}/ci-environment.sh

          setup="export PATH=$PATH:/srv/shakenfist/venv/bin;"
          setup="${setup} . /etc/sf/sfrc;"
          setup="${setup} export SHAKENFIST_API_URL=http://localhost:13000;"
          setup="${setup} /srv/shakenfist/venv/bin/sf-client artifact upload"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              debian@${UPLOAD_TARGET} \
              "${setup} debian /srv/ci/debian:13 --shared --no-checksum"


      - name: Run node lifecycle tests
        timeout-minutes: 60
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/shakenfist \
              debian@$primary:shakenfist
          # The lifecycle test terminates its victim node via the
          # under-cloud API (in-guest kills are not durable -- see the
          # under-cloud kill comment in nodelifecycletests.sh), so it
          # needs this runner's under-cloud credentials and the node
          # name -> under-cloud instance uuid map from ci-environment.sh.
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${HOME}/.shakenfist \
              debian@$primary:undercloud-creds.json
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/ci-environment.sh \
              debian@$primary:ci-environment.sh
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              debian@$primary "chmod u=r,go= undercloud-creds.json"
          # ServerAliveInterval/ServerAliveCountMax: if the remote host
          # goes down (e.g. a lifecycle test bug takes out the script's
          # own host), the TCP connection can sit half-open until the
          # default TCP keepalive eventually times out -- hours later,
          # well past the GitHub step budget. With these options ssh
          # notices a dead connection in roughly 30 s and the step fails
          # fast instead.
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
              debian@$primary "cd shakenfist/shakenfist/deploy; . /etc/sf/sfrc; bash nodelifecycletests.sh"

      - name: Check logs
        id: check_logs
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} "sudo bash tools/ci_log_checks_loki.sh develop node-lifecycle"

      - name: Dump systemd state and journals
        if: always() && steps.check_logs.outcome == 'failure'
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cd ${GITHUB_WORKSPACE}/actions
          tools/run_remote ${primary} 'echo "=== systemctl --failed (primary) ==="; sudo systemctl --failed --no-pager; echo "=== journalctl sf-* (primary, last 200 warn+) ==="; sudo journalctl -u "sf-*.service" -p warning -n 200 --no-pager' || true

      - name: Restart Shaken Fist nodes so we can collect logs
        if: always()
        # Log collection is best effort: this lane deliberately breaks
        # nodes, and a node which does not return from the post-test
        # reboot is not a failure of the code under test. That was
        # established while the lane gated merges, when a boot wedge
        # burned three merge queue attempts whose tests had passed. The
        # script still dumps instance state and guest consoles so the
        # boot wedge stays diagnosable.
        continue-on-error: true
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          bash ${GITHUB_WORKSPACE}/shakenfist/tools/ci-restart-cluster-nodes.sh debian

      - name: Per-node system-level checks
        if: always()
        run: |
          . ${GITHUB_WORKSPACE}/ci-environment.sh
          cp /srv/github/id_ci /home/debian/.ssh/id_rsa
          cp /srv/github/id_ci.pub /home/debian/.ssh/id_rsa.pub
          chown -R debian.debian /home/debian/.ssh
          ansible-playbook -i /srv/github/ci-inventory.yaml \
              --extra-vars "base_image_user=debian node_checks_job_name=node-lifecycle ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
              ${GITHUB_WORKSPACE}/actions/ansible/ci-node-checks.yml

      - name: Gather logs
        if: always()
        # Best effort for the same reason as the restart step above --
        # this job deliberately breaks nodes, and a node that never
        # returns makes log gathering fail through no fault of the code
        # under test.
        continue-on-error: true
        run: |
          # We need the ssh key in the place ansible expects it to be, which isn't
          # true on the CI worker node.
          cp /srv/github/id_ci /home/debian/.ssh/id_rsa
          cp /srv/github/id_ci.pub /home/debian/.ssh/id_rsa.pub
          chown -R debian.debian /home/debian/.ssh

          ansible-playbook -i /srv/github/ci-inventory.yaml \
              --extra-vars "base_image_user=debian ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
              ${GITHUB_WORKSPACE}/actions/ansible/ci-gather-logs-loki.yml

      - name: Capture py-spy thread dumps
        if: always()
        continue-on-error: true
        run: |
          ansible-playbook -i /srv/github/ci-inventory.yaml \
              --extra-vars "ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
              ${GITHUB_WORKSPACE}/shakenfist/tools/ci_capture_pyspy.yml || true

      - name: Bundle artifacts
        if: always()
        run: |
          cd /srv/github
          sudo chown -R debian:debian /srv/github
          sudo find . -ls
          echo
          mkdir -p /srv/github/artifacts /srv/github/bundle
          zip -rq artifacts/bundle.zip bundle/* || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-functional-node-lifecycle-collection
          retention-days: 90
          if-no-files-found: error
          path: /srv/github/artifacts/bundle.zip
