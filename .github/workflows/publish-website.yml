# With thanks to https://bluegenes.github.io/mkdocs-github-actions/
name: Build and publish shakenfist.com

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - develop


env:
  http_proxy: http://192.168.1.15:3128
  https_proxy: http://192.168.1.15:3128
  PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/

jobs:
  deploy:
    runs-on: [self-hosted, static]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies, build site
        run: |
          python3 -mvenv mkdocs-venv
          . mkdocs-venv/bin/activate
          pip3 install mkdocs mkdocs-material
          mkdocs build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
