# Release workflow for Shaken Fist
#
# Triggers on version tags (v*). Requires approval from the 'release'
# environment before publishing. Uses Sigstore for signing and PyPI
# trusted publishers for authentication.
#
# See RELEASE-SETUP.md for one-time configuration steps.

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

  # Allow manual trigger for testing (won't publish without a tag)
  workflow_dispatch:


env:
  http_proxy: http://192.168.1.15:3128
  https_proxy: http://192.168.1.15:3128
  PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/

jobs:
  build:
    name: Build distribution packages
    runs-on: [self-hosted, static]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history needed for setuptools_scm

      - name: Install build dependencies
        run: |
          rm -rf release-venv
          python3 -m venv release-venv
          release-venv/bin/pip3 install --upgrade pip
          release-venv/bin/pip3 install build twine

      - name: Build package
        run: |
          release-venv/bin/python3 -m build

      - name: Check package with twine
        run: |
          release-venv/bin/twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  build-collection:
    name: Build ansible collection
    runs-on: [self-hosted, static]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history needed for setuptools_scm

      - name: Install build dependencies
        run: |
          rm -rf collection-venv
          python3 -m venv collection-venv
          collection-venv/bin/pip3 install --upgrade pip
          collection-venv/bin/pip3 install ansible-core setuptools_scm packaging

      - name: Build collection
        run: |
          collection-venv/bin/python3 tools/build-collection.py

      - name: Upload collection artifact
        uses: actions/upload-artifact@v7
        with:
          name: collection
          path: dist-collection/

  sign-tag:
    name: Sign release tag with Sigstore
    needs: build
    runs-on: [self-hosted, debian-12, s]
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitsign
        run: |
          GITSIGN_VERSION="0.14.0"
          curl -sLO "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          curl -sLO "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          chmod +x "gitsign_${GITSIGN_VERSION}_linux_amd64"
          sudo mv "gitsign_${GITSIGN_VERSION}_linux_amd64" /usr/local/bin/gitsign

      - name: Configure git for Sigstore signing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global tag.gpgsign true
          git config --global gpg.format x509
          git config --global gpg.x509.program gitsign

      - name: Create signed tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Signing tag: ${TAG_NAME}"
          git tag -d "${TAG_NAME}" || true
          git tag -s "${TAG_NAME}" -m "Release ${TAG_NAME}" "${GITHUB_SHA}"
          git push origin "${TAG_NAME}" --force

  publish-pypi:
    name: Publish to PyPI
    needs: [build, sign-tag]
    runs-on: [self-hosted, static]
    environment: release

    permissions:
      id-token: write
      attestations: write

    steps:
      # This job does not check out, so the workspace it starts in is
      # whatever the last job on this runner left behind -- the static
      # pool is persistent, and download-artifact adds to a directory
      # rather than replacing it. Downloading into the per-job
      # runner.temp is what makes the set of files here exactly the
      # set that was built: nothing else can have put a file there.
      # Everything downstream has to be pointed at the same place,
      # including the publish step, whose own default is ./dist.
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ runner.temp }}/dist/

      - name: Generate attestations for artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: '${{ runner.temp }}/dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/dist/

  publish-collection:
    name: Publish ansible collection to Galaxy
    needs: [build-collection, sign-tag]
    runs-on: [self-hosted, static]
    environment: release

    steps:
      # As in publish-pypi: no checkout, so download into the per-job
      # runner.temp, and point the publish command at the same place.
      - name: Download collection artifact
        uses: actions/download-artifact@v8
        with:
          name: collection
          path: ${{ runner.temp }}/dist-collection/

      - name: Install ansible-core
        run: |
          rm -rf publish-venv
          python3 -m venv publish-venv
          publish-venv/bin/pip3 install --upgrade pip
          publish-venv/bin/pip3 install ansible-core

      - name: Publish to Ansible Galaxy
        run: |
          publish-venv/bin/ansible-galaxy collection publish \
              ${{ runner.temp }}/dist-collection/*.tar.gz \
              --api-key "${{ secrets.ANSIBLE_GALAXY_TOKEN }}"

  github-release:
    name: Create GitHub Release
    needs: [build, sign-tag, publish-pypi]
    runs-on: [self-hosted, static]

    permissions:
      contents: write

    steps:
      # As in publish-pypi: no checkout, so download into the per-job
      # runner.temp rather than into a workspace this job did not
      # create and does not clean. fail_on_unmatched_files is the
      # other half -- action-gh-release treats a glob that matches
      # nothing as a warning, so without it a release that attached
      # no files at all still reported success.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ runner.temp }}/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
