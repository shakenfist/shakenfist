# Shaken Fist example nginx load balancer / reverse proxy (optional).
#
# This is an OPTIONAL, operator-owned example. Shaken Fist no longer
# ships a bundled vhost -- you put your own reverse proxy or load
# balancer in front of the API and own its configuration. Copy this
# file, edit it for your environment, and treat it as a starting point
# rather than a prescription.
#
#   sudo cp examples/nginx-loadbalancer.conf \
#       /etc/nginx/sites-available/shakenfist.conf
#   sudo ln -s /etc/nginx/sites-available/shakenfist.conf \
#       /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The backends are the per-hypervisor gunicorn sf-api workers, which
# serve the API at / on port 13000 over plain HTTP. This proxy
# terminates TLS and presents a single external endpoint. The hop from
# this proxy to the :13000 backends is cleartext, so run it over the
# trusted cluster (node mesh) network, not a public segment.
#
# The proxy contract this file implements:
#   /api/<anything>   -> backend /<anything>   (the /api prefix is stripped)
#   /apidocs          -> backend /apidocs       (passed through unchanged)
#   /flasgger_static  -> backend /flasgger_static (passed through unchanged)
#   /apispec_1.json   -> backend /apispec_1.json  (passed through unchanged)
#
# The doc paths must NOT live under /api: the Swagger UI fetches them
# from the server root, so they are proxied through unchanged.

upstream sfapi {
    # List every hypervisor here, one server line per node.
    #
    # Passive health checking: after 2 failed requests, take the backend
    # out of rotation for 10s, then probe it again with live traffic.
    # Open-source nginx has no active health checks, so it only learns a
    # worker is draining (/readyz returning 503) when a real request
    # fails against it -- see the health checks section of
    # docs/operator_guide/load_balancing.md for the limitation and the
    # NGINX Plus / external prober alternatives.
    server 10.0.0.1:13000 max_fails=2 fail_timeout=10s;
    server 10.0.0.2:13000 max_fails=2 fail_timeout=10s;

    # Reuse upstream connections. The SF API is plain HTTP with no
    # WebSocket endpoints, so this is safe and cuts per-request setup.
    keepalive 16;
}

# Redirect all plain HTTP traffic to HTTPS.
server {
    listen 80;
    server_name sf.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sf.example.com;

    # TLS termination. Replace these placeholder paths with your own
    # certificate and private key. In production prefer a managed
    # certificate (for example certbot, which also drops in a hardened
    # options-ssl-nginx.conf include and an ssl_dhparam file).
    ssl_certificate     /etc/ssl/certs/sf.example.com.crt;
    ssl_certificate_key /etc/ssl/private/sf.example.com.key;

    # Recommended hardening (uncomment once you have confirmed HTTPS works):
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Shaken Fist streams large disk images and blobs (many GB) through
    # the API. Lift the body-size limit entirely, stream rather than
    # buffer, and allow slow transfers to run long. Without these a
    # large upload is rejected (413) or a slow transfer times out (504).
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Pass the real client and scheme through to the API. The empty
    # Connection header plus HTTP/1.1 is what lets the upstream keepalive
    # above take effect.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A draining sf-api worker answers /readyz with 503 while it keeps
    # serving for API_DRAIN_GRACE (25s). Treat a 503, a connection error
    # or a timeout as "try the next backend" rather than returning it to
    # the client. This applies to every location below. It can only help
    # while some other backend is healthy: a deploy that restarts every
    # worker at once leaves nothing to fail over to.
    proxy_next_upstream error timeout http_503;

    # Drop PHP vulnerability scanners outright.
    location ~* \.php$ {
        return 444;
    }

    # /api/* -> backend /*. The trailing slash on proxy_pass is
    # load-bearing: it strips the /api/ prefix so /api/auth/namespaces
    # reaches the backend as /auth/namespaces.
    location /api/ {
        proxy_pass http://sfapi/;
    }

    # A bare /api (no trailing slash) should still reach the API.
    location = /api {
        return 301 /api/;
    }

    # OpenAPI doc paths are served from the server root (the Swagger UI
    # fetches them there). proxy_pass has no URI part, so the request
    # path is preserved unchanged. These are also covered by the
    # catch-all below; they are listed explicitly to document the
    # contract and to keep working if the catch-all is ever tightened.
    location /apidocs {
        proxy_pass http://sfapi;
    }

    location /flasgger_static {
        proxy_pass http://sfapi;
    }

    location = /apispec_1.json {
        proxy_pass http://sfapi;
    }

    # Catch-all: also serve the API at the server root, so clients that
    # omit the /api prefix still work.
    location / {
        proxy_pass http://sfapi;
    }
}
