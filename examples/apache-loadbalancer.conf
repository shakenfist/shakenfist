# Shaken Fist example Apache load balancer / reverse proxy (optional).
#
# This is an OPTIONAL, operator-owned example. Shaken Fist no longer
# ships a bundled vhost -- you put your own reverse proxy or load
# balancer in front of the API and own its configuration. Copy this
# file, edit it for your environment, and treat it as a starting point
# rather than a prescription.
#
#   sudo cp examples/apache-loadbalancer.conf \
#       /etc/apache2/sites-available/shakenfist.conf
#   sudo a2ensite shakenfist
#   sudo systemctl reload apache2
#
# The backends are the per-hypervisor gunicorn sf-api workers, which
# serve the API at / on port 13000 over plain HTTP. This proxy
# terminates TLS and presents a single external endpoint. The hop from
# this proxy to the :13000 backends is cleartext, so run it over the
# trusted cluster (node mesh) network, not a public segment.
#
# Required modules (proxy_hcheck and its watchdog dependency provide the
# active /readyz health checks on the BalancerMember lines below):
#   sudo a2enmod proxy proxy_http proxy_balancer lbmethod_byrequests \
#       proxy_hcheck watchdog ssl headers
#
# The proxy contract this file implements:
#   /api/<anything>   -> backend /<anything>   (the /api prefix is stripped)
#   /apidocs          -> backend /apidocs       (passed through unchanged)
#   /flasgger_static  -> backend /flasgger_static (passed through unchanged)
#   /apispec_1.json   -> backend /apispec_1.json  (passed through unchanged)
#
# The doc paths must NOT live under /api: the Swagger UI fetches them
# from the server root, so they are proxied through unchanged.

# Redirect all plain HTTP traffic to HTTPS.
<VirtualHost *:80>
    ServerName sf.example.com

    Redirect permanent / https://sf.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName sf.example.com

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # TLS termination. Replace these placeholder paths with your own
    # certificate and private key.
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/sf.example.com.crt
    SSLCertificateKeyFile /etc/ssl/private/sf.example.com.key

    # Recommended hardening (uncomment and tune for your policy):
    # SSLProtocol -all +TLSv1.2 +TLSv1.3
    # Header always set Strict-Transport-Security "max-age=63072000"

    <Proxy "balancer://sfapi">
        # List every hypervisor here, one BalancerMember per node.
        #
        # Active health checking (mod_proxy_hcheck): probe each worker's
        # unauthenticated /readyz endpoint every 5 seconds and take it
        # out of rotation after 2 consecutive failures (~10s, well
        # inside the 25 second API_DRAIN_GRACE window in which a
        # draining worker answers 503 but keeps serving). See the health
        # checks section of docs/operator_guide/load_balancing.md.
        BalancerMember "http://10.0.0.1:13000" hcmethod=GET hcuri=/readyz hcinterval=5 hcpasses=2 hcfails=2
        BalancerMember "http://10.0.0.2:13000" hcmethod=GET hcuri=/readyz hcinterval=5 hcpasses=2 hcfails=2
    </Proxy>

    # Apache evaluates ProxyPass rules in order and the first match wins
    # (there is no longest-match, unlike nginx location blocks). The
    # OpenAPI doc paths below begin with the string "/api", so they must
    # be listed BEFORE the catch-all "/api" rule -- otherwise a request
    # for /apidocs would match "/api" first and be mangled.
    #
    # These paths are served from the server root (the Swagger UI fetches
    # them there) and are passed through unchanged.
    ProxyPass        "/apidocs"         "balancer://sfapi/apidocs"
    ProxyPassReverse "/apidocs"         "balancer://sfapi/apidocs"
    ProxyPass        "/flasgger_static" "balancer://sfapi/flasgger_static"
    ProxyPassReverse "/flasgger_static" "balancer://sfapi/flasgger_static"
    ProxyPass        "/apispec_1.json"  "balancer://sfapi/apispec_1.json"
    ProxyPassReverse "/apispec_1.json"  "balancer://sfapi/apispec_1.json"

    # Strip the /api prefix: /api/auth/namespaces -> backend /auth/namespaces.
    ProxyPass        "/api" "balancer://sfapi"
    ProxyPassReverse "/api" "balancer://sfapi"

    # Shaken Fist streams large disk images and blobs (many GB) through
    # the API. Lift the body-size limit and raise the proxy timeout so
    # long transfers are not cut off. Adjust ProxyTimeout to taste.
    LimitRequestBody 0
    ProxyTimeout 3600
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
