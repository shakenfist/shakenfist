---
# Shared Shaken Fist deploy playbook, imported by both
# examples/single-node/site.yml and examples/cluster/site.yml.
#
# THIS PLAYBOOK IS THE ONLY PLACE THAT READS INVENTORY GROUP NAMES (groups[...])
# AND CROSS-HOST FACTS (hostvars[...]). The shakenfist.shakenfist roles read
# only plain variables; this playbook maps the operator's inventory groups onto
# those variables and performs the cluster-wide reductions, then invokes the
# roles per host.
#
# Expected inventory groups:
#   * hypervisors   -- hosts that run instances (node_is_hypervisor)
#   * network_node  -- the single network node    (node_is_network_node)
#   * database_node -- the database tier           (node_is_database_node);
#                      the legacy etcd_master name is still accepted, with a
#                      deprecation warning, and is removed in the next release
#   * storage       -- optional, reserved for future use (no role flag yet)
#   * allsf         -- every Shaken Fist host
#   * kerbside      -- optional: hosts which run the Kerbside VDI console proxy.
#                      A member may also be in allsf (co-located) or not
#                      (dedicated). Absent or empty, Kerbside is not deployed.
#
# Per-host identity (node_name/node_egress_*/node_mesh_*) comes from host_vars.
#
# Operator-supplied cluster variables (set in group_vars/all or on the command
# line) include: auth_secret, system_key, deploy_name, dns_server, http_proxy,
# extra_config, floating_network_ipblock, mariadb_* (for the database tier),
# the optional Kerbside integration's kerbside_url, kerbside_token_duration and
# kerbside_system_key (a secret, minted as the system namespace's "kerbside"
# key), and the optional sf_build_local_wheels / repo_path / client_repo_path
# for a git-checkout deploy.
#
# With a kerbside group, Kerbside is deployed by the kerbside role of the
# shakenfist.kerbside collection, which Kerbside publishes and which is not
# part of shakenfist.shakenfist. Install it, at the versions this playbook
# accepts, with:
#
#     ansible-galaxy collection install -r examples/_shared/requirements.yml
#
# The Kerbside hosts also need kerbside_public_fqdn, kerbside_sql_url and
# kerbside_auth_secret_seed (both secrets), and may override the kerbside
# role's other defaults: its packages, ports and the three proxy certificate
# paths (kerbside_proxy_cert_path, kerbside_proxy_key_path and
# kerbside_cacert_path). kerbside_url and kerbside_system_key must be visible
# to both the allsf and the kerbside hosts (group_vars/all, not
# group_vars/kerbside): Shaken Fist's nodes render kerbside_url as KERBSIDE_URL
# and mint the credential, Kerbside renders the same values as its token
# audience and its source password, and the Kerbside validation play refuses a
# kerbside_url the two sides see differently. On a Kerbside host which is not
# in allsf, api_url must be an address of the Shaken Fist API that host can
# reach, not a loopback address.
#
# The role's kerbside_sources and kerbside_reserved_ports are built here, not
# read from the inventory. The node role's kerbside_source entry point builds
# this cluster's console source from deploy_name, api_url, kerbside_system_key
# and the CA /admin/cacert serves, and reserves the ports Shaken Fist uses. The
# optional kerbside_extra_sources (a secret: a list of further console sources,
# such as oVirt, OpenStack or static ones, each in the form kerbside_sources
# takes) is appended after this cluster's source.
#
# shakenfist.kerbside is a soft dependency. This playbook reaches its role only
# through ansible.builtin.include_role, never import_role or a play's roles:
# list, which ansible resolves while it parses the playbook, whether or not the
# play would run. So without the collection installed the playbook still
# parses, and deploys a cluster with no kerbside group. With one, the Kerbside
# validation play names the install command when the collection is missing,
# and refuses a version outside the range requirements.yml pins, before any
# host is changed. Keep it that way: every use of the role is an include_role.


# ---------------------------------------------------------------------------
# Preflight: quarantine unreachable nodes so one absent machine cannot abort the
# deploy for the rest. A host listed in the inventory may not answer this run --
# powered off, a dead disk (the 2026-07-20 sfcbr deploy hit exactly this), or in
# CI a node deliberately never created to prove the deploy survives it.
#
# Why a preflight rather than per-play error handling: ansible-playbook exits
# non-zero (code 4) if ANY host is ever unreachable, even with zero failed
# tasks, so an absent node would fail the whole deploy on its exit code alone.
# ignore_unreachable makes the probe below non-fatal (the run exits 0 with the
# absent node left out), and every later play targets '<pattern>:&reachable' so
# it never contacts an absent node again -- this probe is the only place one is
# reached, and keeping unreachable hosts out of the later plays also keeps them
# out of ansible_play_hosts, which the cross-host reductions depend on.
#
# Kerbside hosts are probed too, since a dedicated one is not in allsf and
# would otherwise never join 'reachable'. With no kerbside group the pattern
# matches allsf alone.
# ---------------------------------------------------------------------------
- name: Probe every node for reachability
  hosts: allsf:kerbside
  gather_facts: false
  become: false
  ignore_unreachable: true
  tasks:
    - name: Probe this node
      ansible.builtin.ping:
      register: node_probe


# ---------------------------------------------------------------------------
# Build the 'reachable' group from the probe results and validate the cluster
# shape. This runs on localhost -- not allsf -- on purpose: add_host has
# BYPASS_HOST_LOOP set, so a per-host "register myself" task would run only once
# (for the first host) and silently drop every other node. Looping add_host over
# the probe results from a single host is the reliable idiom.
#
# A hypervisor is fungible capacity, so an absent one is tolerated (the deploy
# runs on the rest). The network node and the database tier are not -- the
# cluster cannot come up without them -- so an absent one fails here, loudly and
# early, rather than deep in a later play with a cryptic error. Runs on localhost
# so the assertions fire even when the reachable set is empty.
# ---------------------------------------------------------------------------
- name: Quarantine unreachable nodes and validate the cluster shape
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    database_tier: "{{ (groups.get('database_node', []) + groups.get('etcd_master', [])) | unique }}"
    probed_hosts: "{{ groups['allsf'] | union(groups.get('kerbside', [])) }}"
  tasks:
    - name: Register the nodes that answered in the 'reachable' group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: reachable
      loop: "{{ probed_hosts }}"
      when:
        - hostvars[item].node_probe is defined
        - hostvars[item].node_probe is not unreachable
      changed_when: false

    - name: Warn about nodes absent from this deploy
      ansible.builtin.debug:
        msg: >-
          Deploying around absent node(s):
          {{ probed_hosts | difference(groups['reachable'] | default([])) | join(', ') }}.
          They did not answer and are excluded from this run; re-run once they
          return.
      when: (probed_hosts | difference(groups['reachable'] | default([]))) | length > 0

    - name: Fail if no hypervisor is reachable
      ansible.builtin.assert:
        that: (groups.get('hypervisors', []) | intersect(groups['reachable'] | default([]))) | length > 0
        fail_msg: >-
          No hypervisor answered this deploy. At least one hypervisor must be
          reachable to compute cluster-wide values and run instances.

    - name: Fail if the network node is absent
      ansible.builtin.assert:
        that: (groups.get('network_node', []) | intersect(groups['reachable'] | default([]))) | length > 0
        fail_msg: >-
          The network node did not answer this deploy. Unlike a hypervisor it
          cannot be deployed around -- the cluster's networking depends on it --
          so fix its reachability and re-run.

    - name: Fail if no database-tier node is reachable
      ansible.builtin.assert:
        that: (database_tier | intersect(groups['reachable'] | default([]))) | length > 0
        fail_msg: >-
          No database-tier node answered this deploy. At least one must be
          reachable to bootstrap and serve the cluster database.

    # kerbside_url is rendered as KERBSIDE_URL on every Shaken Fist node, and
    # it is the audience Kerbside accepts on a console token, whether this
    # playbook deploys Kerbside or an operator brought their own. So every
    # node must see one value, and that value must be the audience byte for
    # byte: sf-api strips a trailing slash before it mints the audience, and
    # Kerbside takes the value verbatim, so a kerbside_url ending in a slash
    # passes every other check and then fails every exchange. Both are judged
    # here, before any host is changed, from the inventory alone. URLs are not
    # secrets, so the messages name the values.
    - name: Fail if a Shaken Fist node sees kerbside_url differently from the first
      ansible.builtin.assert:
        that: kerbside_url_on_this_sf_node == kerbside_url_on_first_sf_node
        fail_msg: >-
          {{ item }} sees kerbside_url as
          {{ kerbside_url_on_this_sf_node | default('nothing', true) }}, but
          {{ groups['allsf'][0] }} sees
          {{ kerbside_url_on_first_sf_node | default('nothing', true) }}.
          Every node renders it as KERBSIDE_URL, and it is Kerbside's token
          audience, so set it once, where every allsf host reads it, for
          example in group_vars/all.
        quiet: true
      loop: "{{ groups['allsf'] }}"
      vars:
        kerbside_url_on_this_sf_node: "{{ hostvars[item].kerbside_url | default('') | string }}"
        kerbside_url_on_first_sf_node: "{{ hostvars[groups['allsf'][0]].kerbside_url | default('') | string }}"

    - name: Fail if kerbside_url ends in a slash
      ansible.builtin.assert:
        that: not kerbside_url_on_first_sf_node.endswith('/')
        fail_msg: >-
          kerbside_url is {{ kerbside_url_on_first_sf_node }}, which ends in a
          slash. sf-api mints console tokens for the audience without it, and
          Kerbside accepts the value as written, so every token would be
          refused. Remove the trailing slash.
        quiet: true
      vars:
        kerbside_url_on_first_sf_node: "{{ hostvars[groups['allsf'][0]].kerbside_url | default('') | string }}"


# ---------------------------------------------------------------------------
# Refuse a Kerbside configuration which cannot work, before any host is
# changed. The node role's kerbside_source entry point, and then the kerbside
# role's validate entry point, run on every reachable Kerbside host, with that
# host's own variables: operators commonly keep the Kerbside settings in
# group_vars/kerbside, which localhost cannot see, so validating on localhost
# would refuse a correct inventory, and a host_vars override on one Kerbside
# host is seen by no other, so validating one host would miss it. With no
# kerbside group this play matches no host and nothing runs, which is the
# feature-off path, and needs no shakenfist.kerbside installed.
#
# kerbside_source builds this cluster's console source and the ports Kerbside
# must leave alone, and refuses what only Shaken Fist can judge.
# kerbside_colocated says whether this Kerbside host is also a Shaken Fist
# node, whose daemons' ports are then reserved, and where a loopback api_url
# reaches that node's own sf-api. kerbside_url_on_sf_nodes is kerbside_url as
# the Shaken Fist nodes see it, which kerbside_source requires to equal the
# Kerbside hosts' kerbside_url, since the one variable is both Shaken Fist's
# KERBSIDE_URL and Kerbside's token audience. Shaken Fist is not deployed yet,
# so the CA its /admin/cacert serves is not known: kerbside_sf_ca_cert is null,
# the source carries a placeholder, and the Deploy Kerbside play builds it
# again with the CA.
#
# validate runs in a block whose rescue stops the deploy either way: naming the
# install command when the role could not be loaded at all, and otherwise
# pointing at validate's refusal. public exposes the role's
# kerbside_collection_version, which is then checked against the range
# requirements.yml pins. A checkout of Kerbside reports unreleased, which is
# accepted with a warning, so a Kerbside pull request can deploy its own role.
# any_errors_fatal makes a refusal on any one host end the whole run, not just
# this play's hosts, so no later play touches allsf.
# ---------------------------------------------------------------------------
- name: Validate the Kerbside configuration
  hosts: kerbside:&reachable
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    # The version range requirements.yml pins shakenfist.kerbside to, read
    # from the file itself so the pin has one source. playbook_dir is this
    # file's directory, also when another playbook imports it.
    kerbside_collection_range: >-
      {{ ((lookup('ansible.builtin.file', playbook_dir ~ '/requirements.yml') | from_yaml).collections
          | selectattr('name', 'equalto', 'shakenfist.kerbside') | first).version | string }}
    # What the installed collection says it is, empty when it says nothing.
    kerbside_collection_reported: "{{ kerbside_collection_version | default('') | string }}"
    # The clauses of the range a released version fails, compared as
    # ansible-galaxy compares them, joined as text; empty when it meets every
    # one, and when there is no release version to compare.
    kerbside_collection_unmet: >-
      {%- set ns = namespace(unmet=[]) -%}
      {%- if kerbside_collection_reported not in ['', 'unreleased'] -%}
      {%- for clause in kerbside_collection_range.split(',') | map('trim') | reject('in', ['', '*']) -%}
      {%- set operator = clause | regex_replace('^([<>=!]*).*$', '\\1') -%}
      {%- set test = {'': 'eq', '==': 'eq', '!=': 'ne', '>=': 'ge', '>': 'gt', '<=': 'le',
                      '<': 'lt'}[operator] -%}
      {%- if kerbside_collection_reported is not version(clause[operator | length:] | trim, test,
                                                         version_type='semver') -%}
      {%- set ns.unmet = ns.unmet + [clause] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {{ ns.unmet | join(', ') }}
    # Why the installed collection is not one this playbook accepts, or
    # nothing when it is (ansible renders an empty template as None, hence the
    # default('', true) wherever it is read).
    kerbside_collection_problem: >-
      {%- if kerbside_collection_reported == '' -%}
      shakenfist.kerbside does not report its version, so it predates the
      releases this playbook accepts ({{ kerbside_collection_range }})
      {%- elif kerbside_collection_unmet | default('', true) | length > 0 -%}
      shakenfist.kerbside {{ kerbside_collection_reported }} is installed, but
      requirements.yml pins {{ kerbside_collection_range }}
      {%- endif -%}
  tasks:
    - name: Build this cluster's Kerbside source and reserved ports
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.node
        tasks_from: kerbside_source
      vars:
        kerbside_colocated: "{{ inventory_hostname in groups['allsf'] }}"
        kerbside_url_on_sf_nodes: "{{ hostvars[groups['allsf'][0]]['kerbside_url'] | default('') }}"
        kerbside_sf_ca_cert: null

    - name: Validate the Kerbside configuration with the kerbside role
      block:
        - name: Run the kerbside role's validate entry point
          ansible.builtin.include_role:
            name: shakenfist.kerbside.kerbside
            tasks_from: validate
            public: true
          vars:
            kerbside_hosts: "{{ groups.get('kerbside', []) }}"
            kerbside_sources: "{{ [kerbside_sf_source] + kerbside_extra_sources | default([]) }}"
      rescue:
        # Three ways here. The role could not be loaded, which leaves
        # kerbside_collection_version, the role's own variable, undefined:
        # that is how a role which is not installed fails. One of validate's
        # tasks refused this host, which defines ansible_failed_task. Or this
        # host passed and another failed, which any_errors_fatal brings every
        # host here for. A rescue which did not fail would let the deploy
        # carry on past a refusal, so this always fails.
        - name: Stop the deploy, saying what to fix
          ansible.builtin.fail:
            msg: >-
              {% if kerbside_collection_version is not defined -%}
              shakenfist.kerbside is not installed; run ansible-galaxy
              collection install -r examples/_shared/requirements.yml (the
              kerbside role could not be loaded; if shakenfist.kerbside is
              installed, the error above says why).
              {%- else -%}
              {%- if ansible_failed_task is defined -%}
              The kerbside role refused the Kerbside configuration on
              {{ inventory_hostname }} in its task "{{ ansible_failed_task.name }}",
              for the reason above.
              {%- else -%}
              The kerbside role refused the Kerbside configuration on another
              Kerbside host, for the reason above, so {{ inventory_hostname }}
              stops too.
              {%- endif -%}
              {%- if kerbside_collection_problem | default('', true) | length > 0 %}
              {{ kerbside_collection_problem }}, which may be why: install a
              release in that range with ansible-galaxy collection install
              --force -r examples/_shared/requirements.yml.
              {%- endif -%}
              {%- endif %}

    - name: Refuse a shakenfist.kerbside outside the range requirements.yml pins
      ansible.builtin.assert:
        that: kerbside_collection_problem | default('', true) | length == 0
        fail_msg: >-
          {{ kerbside_collection_problem }}. Install a release in that range with
          ansible-galaxy collection install --force -r
          examples/_shared/requirements.yml.
        quiet: true
      run_once: true

    - name: Warn that shakenfist.kerbside is not a release
      ansible.builtin.debug:
        msg: >-
          WARNING: shakenfist.kerbside reports its version as unreleased, so
          it was installed from a checkout of Kerbside rather than a release,
          and the range requirements.yml pins ({{ kerbside_collection_range }})
          does not apply to it. It is installed at
          {{ ([playbook_dir ~ '/collections'] + lookup('ansible.builtin.config', 'COLLECTIONS_PATHS'))
             | product(['ansible_collections/shakenfist/kerbside']) | map('path_join')
             | select('directory') | first
             | default('a path outside the collection paths, such as Python site-packages') }}.
      when: kerbside_collection_reported == 'unreleased'
      run_once: true


# ---------------------------------------------------------------------------
# Play 0 (optional, gated): build the server and client wheels from local git
# checkouts and distribute them to every host's /tmp, then point
# server_package / client_package at the distributed wheels. Operators
# deploying released packages skip this entirely (sf_build_local_wheels is
# false by default and server_package / client_package default to the PyPI
# names). This mirrors the legacy deploy/ansible/tasks/build-wheel.yml +
# getsf wheel-copy mechanism, and is what the step-5 CI path uses to deploy
# the current commit.
# ---------------------------------------------------------------------------
- name: Build Shaken Fist wheels from local checkouts
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    sf_build_local_wheels: false
  tasks:
    - name: Build and locate the local wheels
      when: sf_build_local_wheels | bool
      block:
        - name: Fail if repo_path / client_repo_path are not set
          ansible.builtin.assert:
            that:
              - repo_path is defined
              - client_repo_path is defined
            fail_msg: >-
              sf_build_local_wheels is true but repo_path and/or
              client_repo_path are not set. Point them at the local
              shakenfist (server) and client-python checkouts.

        - name: Build the server and client wheels
          ansible.builtin.shell:
            cmd: rm -rf build dist *.egg-info && python3 -m build --wheel .
            chdir: "{{ item }}"
          changed_when: true
          loop:
            - "{{ repo_path }}"
            - "{{ client_repo_path }}"

        - name: Find the freshly built server wheel
          ansible.builtin.shell:
            cmd: set -o pipefail; ls -rt {{ repo_path }}/dist/shakenfist-*.whl | tail -1
            executable: /bin/bash
          register: server_wheel
          changed_when: false

        - name: Find the freshly built client wheel
          ansible.builtin.shell:
            cmd: set -o pipefail; ls -rt {{ client_repo_path }}/dist/shakenfist_client-*.whl | tail -1
            executable: /bin/bash
          register: client_wheel
          changed_when: false

        - name: Record the local wheel paths for later plays
          ansible.builtin.set_fact:
            local_server_wheel: "{{ server_wheel.stdout }}"
            local_client_wheel: "{{ client_wheel.stdout }}"

- name: Distribute local wheels and override the package references
  hosts: allsf:&reachable
  gather_facts: false
  become: true
  vars:
    sf_build_local_wheels: false
  tasks:
    - name: Distribute the local wheels and repoint the package variables
      when: sf_build_local_wheels | bool
      block:
        - name: Copy the server wheel to this host's /tmp
          ansible.builtin.copy:
            src: "{{ hostvars['localhost']['local_server_wheel'] }}"
            dest: "/tmp/{{ hostvars['localhost']['local_server_wheel'] | basename }}"
            mode: "0644"

        - name: Copy the client wheel to this host's /tmp
          ansible.builtin.copy:
            src: "{{ hostvars['localhost']['local_client_wheel'] }}"
            dest: "/tmp/{{ hostvars['localhost']['local_client_wheel'] | basename }}"
            mode: "0644"

        - name: Point server_package / client_package at the distributed wheels
          ansible.builtin.set_fact:
            server_package: "/tmp/{{ hostvars['localhost']['local_server_wheel'] | basename }}"
            client_package: "/tmp/{{ hostvars['localhost']['local_client_wheel'] | basename }}"


# ---------------------------------------------------------------------------
# Play 1: compute the capability flags and cluster-wide reductions. This is the
# fact-computation stage and the only place groups[...] / hostvars[...] are
# read. It runs against allsf (and gathers facts so ansible_memtotal_mb is
# available). validate_mtus runs FIRST (below) so node_mtu is populated before
# we reduce max_hypervisor_mtu over the hypervisors that answered this run; see
# the absent-node tolerance note inside the play.
# ---------------------------------------------------------------------------

# Determine each host's mesh-interface MTU on the network + hypervisor hosts so
# the reduction below can take the minimum. This is also part of preflight
# validation (it aborts on an MTU that is too low).
- name: Validate mesh MTUs (network + hypervisor hosts)
  hosts: network_node:hypervisors:&reachable
  become: true
  gather_facts: true
  tasks:
    - name: Run the network role's validate_mtus entry point
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.network
        tasks_from: validate_mtus

- name: Compute capability flags and cluster-wide values
  hosts: allsf:&reachable
  become: false
  gather_facts: true
  tasks:
    # The database tier is the database_node group. The legacy etcd_master
    # name is accepted for one release so existing inventories keep working.
    - name: Compute the database tier host list
      ansible.builtin.set_fact:
        database_tier_hosts: >-
          {{ (groups.get('database_node', []) + groups.get('etcd_master', []))
             | unique }}

    - name: Fail if the inventory has no database tier
      ansible.builtin.assert:
        that: database_tier_hosts | length > 0
        fail_msg: >-
          No database tier found in the inventory. Put your database-tier
          hosts (which must also be in allsf) in a database_node group; the
          old groups['...'] hard index failed loudly on a missing or
          misspelled group, and this assertion preserves that behaviour.
      run_once: true

    - name: Warn about the legacy etcd_master group name
      ansible.builtin.debug:
        msg: >-
          DEPRECATION: the etcd_master inventory group has been renamed to
          database_node. Support for the legacy name will be removed in the
          next release; please rename the group in your inventory.
      when: groups.get('etcd_master', []) | length > 0
      run_once: true

    # Per-host capability flags from group membership.
    - name: Set per-host capability flags
      ansible.builtin.set_fact:
        node_is_hypervisor: "{{ inventory_hostname in groups.get('hypervisors', []) }}"
        node_is_network_node: "{{ inventory_hostname in groups.get('network_node', []) }}"
        node_is_database_node: "{{ inventory_hostname in database_tier_hosts }}"

    # Cluster-wide values -- identical on every host. Computed once from the
    # group lists, then assigned to every host. The assertions turn a missing
    # or misspelled group into a readable failure instead of a cryptic Jinja2
    # index or empty-sequence error, matching the database tier check above.
    - name: Fail if the inventory has no network node
      ansible.builtin.assert:
        that: groups.get('network_node', []) | length > 0
        fail_msg: >-
          No network node found in the inventory. Put exactly one host
          (which must also be in allsf) in a network_node group.
      run_once: true

    - name: Fail if the inventory has no hypervisors
      ansible.builtin.assert:
        that: groups.get('hypervisors', []) | length > 0
        fail_msg: >-
          No hypervisors found in the inventory. Put your hypervisor hosts
          (which must also be in allsf) in a hypervisors group.
      run_once: true

    # -----------------------------------------------------------------------
    # Absent-node tolerance. This play runs on allsf:&reachable, so both
    # ansible_play_hosts and groups['reachable'] already exclude any node that
    # did not answer the preflight probe (see the "Quarantine unreachable nodes"
    # play at the top of this file and the reachable-cluster assertions right
    # after it, which fail loudly if an essential node is absent).
    #
    # The reductions below come in two kinds, and conflating them is what broke
    # the 2026-07-20 sfcbr deploy (one dead hypervisor aborted every healthy
    # node):
    #   * Reductions over static inventory host_vars (node_mesh_ip) are defined
    #     for every inventory host whether or not it answered, so they reduce
    #     over the full group -- and SHOULD: a node that is down for this run
    #     still belongs in the mesh so it rejoins when it returns.
    #   * Reductions over runtime-gathered facts (node_mtu, which validate_mtus
    #     sets only on reachable hosts) must reduce over the reachable subset.
    #     Over the full group they dereference a fact that was never set on the
    #     absent host and fail the task on EVERY host (HostVarsVars has no
    #     attribute 'node_mtu').
    - name: Compute the hypervisors that answered the reachability probe
      ansible.builtin.set_fact:
        reachable_hypervisors: "{{ groups['hypervisors'] | intersect(groups['reachable']) }}"

    - name: Compute the network node mesh IP
      ansible.builtin.set_fact:
        network_node_ip: "{{ hostvars[groups['network_node'][0]]['node_mesh_ip'] }}"

    - name: Compute the MariaDB gateway host list (every database node's mesh IP)
      ansible.builtin.set_fact:
        mariadb_gateway_hosts: >-
          {{ database_tier_hosts
             | map('extract', hostvars, 'node_mesh_ip')
             | list }}

    - name: Compute the name->mesh-IP map for every host
      ansible.builtin.set_fact:
        all_mesh_hosts: >-
          {{ dict(groups['allsf']
                  | zip(groups['allsf']
                        | map('extract', hostvars, 'node_mesh_ip')
                        | list)) }}

    # Reduces over reachable_hypervisors, not groups['hypervisors']: node_mtu is
    # a runtime fact set only on hosts that answered (see the absent-node note
    # above), so an absent hypervisor left in the reduction fails this on every
    # host.
    - name: Compute the lowest MTU across all reachable hypervisors
      ansible.builtin.set_fact:
        max_hypervisor_mtu: >-
          {{ reachable_hypervisors
             | map('extract', hostvars, 'node_mtu')
             | map('int')
             | min }}

    # Per-host resource reservation defaults. These are per-host (not
    # cluster-wide) and fold in the infra-role bump that used to be applied
    # server-side: network/database nodes get extra RAM and CPU headroom for
    # the daemons they run in addition to hypervisor workloads. The operator
    # may override any of node_ram_reservation_gb / node_cpu_reservation_threads
    # / node_disk_reservation_gb per host in inventory host_vars/group_vars;
    # this only fills in a sensible default when the var is not already set.
    #
    # node_ram_reservation_gb is in GB (SHAKENFIST_NODE_RAM_RESERVATION_GB is
    # multiplied by 1024 to get MB by the scheduler), so this must be computed
    # in GB -- ansible_memtotal_mb is in MB. 10% of system RAM, floored at
    # 2 GB, plus 4 GB on network/database nodes.
    - name: Default the per-host resource reservations
      ansible.builtin.set_fact:
        node_ram_reservation_gb: >-
          {{ ([2.0, (ansible_memtotal_mb / 1024.0 * 0.1) | round(2)] | max)
             + ((node_is_network_node or node_is_database_node) | ternary(4.0, 0.0)) }}
      when: node_ram_reservation_gb is not defined

    - name: Default the per-host CPU thread reservation
      ansible.builtin.set_fact:
        node_cpu_reservation_threads: >-
          {{ (1 + ((node_is_network_node or node_is_database_node) | ternary(1, 0))) * 2 }}
      when: node_cpu_reservation_threads is not defined

    - name: Default the per-host disk reservation
      ansible.builtin.set_fact:
        node_disk_reservation_gb: 20
      when: node_disk_reservation_gb is not defined


# ---------------------------------------------------------------------------
# Play 2: remaining preflight validation -- confirm KVM works on hypervisors.
# (validate_mtus already ran above.)
# ---------------------------------------------------------------------------
- name: Validate KVM on hypervisors
  hosts: hypervisors:&reachable
  become: true
  gather_facts: false
  tasks:
    - name: Run the hypervisor role's validate_kvm entry point
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.hypervisor
        tasks_from: validate_kvm


# ---------------------------------------------------------------------------
# Play 3: internal CA. Bootstrap the CA once on the control node, then issue
# and distribute a per-host SPICE TLS certificate to every host. Mirrors the
# legacy pki ordering (bootstrap on localhost, then host_certificate +
# distribute_certificates per host).
# ---------------------------------------------------------------------------
- name: Bootstrap the internal certificate authority
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
    - name: Create the deployment CA
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.internal_ca
        tasks_from: bootstrap

- name: Issue and distribute per-host certificates
  hosts: allsf:&reachable
  become: true
  gather_facts: false
  tasks:
    - name: Issue this host's certificate (generated on the control node)
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.internal_ca
        tasks_from: host_certificate
      vars:
        hostname: "{{ inventory_hostname }}"

    - name: Distribute this host's certificate
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.internal_ca
        tasks_from: distribute_certificates
      vars:
        hostname: "{{ inventory_hostname }}"


# ---------------------------------------------------------------------------
# Play 4: install + configure every node (bootstrap + config), database tier
# first so sf-database / the gRPC gateway is configured before the rest.
# Component roles (hypervisor, network) are applied here too, gated by the
# capability flags. We split bootstrap/config from register (play 6) so the
# schema (play 5) can be ensured between them, and so the database tier can
# register before the rest.
# ---------------------------------------------------------------------------
- name: Bootstrap and configure the database tier
  hosts: database_node:etcd_master:&reachable
  become: true
  gather_facts: true
  tasks:
    - name: Bootstrap the database-tier node
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.node
        tasks_from: bootstrap

    - name: Configure the database-tier node
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.node
        tasks_from: config

- name: Bootstrap and configure the remaining nodes
  hosts: allsf:!database_node:!etcd_master:&reachable
  become: true
  gather_facts: true
  tasks:
    - name: Bootstrap the node
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.node
        tasks_from: bootstrap

    - name: Apply the network role on the network node
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.network
      when: node_is_network_node | bool

    - name: Apply the hypervisor role on hypervisors
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.hypervisor
      when: node_is_hypervisor | bool

    - name: Configure the node
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.node
        tasks_from: config

# The network and hypervisor roles also apply to database-tier hosts that
# happen to carry those capabilities (for example the single-node deploy where
# localhost is everything). Applied after the database tier is configured.
- name: Apply component roles to database-tier hosts that also carry them
  hosts: database_node:etcd_master:&reachable
  become: true
  gather_facts: false
  tasks:
    - name: Apply the network role if this database node is also the network node
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.network
      when: node_is_network_node | bool

    - name: Apply the hypervisor role if this database node is also a hypervisor
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.hypervisor
      when: node_is_hypervisor | bool


# ---------------------------------------------------------------------------
# Play 5: ensure the MariaDB schema exists, ONCE, delegated to a database-tier
# host (which has direct MARIADB_HOST in /etc/sf/config from play 4's config).
# This is the byo-mariadb command, and it must run before any node registers.
# ---------------------------------------------------------------------------
- name: Ensure the MariaDB schema exists (once)
  hosts: database_node:etcd_master:&reachable
  become: true
  gather_facts: false
  tasks:
    - name: Run sf-ctl ensure-mariadb-schema on the first database host
      ansible.builtin.command: /srv/shakenfist/venv/bin/sf-ctl ensure-mariadb-schema
      delegate_to: "{{ database_tier_hosts[0] }}"
      run_once: true
      changed_when: true


# ---------------------------------------------------------------------------
# Play 6a: write the cluster config and the system namespace key BEFORE any
# node registers. register starts sf-database, whose ExecStartPre=verify-config
# requires AUTH_SECRET_SEED to already be in the cluster_config table. These
# sf-ctl calls are delegated to the first database-tier host, which has direct
# MariaDB access (SHAKENFIST_MARIADB_HOST in /etc/sf/config); byo-mariadb
# removed the localhost escape hatch, so direct access relies on that config.
# Reproduces legacy roles/primary/cluster_config.yml and
# roles/base/create_admin_namespace.yml.
# ---------------------------------------------------------------------------
- name: Write the cluster configuration (once, before register)
  hosts: database_node:etcd_master:&reachable
  become: true
  gather_facts: false
  run_once: true
  vars:
    http_proxy: ""
    extra_config: "[]"
    cluster_db_host: "{{ database_tier_hosts[0] }}"
  tasks:
    # First, before any set-config: refuse to deploy a kerbside_url or
    # kerbside_token_duration which a cluster_config row (existing, or about to
    # be written from extra_config below) would silently override. Does nothing
    # unless kerbside_url is set. cluster_db_host and extra_config reach the
    # role as this play's vars; passing them again as include vars would be a
    # recursive template.
    - name: Check the Kerbside configuration against cluster_config
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.node
        tasks_from: kerbside_preflight

    # The seed is passed on stdin rather than as an argument so it never
    # appears in the process table on the database host.
    - name: Set the auth secret seed
      ansible.builtin.command: >-
        /srv/shakenfist/venv/bin/sf-ctl set-config --value-from-stdin AUTH_SECRET_SEED
      args:
        stdin: "{{ auth_secret }}"
      delegate_to: "{{ cluster_db_host }}"
      changed_when: true
      no_log: true

    - name: Set the maximum hypervisor MTU
      ansible.builtin.command: >-
        /srv/shakenfist/venv/bin/sf-ctl set-config
        MAX_HYPERVISOR_MTU {{ hostvars[cluster_db_host]['max_hypervisor_mtu'] }}
      delegate_to: "{{ cluster_db_host }}"
      changed_when: true

    - name: Set the DNS server
      ansible.builtin.command: >-
        /srv/shakenfist/venv/bin/sf-ctl set-config DNS_SERVER {{ dns_server }}
      delegate_to: "{{ cluster_db_host }}"
      changed_when: true

    - name: Set the HTTP proxy (only when one is configured)
      ansible.builtin.command: >-
        /srv/shakenfist/venv/bin/sf-ctl set-config HTTP_PROXY {{ http_proxy }}
      delegate_to: "{{ cluster_db_host }}"
      changed_when: true
      when: http_proxy | length != 0

    - name: Apply any extra cluster config
      ansible.builtin.command: >-
        /srv/shakenfist/venv/bin/sf-ctl set-config
        {{ item['name'] }} {{ item['value'] }}
      delegate_to: "{{ cluster_db_host }}"
      changed_when: true
      loop: "{{ extra_config | from_json }}"

    # Retire the pre-rename, now-inert RAM_SYSTEM_RESERVATION cluster_config
    # row. Reservations are now per-node NODE_* keys set via /etc/sf/config, so
    # this key is no longer read. Deleting an already-absent key is a no-op
    # (rowcount 0), so this is idempotent. Safe to remove in a future release.
    - name: Retire the inert RAM_SYSTEM_RESERVATION cluster config row
      ansible.builtin.command: >-
        /srv/shakenfist/venv/bin/sf-ctl unset-config RAM_SYSTEM_RESERVATION
      delegate_to: "{{ cluster_db_host }}"
      changed_when: false

    - name: Verify the cluster configuration
      ansible.builtin.command: /srv/shakenfist/venv/bin/sf-ctl verify-config
      delegate_to: "{{ cluster_db_host }}"
      changed_when: false

    # show-config redacts secret-classed values by default, so this output
    # is safe to log even though the config contains AUTH_SECRET_SEED.
    - name: Show the cluster configuration
      ansible.builtin.command: /srv/shakenfist/venv/bin/sf-ctl show-config
      delegate_to: "{{ cluster_db_host }}"
      changed_when: false
      register: cluster_config

    - name: Log the cluster configuration
      ansible.builtin.debug:
        msg: "{{ cluster_config.stdout }}"

    # Reproduces legacy create_admin_namespace.yml. The legacy keyname was
    # 'deploy'; preserved here. The key is passed on stdin rather than as an
    # argument so it never appears in the process table on the database host.
    - name: Bootstrap the system namespace key
      ansible.builtin.command: >-
        /srv/shakenfist/venv/bin/sf-ctl bootstrap-system-key --key-from-stdin deploy
      args:
        stdin: "{{ system_key }}"
      environment:
        SHAKENFIST_NODE_MESH_IP: "{{ hostvars[cluster_db_host]['node_mesh_ip'] }}"
      delegate_to: "{{ cluster_db_host }}"
      changed_when: true
      no_log: true

    # The Kerbside console token signing key (when kerbside_url is set) and
    # the system namespace's "kerbside" key (when kerbside_system_key is
    # set). Here, before plays 6b and 6c restart any daemon, so an sf-api
    # restarted with KERBSIDE_URL set always finds a signing key. node_mesh_ip
    # is passed because the role would otherwise see the run_once host's own,
    # which need not be cluster_db_host's.
    - name: Mint the Kerbside signing key and system namespace credential
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.node
        tasks_from: kerbside_credentials
      vars:
        node_mesh_ip: "{{ hostvars[cluster_db_host]['node_mesh_ip'] }}"


# ---------------------------------------------------------------------------
# Play 6b: register the database tier (starts sf-database and the gRPC gateway)
# BEFORE the remaining nodes register over that gateway. The ordering contract
# in the node role's register.yml requires this.
#
# serial: 1 rolls the tier one node at a time. Every SF client round-robins
# across all gateways in MARIADB_GATEWAY_HOSTS, so restarting them in parallel
# (ansible's default) takes the whole tier down at once -- the ~5s cluster-wide
# DatabaseUnavailable window seen on the 2026-07-15 sfcbr deploy, harmless with
# one gateway but an outage with several. Rolling one at a time keeps a gateway
# serving throughout; register.yml waits for each node's gateway to accept
# connections again before this play moves on, so the next restart never begins
# while a peer is still down. Database nodes reach MariaDB directly (not through
# the gateway), so a node can always register itself even while its own gateway
# is mid-restart.
# ---------------------------------------------------------------------------
- name: Register the database tier and start its daemons
  hosts: database_node:etcd_master:&reachable
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Register the database-tier node
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.node
        tasks_from: register

- name: Register the remaining nodes and start their daemons
  hosts: allsf:!database_node:!etcd_master:&reachable
  become: true
  gather_facts: false
  tasks:
    - name: Register the node
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.node
        tasks_from: register


# ---------------------------------------------------------------------------
# Play 7: final sanity checks, reproducing legacy roles/primary/postinstall.yml
# (minus the ansible-module copy, which dies with the native modules in step 4):
# sf-api and sf-queues active, and the API returns 401 unauthenticated. Runs on
# every host that runs the API (allsf).
# ---------------------------------------------------------------------------
- name: Final deployment sanity checks
  hosts: allsf:&reachable
  become: true
  gather_facts: false
  tasks:
    - name: Rotate and vacuum logs
      ansible.builtin.shell: |
        journalctl --rotate
        journalctl --vacuum-time=2d
        /usr/sbin/logrotate -f /etc/logrotate.conf
      changed_when: true
      failed_when: false

    - name: Verify sf-api is active
      ansible.builtin.command: systemctl is-active sf-api
      register: sf_api_status
      changed_when: false
      failed_when: sf_api_status.stdout != "active"

    - name: Verify sf-queues is active
      ansible.builtin.command: systemctl is-active sf-queues
      register: sf_queues_status
      changed_when: false
      failed_when: sf_queues_status.stdout != "active"

    - name: Verify the API responds 401 unauthenticated
      ansible.builtin.command: >-
        curl -s -o /dev/null -w "%{http_code}" http://localhost:13000/auth/namespaces
      register: api_response
      changed_when: false
      failed_when: api_response.stdout != "401"
      retries: 5
      delay: 2
      until: api_response.stdout == "401"

    - name: Log the sanity-check results
      ansible.builtin.debug:
        msg: >-
          Sanity checks passed: sf-api={{ sf_api_status.stdout }},
          sf-queues={{ sf_queues_status.stdout }},
          API HTTP {{ api_response.stdout }} (expected 401).


# ---------------------------------------------------------------------------
# Play 8: deploy Kerbside on the kerbside group, last, so that sf-api is proven
# up above and play 6a has already minted the signing key and the "kerbside"
# credential before Kerbside's first scrape. A Kerbside failure is then never
# confused with a Shaken Fist one. With no kerbside group this play matches no
# host. A member may be in allsf or not; nothing here assumes the node role ran.
#
# kerbside_hosts is the reachable members only, since register runs its
# migration and readiness check on kerbside_hosts[0]. Only derived names are
# play vars: play vars outrank inventory group_vars (#4441), so an operator
# setting would be silently ignored here. kerbside_sources is derived: this
# cluster's source, which kerbside_source builds again below now that the CA is
# known, then kerbside_extra_sources. The kerbside role reads
# kerbside_reserved_ports from the fact kerbside_source sets.
#
# The proxy certificate comes from internal_ca unless the operator supplied
# all three override paths (validate refused anything in between). Its
# cert_dest_dir and file names are the kerbside role's kerbside_pki_dir,
# kerbside_proxy_cert_name, kerbside_proxy_key_name and
# kerbside_proxy_cacert_name, which the role reads itself and are not passed
# here: the same expressions as the role's defaults, so an inventory value for
# any of them, or for kerbside_config_dir, reaches both.
# ---------------------------------------------------------------------------
- name: Deploy Kerbside
  hosts: kerbside:&reachable
  become: true
  gather_facts: false
  vars:
    kerbside_hosts: "{{ groups.get('kerbside', []) | intersect(groups['reachable'] | default([])) }}"
    kerbside_sources: "{{ [kerbside_sf_source] + kerbside_extra_sources | default([]) }}"
  tasks:
    # The CA /admin/cacert serves, from the file it serves it from, so that
    # Kerbside's comparison of sources.yaml's ca_cert with it passes by
    # construction, whatever issued the SPICE certificates. A run_once
    # result is registered on every host in the play.
    - name: Read the CA which Shaken Fist's /admin/cacert serves
      ansible.builtin.slurp:
        src: /etc/pki/libvirt-spice/ca-cert.pem
      register: kerbside_sf_ca_slurp
      run_once: true
      delegate_to: "{{ kerbside_sf_ca_host }}"
      vars:
        kerbside_sf_ca_host: >-
          {{ ((groups.get('database_node', []) + groups.get('etcd_master', []))
              | unique | intersect(groups['reachable'] | default([]))) | first }}

    # As in the validation play, but with the CA, which replaces the
    # placeholder the validation play's source carried.
    - name: Build this cluster's Kerbside source and reserved ports
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.node
        tasks_from: kerbside_source
      vars:
        kerbside_colocated: "{{ inventory_hostname in groups['allsf'] }}"
        kerbside_url_on_sf_nodes: "{{ hostvars[groups['allsf'][0]]['kerbside_url'] | default('') }}"
        kerbside_sf_ca_cert: "{{ kerbside_sf_ca_slurp.content | b64decode }}"

    # Creates the kerbside group the certificate's key is readable by.
    - name: Bootstrap Kerbside
      ansible.builtin.include_role:
        name: shakenfist.kerbside.kerbside
        tasks_from: bootstrap

    - name: Issue this host's Kerbside proxy certificate (generated on the control node)
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.internal_ca
        tasks_from: host_certificate
      vars: &kerbside_certificate_vars
        hostname: "{{ inventory_hostname }}"
        cert_name: "{{ inventory_hostname }}-kerbside"
        cert_cn: "{{ kerbside_public_fqdn }}"
        # An address belongs in an IP SAN, and a name in a DNS SAN: a client
        # which checks the host name matches an address only against the
        # former. A dotted quad is an IPv4 address, and anything with a colon
        # is IPv6 (a DNS name never contains one), which avoids depending on
        # ansible.utils, which this collection does not require.
        kerbside_cert_fqdn_is_address: >-
          {{ kerbside_public_fqdn is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
             or ':' in kerbside_public_fqdn }}
        cert_san_dns: "{{ [] if kerbside_cert_fqdn_is_address else [kerbside_public_fqdn] }}"
        cert_san_ip: "{{ [kerbside_public_fqdn] if kerbside_cert_fqdn_is_address else [] }}"
        cert_dest_dir: "{{ kerbside_pki_dir | default((kerbside_config_dir | default('/etc/kerbside')) ~ '/pki') }}"
        cert_dest_cert_name: "{{ kerbside_proxy_cert_name | default('server-cert.pem') }}"
        cert_dest_key_name: "{{ kerbside_proxy_key_name | default('server-key.pem') }}"
        cert_dest_ca_name: "{{ kerbside_proxy_cacert_name | default('ca-cert.pem') }}"
        cert_owner: "{{ kerbside_file_owner | default('root') }}"
        cert_group: "{{ kerbside_group | default('kerbside') }}"
        cert_key_mode: "0640"
      when: kerbside_proxy_cert_path | default('') | length == 0

    - name: Distribute this host's Kerbside proxy certificate
      ansible.builtin.include_role:
        name: shakenfist.shakenfist.internal_ca
        tasks_from: distribute_certificates
      vars: *kerbside_certificate_vars
      when: kerbside_proxy_cert_path | default('') | length == 0

    - name: Configure Kerbside
      ansible.builtin.include_role:
        name: shakenfist.kerbside.kerbside
        tasks_from: config

    - name: Start Kerbside and wait for its first scrape
      ansible.builtin.include_role:
        name: shakenfist.kerbside.kerbside
        tasks_from: register
