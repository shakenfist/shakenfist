# A Loki alerting rule which fires when a Shaken Fist key secret
# reaches your log stream.
#
# Shaken Fist treats a credential in the log stream as a bug, and the
# code is written so that one cannot get there by accident. This rule
# is the backstop for the case where it happens anyway: secrets the
# cluster mints for itself carry an sfk_ prefix and a checksum
# precisely so that an escaped one is greppable. See
# docs/operator_guide/logging.md.
#
# Installing this:
#
#   1. Copy this file into your Loki ruler's rule directory. For a
#      monolithic Loki that is the path in `ruler.storage.local.directory`,
#      with a subdirectory per tenant -- typically
#      `/etc/loki/rules/<tenant>/loki-secret-alert.yaml`. The tenant
#      must match the `loki_tenant` you deployed Shaken Fist with; a
#      rule filed under the wrong tenant loads without error and never
#      fires, which looks exactly like success.
#   2. Make sure the ruler has an `alertmanager_url` configured, or the
#      rule evaluates and has nowhere to send the result.
#   3. Reload or restart Loki, and confirm the rule is loaded at
#      `/loki/api/v1/rules`.
#
# Confirming it works, which is worth doing once: the expression is the
# same one Shaken Fist's own functional CI asserts on, and that test
# proves the expression fires before it asserts nothing matched. You
# can do the same by hand -- log a line containing `sfk_` followed by
# 38 letters and digits, and watch the alert fire. Do not test it with
# a real key.
#
# The `job` label is what the Shaken Fist log shipper sets. If you have
# relabelled it, change the selector here to match; the shipper also
# sets `daemon` and `host`, which are what the alert reports back.

groups:
  - name: shakenfist-credentials
    # Every 30s rather than the more usual minute: the window between a
    # credential being logged and someone knowing about it is the whole
    # point of this rule.
    interval: 30s
    rules:
      - alert: ShakenFistKeySecretInLogs
        # Matched on shape, not on the checksum, because LogQL cannot
        # compute a CRC32. This is deliberately not `|= "sfk_"`: log
        # lines legitimately mention the prefix -- key creation refuses
        # an operator-supplied secret carrying it, and says so in the
        # error -- and an alert which fires on its own documentation is
        # an alert somebody switches off.
        expr: |
          count_over_time({job="shakenfist"} |~ "sfk_[A-Za-z0-9]{38}" [5m]) > 0
        # No `for:`. A credential in the log store is not a condition
        # which might resolve itself if you wait, and the exposure grows
        # with every second the log store retains it.
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: >-
            A Shaken Fist key secret has been written to the log stream
            by {{ $labels.daemon }} on {{ $labels.host }}
          description: >-
            A string matching the cluster-minted key secret format
            (sfk_ + 32 random characters + a 6 character checksum) is
            present in the Shaken Fist log stream. Treat the credential
            as disclosed to everyone with read access to your log
            store, which is a wider audience than it looks if logs are
            forwarded or backed up.

            Do not paste the matched line into a ticket, a chat channel
            or an incident document -- that copies the credential into
            another system with its own retention.

            Rotate the affected key, then work out which code path
            logged it. The rotation procedures and their blast radius
            are in the operator guide under Credential rotation.
          runbook_url: https://shakenfist.com/operator_guide/credential_rotation/
