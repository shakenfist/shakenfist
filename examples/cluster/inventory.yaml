---
# Example multi-node Shaken Fist cluster:
#   * sf-1 -- the network node AND the database tier (etcd_master)
#   * sf-2 -- a hypervisor
#   * sf-3 -- a hypervisor
#
# The legacy etcd_master group name is the database tier (renamed to
# database_node in phase 7). A host may belong to several capability groups;
# here sf-1 is both the network node and the database tier. To scale the
# database tier, add more hosts to etcd_master -- the playbook computes
# mariadb_gateway_hosts from every member.
#
# Per-host identity (node_name / node_egress_* / node_mesh_*) lives in
# host_vars. ansible_host is the address ansible connects to (here the mesh IP).
all:
  children:
    allsf:
      hosts:
        sf-1:
          ansible_host: 10.0.0.1
          node_name: sf-1
          node_egress_ip: 192.168.1.1
          node_egress_nic: eth0
          node_mesh_ip: 10.0.0.1
          node_mesh_nic: eth1
        sf-2:
          ansible_host: 10.0.0.2
          node_name: sf-2
          node_egress_ip: 192.168.1.2
          node_egress_nic: eth0
          node_mesh_ip: 10.0.0.2
          node_mesh_nic: eth1
        sf-3:
          ansible_host: 10.0.0.3
          node_name: sf-3
          node_egress_ip: 192.168.1.3
          node_egress_nic: eth0
          node_mesh_ip: 10.0.0.3
          node_mesh_nic: eth1

    # sf-1 is the single network node.
    network_node:
      hosts:
        sf-1:

    # sf-1 is the (single) database tier. Add hosts here to scale it.
    etcd_master:
      hosts:
        sf-1:

    # sf-2 and sf-3 run instances.
    hypervisors:
      hosts:
        sf-2:
        sf-3:
