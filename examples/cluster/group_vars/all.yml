---
# Cluster-wide variables for the multi-node example. Replace the secrets with
# real values before deploying.

deploy_name: sf

# The cluster API URL, as clients should reach it: your own load balancer in
# front of the API nodes, ending in the "/api" prefix the proxy strips before
# forwarding to an sf-api worker on port 13000. CHANGE THIS -- sf.example.com
# is only the name the shipped examples/apache-loadbalancer.conf and
# examples/nginx-loadbalancer.conf serve. See
# docs/operator_guide/load_balancing.md: a prefix-less ":13000" URL is the
# single-node escape hatch for a deploy with no proxy at all, and names one
# node's sf-api rather than a cluster endpoint.
#
# The deploy puts no TLS in front of sf-api -- that is the load balancer's
# job -- so that escape hatch is cleartext. If you add a kerbside inventory
# group, the deploy refuses a cleartext api_url which does not point at the
# Kerbside host itself, because Kerbside posts kerbside_system_key to it on
# every scrape: keep an https:// endpoint, or set
# kerbside_allow_insecure_api_url: true to accept the risk on a trusted
# private network. A Kerbside host which is also a Shaken Fist node and names
# its own address (its node_mesh_ip, node_egress_ip, node_name or
# ansible_host) is unaffected, since the request never leaves the host.
api_url: "https://sf.example.com/api"

# Secrets. CHANGE THESE.
auth_secret: "change-me-auth-secret-change-me-auth-secret-change"
system_key: "change-me-system-key"

# Cluster config seeds.
dns_server: "8.8.8.8"
http_proxy: ""
extra_config: "[]"
floating_network_ipblock: "10.10.0.0/24"

# Direct MariaDB access for the database tier (sf-1). These must match the
# MariaDB server you provisioned (see PLAN-byo-mariadb / tools/
# bootstrap-mariadb.sql). Only database-tier nodes render these into
# /etc/sf/config.
mariadb_host: "10.0.0.1"
mariadb_port: 3306
mariadb_user: "shakenfist"
mariadb_password: "change-me-mariadb-password"
mariadb_database: "sf"

# Install released packages from PyPI by default. Set sf_build_local_wheels:
# true with repo_path / client_repo_path to deploy a local git checkout.
sf_build_local_wheels: false
server_package: "shakenfist"
client_package: "shakenfist-client"
pip_extra: ""
