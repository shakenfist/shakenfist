// Node Attributes Operations (MariaDB)
// These store mutable node attributes, separate from NodeStaticData.

message NodeAttributesProto {
  string uuid = 1;

  // Observation data
  double last_seen = 2;
  string installed_version = 3;
  bool has_installed_version = 4;

  // Roles
  bool is_etcd_master = 5;
  bool is_hypervisor = 6;
  bool is_network_node = 7;
  bool is_eventlog_node = 8;

  // Which instances are placed on this node is queried live from the
  // instance_location rows in object_references; the legacy
  // node_attributes.instances JSON column, its dual-write and the union
  // in Node.instances were removed in scheduler-reservations phase 3.
  // Tag reserved to prevent accidental reuse.
  reserved 9;
  reserved "instances_json";

  // Daemon tracking (JSON-encoded lists)
  string daemons_json = 10;
  string daemon_states_json = 11;

  // Software versions (JSON-encoded lists)
  string qemu_version_json = 12;
  bool has_qemu_version = 13;
  string libvirt_version_json = 14;
  bool has_libvirt_version = 15;
  string python_version_json = 16;
  bool has_python_version = 17;
  string python_implementation = 18;
  bool has_python_implementation = 19;

  // Complex dicts (JSON-encoded)
  string dependency_versions_json = 20;
  string process_metrics_json = 21;

  // The live database-tier role flag. is_etcd_master (5) and
  // is_eventlog_node (8) above are vestigial and scheduled for removal.
  bool is_database_node = 22;

  // The node's SPICE server certificate subject, as a SPICE
  // host-subject string. Optional: absent on nodes with no such cert.
  string spice_server_cert_subject = 23;
  bool has_spice_server_cert_subject = 24;
}

message CreateNodeAttributesRequest {
  NodeAttributesProto data = 1;
}

message GetNodeAttributesRequest {
  string uuid = 1;
}

message GetNodeAttributesReply {
  bool found = 1;
  NodeAttributesProto data = 2;
}

message UpdateNodeAttributesRequest {
  NodeAttributesProto data = 1;

  // Field mask: the NodeAttributesData field names to write. An empty
  // list means write every column. See the equivalent comment on
  // UpdateInstanceAttributesRequest for the cross-attribute lost
  // update this prevents (here: the sentinels' 15-second
  // observe_this_node full-row write reverting a concurrent
  // add_instance, observed as scheduler affinity scoring a node zero
  // because its instances list lost an entry).
  repeated string fields = 2;
}

