}

message UpdateBlobTransferRequest {
  string source_node = 1;
  string transfer_name = 2;
  optional string server_state = 3;
  optional int32 port = 4;
  optional double percentage = 5;
}

message DeleteBlobTransferRequest {
  string source_node = 1;
  string transfer_name = 2;
}

message DeleteBlobTransfersForBlobRequest {
  string blob_uuid = 1;
}

message DeleteStaleTransfersRequest {
  double older_than = 1;  // Unix timestamp - delete transfers with updated_at < this
}

