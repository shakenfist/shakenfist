syntax = "proto3";

package shakenfist.protos;

import "shakenfist_enums.proto";

service DatabaseService {
  // Queue Operations
  rpc Enqueue (EnqueueRequest) returns (StatusReply) {}
  rpc Dequeue (DequeueRequest) returns (DequeueReply) {}
  rpc Resolve (ResolveRequest) returns (StatusReply) {}
  rpc GetQueueLength (QueueLengthRequest) returns (QueueLengthReply) {}
  rpc RestartQueue (RestartQueueRequest) returns (StatusReply) {}
  rpc ListStuckWorkQueueRows (ListStuckWorkQueueRowsRequest) returns (ListStuckWorkQueueRowsReply) {}
  rpc ClearWorkQueueClaim (ClearWorkQueueClaimRequest) returns (StatusReply) {}
  rpc DeleteWorkQueueRow (DeleteWorkQueueRowRequest) returns (StatusReply) {}
  rpc ClaimCoalescibleSiblings (ClaimCoalescibleSiblingsRequest) returns (ClaimCoalescibleSiblingsReply) {}
  rpc FindExistingCoalescibleOp (FindExistingCoalescibleOpRequest) returns (FindExistingCoalescibleOpReply) {}
  // V2 of the two coalescing RPCs, taking a multi-column key. The V1
  // pair above is retained unmodified for one release so a rolling
  // upgrade can still serve old clients. A new client never falls back
  // to V1: an old server would ignore the extra key columns and fold on
  // the first column alone, which is exactly the cross-node corruption
  // the new names exist to prevent. See
  // docs/plans/PLAN-queue-performance-phase-11-multi-column-key.md
  // decision 1.
  rpc ClaimCoalescibleSiblingsV2 (ClaimCoalescibleSiblingsV2Request) returns (ClaimCoalescibleSiblingsReply) {}
  rpc FindExistingCoalescibleOpV2 (FindExistingCoalescibleOpV2Request) returns (FindExistingCoalescibleOpReply) {}

  // Lock Operations
  rpc AcquireLock (ClusterLockRequest) returns (ClusterLockReply) {}
  rpc ReleaseLock (ClusterReleaseLockRequest) returns (StatusReply) {}
  rpc RefreshLock (ClusterRefreshLockRequest) returns (StatusReply) {}
  rpc GetLockHolder (ClusterGetLockHolderRequest) returns (ClusterLockHolderReply) {}
  rpc ClearStaleLocks (ClusterClearStaleLocksRequest) returns (StatusReply) {}
  rpc GetExistingLocks (ClusterGetExistingLocksRequest) returns (ClusterGetExistingLocksReply) {}

  // Cluster Config
  rpc GetClusterConfig (ClusterConfigRequest) returns (ClusterConfigReply) {}
  rpc SetClusterConfig (SetClusterConfigRequest) returns (StatusReply) {}
  rpc DeleteClusterConfig (DeleteClusterConfigRequest) returns (StatusReply) {}

  // Event Storage (MariaDB)
  // Direct write path for batches of events; replaces the sf-eventlog
  // gRPC target in phase 2.
  rpc RecordEventBatch (RecordEventBatchRequest) returns (StatusReply) {}
  rpc PruneEvents (PruneEventsRequest) returns (PruneEventsReply) {}
  // Per-object read and delete paths replacing the legacy sqlite
  // EventLog backend in phase 4.
  rpc GetObjectEvents (GetObjectEventsRequest) returns (GetObjectEventsReply) {}
  rpc DeleteObjectEvents (DeleteObjectEventsRequest) returns (StatusReply) {}

  // Object State Operations (MariaDB)
  rpc GetObjectState (GetObjectStateRequest) returns (GetObjectStateReply) {}
  rpc SetObjectState (SetObjectStateRequest) returns (StatusReply) {}
  rpc DeleteObjectState (DeleteObjectStateRequest) returns (StatusReply) {}
  rpc GetObjectsByState (GetObjectsByStateRequest) returns (GetObjectsByStateReply) {}
  rpc DeleteOrphanedObjectStates (DeleteOrphanedObjectStatesRequest) returns (DeleteOrphanedObjectStatesReply) {}
  rpc GetStatelessObjectUuids (GetStatelessObjectUuidsRequest) returns (GetStatelessObjectUuidsReply) {}
  rpc DeleteOrphanedArtifactAttributes (DeleteOrphanedArtifactAttributesRequest) returns (DeleteOrphanedArtifactAttributesReply) {}

  // IPAM Reservation Operations (MariaDB)
  rpc ReserveAddress (ReserveAddressRequest) returns (StatusReply) {}
  rpc ReleaseAddress (ReleaseAddressRequest) returns (StatusReply) {}
  rpc GetReservation (GetReservationRequest) returns (GetReservationReply) {}
  rpc GetReservationsForIPAM (GetReservationsForIPAMRequest) returns (GetReservationsForIPAMReply) {}
  rpc DeleteReservation (DeleteReservationRequest) returns (StatusReply) {}
  rpc DeleteReservationsForIPAM (DeleteReservationsForIPAMRequest) returns (DeleteCountReply) {}
  rpc ReleaseHaloedAddresses (ReleaseHaloedAddressesRequest) returns (DeleteCountReply) {}
  rpc GetAddressesInUse (GetAddressesInUseRequest) returns (GetAddressesInUseReply) {}

  // Upload Operations (MariaDB)
  rpc CreateUpload (CreateUploadRequest) returns (StatusReply) {}
  rpc GetUpload (GetUploadRequest) returns (GetUploadReply) {}
  rpc GetUploads (GetUploadsRequest) returns (GetUploadsReply) {}
  rpc DeleteUpload (DeleteUploadRequest) returns (StatusReply) {}
  rpc UpdateUpload (UpdateUploadRequest) returns (StatusReply) {}

  // Blob Operations (MariaDB)
  rpc CreateBlob (CreateBlobRequest) returns (StatusReply) {}
  rpc GetBlob (GetBlobRequest) returns (GetBlobReply) {}
  rpc GetAllBlobUuids (GetAllBlobUuidsRequest) returns (GetAllBlobUuidsReply) {}
  rpc DeleteBlob (DeleteBlobRequest) returns (StatusReply) {}
  rpc UpdateBlob (UpdateBlobRequest) returns (StatusReply) {}

  // DnsMasq Operations (MariaDB)
  rpc CreateDnsMasq (CreateDnsMasqRequest) returns (StatusReply) {}
  rpc GetDnsMasq (GetDnsMasqRequest) returns (GetDnsMasqReply) {}
  rpc GetDnsMasqs (GetDnsMasqsRequest) returns (GetDnsMasqsReply) {}
  rpc DeleteDnsMasq (DeleteDnsMasqRequest) returns (StatusReply) {}
  rpc UpdateDnsMasq (UpdateDnsMasqRequest) returns (StatusReply) {}

  // Object Reference Operations (MariaDB)
  rpc RecordRelationship (RecordRelationshipRequest) returns (StatusReply) {}
  rpc RemoveRelationship (RemoveRelationshipRequest) returns (StatusReply) {}
  rpc GetReferencesTo (GetReferencesToRequest) returns (GetReferencesReply) {}
  rpc GetReferencesFrom (GetReferencesFromRequest) returns (GetReferencesReply) {}
  rpc CountReferencesTo (CountReferencesToRequest) returns (CountReply) {}
  rpc RemoveAllReferencesFrom (RemoveAllReferencesFromRequest) returns (CountReply) {}
  rpc UpdateLastActive (UpdateLastActiveRequest) returns (StatusReply) {}
  rpc GetStaleReferences (GetStaleReferencesRequest) returns (GetReferencesReply) {}

  // Blob Hash Operations (MariaDB)
  rpc UpsertBlobHash (UpsertBlobHashRequest) returns (StatusReply) {}
  rpc GetBlobHashes (GetBlobHashesRequest) returns (GetBlobHashesReply) {}
  rpc FindBlobByHash (FindBlobByHashRequest) returns (FindBlobByHashReply) {}
  rpc GetStaleBlobHashes (GetStaleBlobHashesRequest) returns (GetBlobHashesReply) {}
  rpc DeleteBlobHashes (DeleteBlobHashesRequest) returns (StatusReply) {}

  // Blob Transfer Operations (MariaDB)
  rpc CreateBlobTransfer (CreateBlobTransferRequest) returns (StatusReply) {}
  rpc GetBlobTransfer (GetBlobTransferRequest) returns (GetBlobTransferReply) {}
  rpc GetBlobTransfersForNode (GetBlobTransfersForNodeRequest) returns (GetBlobTransfersReply) {}
  rpc GetBlobTransfersForBlob (GetBlobTransfersForBlobRequest) returns (GetBlobTransfersReply) {}
  rpc UpdateBlobTransfer (UpdateBlobTransferRequest) returns (StatusReply) {}
  rpc DeleteBlobTransfer (DeleteBlobTransferRequest) returns (StatusReply) {}
  rpc DeleteBlobTransfersForBlob (DeleteBlobTransfersForBlobRequest) returns (DeleteCountReply) {}
  rpc DeleteStaleTransfers (DeleteStaleTransfersRequest) returns (DeleteCountReply) {}

  // Blob Attributes Operations (MariaDB)
  // These store mutable blob attributes, separate from BlobData (static values).
  rpc CreateBlobAttributes (CreateBlobAttributesRequest) returns (StatusReply) {}
  rpc GetBlobAttributes (GetBlobAttributesRequest) returns (GetBlobAttributesReply) {}
  rpc UpdateBlobAttributes (UpdateBlobAttributesRequest) returns (StatusReply) {}
  rpc UpdateBlobLastUsed (UpdateBlobLastUsedRequest) returns (StatusReply) {}
  rpc DeleteBlobAttributes (DeleteBlobAttributesRequest) returns (StatusReply) {}
  rpc GetExpiredBlobUuids (GetExpiredBlobUuidsRequest) returns (GetExpiredBlobUuidsReply) {}
  rpc GetStaleTranscodedBlobUuids (GetStaleTranscodedBlobUuidsRequest) returns (GetStaleTranscodedBlobUuidsReply) {}

  // Node Operations (MariaDB)
  // These manage node static values (uuid, fqdn, ip) in MariaDB.
  // Nodes now use real UUID4 identifiers; FQDN is a separate indexed column.
  rpc CreateNode (CreateNodeRequest) returns (StatusReply) {}
  rpc GetNode (GetNodeRequest) returns (GetNodeReply) {}
  rpc GetNodeByFqdn (GetNodeByFqdnRequest) returns (GetNodeReply) {}
  rpc GetAllNodeUuids (GetAllNodeUuidsRequest) returns (GetAllNodeUuidsReply) {}
  rpc DeleteNode (DeleteNodeRequest) returns (StatusReply) {}
  rpc UpdateNode (UpdateNodeRequest) returns (StatusReply) {}

  // Node Attributes Operations (MariaDB)
  // These store mutable node attributes, separate from NodeData (static values).
  rpc CreateNodeAttributes (CreateNodeAttributesRequest) returns (StatusReply) {}
  rpc GetNodeAttributes (GetNodeAttributesRequest) returns (GetNodeAttributesReply) {}
  rpc UpdateNodeAttributes (UpdateNodeAttributesRequest) returns (StatusReply) {}
  rpc DeleteNodeAttributes (DeleteNodeAttributesRequest) returns (StatusReply) {}

  // Node Daemon State Operations (MariaDB)
  // Per-(node, daemon) state rows. Replaces the daemon_states JSON dict
  // that previously lived inside node_attributes; that dict required a
  // coarse per-node lock for every transition and serialised every
  // daemon's startup/shutdown through a single 10s lock.
  rpc SetNodeDaemonState (SetNodeDaemonStateRequest) returns (StatusReply) {}
  rpc GetNodeDaemonState (GetNodeDaemonStateRequest) returns (GetNodeDaemonStateReply) {}
  rpc GetAllNodeDaemonStates (GetAllNodeDaemonStatesRequest) returns (GetAllNodeDaemonStatesReply) {}
  rpc DeleteNodeDaemonState (DeleteNodeDaemonStateRequest) returns (StatusReply) {}

  // Namespace Operations (MariaDB)
  // These manage namespace static values (name, version) in MariaDB.
  // Namespaces use their name as primary key (not a UUID).
  rpc CreateNamespace (CreateNamespaceRequest) returns (StatusReply) {}
  rpc GetNamespace (GetNamespaceRequest) returns (GetNamespaceReply) {}
  rpc GetAllNamespaceNames (GetAllNamespaceNamesRequest) returns (GetAllNamespaceNamesReply) {}
  rpc DeleteNamespace (DeleteNamespaceRequest) returns (StatusReply) {}

  // Namespace Attributes Operations (MariaDB)
  // These store mutable namespace attributes (keys, trust).
  rpc CreateNamespaceAttributes (CreateNamespaceAttributesRequest) returns (StatusReply) {}
  rpc GetNamespaceAttributes (GetNamespaceAttributesRequest) returns (GetNamespaceAttributesReply) {}
  rpc UpdateNamespaceAttributes (UpdateNamespaceAttributesRequest) returns (StatusReply) {}
  rpc DeleteNamespaceAttributes (DeleteNamespaceAttributesRequest) returns (StatusReply) {}

  // Artifact Operations (MariaDB)
  // These manage artifact static values (uuid, type, source_url, name, namespace)
  // in MariaDB. Artifacts represent versioned disk images.
  rpc CreateArtifact (CreateArtifactRequest) returns (StatusReply) {}
  rpc GetArtifact (GetArtifactRequest) returns (GetArtifactReply) {}
  rpc GetAllArtifacts (GetAllArtifactsRequest) returns (GetAllArtifactsReply) {}
  rpc FindArtifacts (FindArtifactsRequest) returns (FindArtifactsReply) {}
  rpc UpdateArtifact (UpdateArtifactRequest) returns (StatusReply) {}
  rpc DeleteArtifact (DeleteArtifactRequest) returns (StatusReply) {}

  // Artifact Attributes Operations (MariaDB)
  // These store mutable artifact attributes (max_versions, shared, highest_index).
  rpc CreateArtifactAttributes (CreateArtifactAttributesRequest) returns (StatusReply) {}
  rpc GetArtifactAttributes (GetArtifactAttributesRequest) returns (GetArtifactAttributesReply) {}
  rpc UpdateArtifactAttributes (UpdateArtifactAttributesRequest) returns (StatusReply) {}
  rpc DeleteArtifactAttributes (DeleteArtifactAttributesRequest) returns (StatusReply) {}

  // Artifact Index Operations (MariaDB)
  // These manage artifact version indexes, mapping index numbers to blob UUIDs.
  rpc CreateArtifactIndex (CreateArtifactIndexRequest) returns (StatusReply) {}
  rpc GetArtifactIndex (GetArtifactIndexRequest) returns (GetArtifactIndexReply) {}
  rpc GetAllArtifactIndexes (GetAllArtifactIndexesRequest) returns (GetAllArtifactIndexesReply) {}
  rpc DeleteArtifactIndex (DeleteArtifactIndexRequest) returns (StatusReply) {}
  rpc DeleteAllArtifactIndexes (DeleteAllArtifactIndexesRequest) returns (DeleteCountReply) {}

  // NetworkInterface Operations (MariaDB)
  // These manage NetworkInterface static values in MariaDB.
  rpc CreateNetworkInterface (CreateNetworkInterfaceRequest) returns (StatusReply) {}
  rpc GetNetworkInterface (GetNetworkInterfaceRequest) returns (GetNetworkInterfaceReply) {}
  rpc GetNetworkInterfacesByInstance (GetNetworkInterfacesByInstanceRequest) returns (GetNetworkInterfacesReply) {}
  rpc GetNetworkInterfacesByNetwork (GetNetworkInterfacesByNetworkRequest) returns (GetNetworkInterfacesReply) {}
  rpc GetAllNetworkInterfaces (GetAllNetworkInterfacesRequest) returns (GetNetworkInterfacesReply) {}
  rpc FindNetworkInterfaces (FindNetworkInterfacesRequest) returns (FindNetworkInterfacesReply) {}
  rpc DeleteNetworkInterface (DeleteNetworkInterfaceRequest) returns (StatusReply) {}
  rpc UpdateNetworkInterface (UpdateNetworkInterfaceRequest) returns (StatusReply) {}

  // NetworkInterface Attributes Operations (MariaDB)
  // These store mutable NetworkInterface attributes (floating address).
  rpc CreateNetworkInterfaceAttributes (CreateNetworkInterfaceAttributesRequest) returns (StatusReply) {}
  rpc GetNetworkInterfaceAttributes (GetNetworkInterfaceAttributesRequest) returns (GetNetworkInterfaceAttributesReply) {}
  rpc UpdateNetworkInterfaceAttributes (UpdateNetworkInterfaceAttributesRequest) returns (StatusReply) {}
  rpc DeleteNetworkInterfaceAttributes (DeleteNetworkInterfaceAttributesRequest) returns (StatusReply) {}

  // IPAM Operations (MariaDB)
  // These manage IPAM static values (uuid, namespace, network_uuid, ipblock)
  // in MariaDB. IPAMs track IP address allocation within a network.
  rpc CreateIPAM (CreateIPAMRequest) returns (StatusReply) {}
  rpc GetIPAM (GetIPAMRequest) returns (GetIPAMReply) {}
  rpc DeleteIPAM (DeleteIPAMRequest) returns (StatusReply) {}
  rpc UpdateIPAM (UpdateIPAMRequest) returns (StatusReply) {}

  // Network Operations (MariaDB)
  // These manage Network static values in MariaDB. Networks are virtual L2
  // networks with optional DHCP, NAT, and DNS services connected via VXLAN.
  rpc CreateNetwork (CreateNetworkRequest) returns (StatusReply) {}
  rpc GetNetwork (GetNetworkRequest) returns (GetNetworkReply) {}
  rpc GetAllNetworks (GetAllNetworksRequest) returns (GetAllNetworksReply) {}
  rpc FindNetworks (FindNetworksRequest) returns (FindNetworksReply) {}
  rpc FindNetworkVxids (FindNetworkVxidsRequest) returns (FindNetworkVxidsReply) {}
  rpc GetNodeInstanceVxids (GetNodeInstanceVxidsRequest) returns (GetNodeInstanceVxidsReply) {}
  rpc DeleteNetwork (DeleteNetworkRequest) returns (StatusReply) {}

  // Network Attributes Operations (MariaDB)
  // These store mutable Network attributes (floating gateway, NI list, DNS).
  rpc CreateNetworkAttributes (CreateNetworkAttributesRequest) returns (StatusReply) {}
  rpc GetNetworkAttributes (GetNetworkAttributesRequest) returns (GetNetworkAttributesReply) {}
  rpc GetNetworkFloatingGateways (GetNetworkFloatingGatewaysRequest) returns (GetNetworkFloatingGatewaysReply) {}
  rpc UpdateNetworkAttributes (UpdateNetworkAttributesRequest) returns (StatusReply) {}
  rpc DeleteNetworkAttributes (DeleteNetworkAttributesRequest) returns (StatusReply) {}

  // NamespaceKey Operations (MariaDB)
  // These manage NamespaceKey static values in MariaDB. A NamespaceKey is an
  // authentication key owned by a namespace; JWT identity strings of the form
  // "<namespace>:<keyname>" name one.
  rpc CreateNamespaceKey (CreateNamespaceKeyRequest) returns (StatusReply) {}
  rpc GetNamespaceKey (GetNamespaceKeyRequest) returns (GetNamespaceKeyReply) {}
  rpc GetNamespaceKeyByName (GetNamespaceKeyByNameRequest) returns (GetNamespaceKeyByNameReply) {}
  rpc FindNamespaceKeys (FindNamespaceKeysRequest) returns (FindNamespaceKeysReply) {}
  rpc DeleteNamespaceKey (DeleteNamespaceKeyRequest) returns (StatusReply) {}
  rpc DeleteExpiredNamespaceKeys (DeleteExpiredNamespaceKeysRequest) returns (DeleteCountReply) {}

  // NamespaceKey Attributes Operations (MariaDB)
  // These store mutable NamespaceKey attributes (hash, nonce, expiry, scopes,
  // provenance). Rotation mutates the hash and nonce.
  rpc CreateNamespaceKeyAttributes (CreateNamespaceKeyAttributesRequest) returns (StatusReply) {}
  rpc GetNamespaceKeyAttributes (GetNamespaceKeyAttributesRequest) returns (GetNamespaceKeyAttributesReply) {}
  rpc UpdateNamespaceKeyAttributes (UpdateNamespaceKeyAttributesRequest) returns (StatusReply) {}
  rpc DeleteNamespaceKeyAttributes (DeleteNamespaceKeyAttributesRequest) returns (StatusReply) {}

  // TrustedIssuer Operations (MariaDB)
  // A TrustedIssuer is an external identity provider this cluster will
  // believe. Cluster level and system owned: who may vouch for
  // identities here is an administrative decision.
  rpc CreateTrustedIssuer (CreateTrustedIssuerRequest) returns (StatusReply) {}
  rpc GetTrustedIssuer (GetTrustedIssuerRequest) returns (GetTrustedIssuerReply) {}
  rpc GetTrustedIssuerByName (GetTrustedIssuerByNameRequest) returns (GetTrustedIssuerReply) {}
  rpc GetAllTrustedIssuers (GetAllTrustedIssuersRequest) returns (GetAllTrustedIssuersReply) {}
  rpc DeleteTrustedIssuer (DeleteTrustedIssuerRequest) returns (StatusReply) {}

  // TrustedIssuer Attributes Operations (MariaDB)
  rpc CreateTrustedIssuerAttributes (CreateTrustedIssuerAttributesRequest) returns (StatusReply) {}
  rpc GetTrustedIssuerAttributes (GetTrustedIssuerAttributesRequest) returns (GetTrustedIssuerAttributesReply) {}
  rpc UpdateTrustedIssuerAttributes (UpdateTrustedIssuerAttributesRequest) returns (StatusReply) {}
  rpc DeleteTrustedIssuerAttributes (DeleteTrustedIssuerAttributesRequest) returns (StatusReply) {}

  // MappingRule Operations (MariaDB)
  // A MappingRule says which external identities a namespace will mint
  // keys for. Owned by that namespace; unique on (namespace, name).
  rpc CreateMappingRule (CreateMappingRuleRequest) returns (StatusReply) {}
  rpc GetMappingRule (GetMappingRuleRequest) returns (GetMappingRuleReply) {}
  rpc GetMappingRuleByName (GetMappingRuleByNameRequest) returns (GetMappingRuleReply) {}
  rpc GetMappingRulesInNamespace (GetMappingRulesInNamespaceRequest) returns (GetMappingRulesReply) {}
  rpc GetAllMappingRules (GetAllMappingRulesRequest) returns (GetMappingRulesReply) {}
  rpc DeleteMappingRule (DeleteMappingRuleRequest) returns (StatusReply) {}

  // MappingRule Attributes Operations (MariaDB)
  rpc CreateMappingRuleAttributes (CreateMappingRuleAttributesRequest) returns (StatusReply) {}
  rpc GetMappingRuleAttributes (GetMappingRuleAttributesRequest) returns (GetMappingRuleAttributesReply) {}
  rpc UpdateMappingRuleAttributes (UpdateMappingRuleAttributesRequest) returns (StatusReply) {}
  rpc DeleteMappingRuleAttributes (DeleteMappingRuleAttributesRequest) returns (StatusReply) {}

  // AgentOperation Operations (MariaDB)
  // These manage AgentOperation static values in MariaDB. AgentOperations
  // represent in-guest agent tasks (execute, get-file, put-blob, chmod).
  rpc CreateAgentOperation (CreateAgentOperationRequest) returns (StatusReply) {}
  rpc GetAgentOperation (GetAgentOperationRequest) returns (GetAgentOperationReply) {}
  rpc DeleteAgentOperation (DeleteAgentOperationRequest) returns (StatusReply) {}

  // AgentOperation Attributes Operations (MariaDB)
  // These store mutable AgentOperation attributes (results).
  rpc CreateAgentOperationAttributes (CreateAgentOperationAttributesRequest) returns (StatusReply) {}
  rpc GetAgentOperationAttributes (GetAgentOperationAttributesRequest) returns (GetAgentOperationAttributesReply) {}
  rpc UpdateAgentOperationAttributes (UpdateAgentOperationAttributesRequest) returns (StatusReply) {}
  rpc DeleteAgentOperationAttributes (DeleteAgentOperationAttributesRequest) returns (StatusReply) {}

  // Instance Operations (MariaDB)
  // These manage Instance static values in MariaDB. Instances represent
  // virtual machines with CPU, memory, disk, and network configuration.
  rpc CreateInstance (CreateInstanceRequest) returns (StatusReply) {}
  rpc GetInstance (GetInstanceRequest) returns (GetInstanceReply) {}
  rpc GetAllInstances (GetAllInstancesRequest) returns (GetAllInstancesReply) {}
  rpc FindInstances (FindInstancesRequest) returns (FindInstancesReply) {}
  rpc GetAllInstanceUuids (GetAllInstanceUuidsRequest) returns (GetAllInstanceUuidsReply) {}
  rpc DeleteInstance (DeleteInstanceRequest) returns (StatusReply) {}

  // Instance Attributes Operations (MariaDB)
  // These store mutable Instance attributes (placement, power state, ports,
  // block devices, interfaces, agent state, etc.).
  rpc CreateInstanceAttributes (CreateInstanceAttributesRequest) returns (StatusReply) {}
  rpc GetInstanceAttributes (GetInstanceAttributesRequest) returns (GetInstanceAttributesReply) {}
  rpc UpdateInstanceAttributes (UpdateInstanceAttributesRequest) returns (StatusReply) {}
  rpc DeleteInstanceAttributes (DeleteInstanceAttributesRequest) returns (StatusReply) {}
  rpc GetConsumedPortsForNode (GetConsumedPortsForNodeRequest) returns (GetConsumedPortsForNodeReply) {}
  rpc IsVsockCidInUse (IsVsockCidInUseRequest) returns (IsVsockCidInUseReply) {}

  // Object Metadata Operations (MariaDB)
  // These store user-defined metadata for all object types in a single shared
  // table (like object_states).
  rpc GetObjectMetadata (GetObjectMetadataRequest) returns (GetObjectMetadataReply) {}
  rpc SetMetadata (SetMetadataRequest) returns (StatusReply) {}
  rpc DeleteObjectMetadata (DeleteObjectMetadataRequest) returns (StatusReply) {}

  // Cluster Operation Target Operations (MariaDB)
  // Track which operations target which objects, with sequence ordering.
  rpc CreateClusterOperationTarget (CreateClusterOperationTargetRequest) returns (StatusReply) {}
  rpc GetClusterOperationTarget (GetClusterOperationTargetRequest) returns (GetClusterOperationTargetReply) {}
  rpc GetClusterOperationTargetsForObject (GetClusterOperationTargetsForObjectRequest) returns (GetClusterOperationTargetsForObjectReply) {}
  rpc GetLatestClusterOperationTarget (GetLatestClusterOperationTargetRequest) returns (GetClusterOperationTargetReply) {}
  rpc HasPendingClusterOperationTarget (HasPendingClusterOperationTargetRequest) returns (HasPendingClusterOperationTargetReply) {}
  rpc GetRecentTerminalOpStatesForTarget (GetRecentTerminalOpStatesForTargetRequest) returns (GetRecentTerminalOpStatesForTargetReply) {}
  rpc DeleteClusterOperationTarget (DeleteClusterOperationTargetRequest) returns (StatusReply) {}
  rpc DeleteClusterOperationTargetsForObject (DeleteClusterOperationTargetsForObjectRequest) returns (StatusReply) {}
  rpc DeleteStaleClusterOperationTargets (DeleteStaleClusterOperationTargetsRequest) returns (DeleteCountReply) {}

  // Node Metrics Operations (MariaDB)
  // Ephemeral per-node resource metrics, upserted every 60s by the resources
  // daemon. The metrics payload is a JSON string (~50+ fields, schemaless).
  rpc UpsertNodeMetrics (UpsertNodeMetricsRequest) returns (StatusReply) {}
  rpc GetNodeMetrics (GetNodeMetricsRequest) returns (GetNodeMetricsReply) {}
  rpc GetAllNodeMetrics (GetAllNodeMetricsRequest) returns (GetAllNodeMetricsReply) {}
  rpc DeleteNodeMetrics (DeleteNodeMetricsRequest) returns (StatusReply) {}

  // Cluster Operations (MariaDB)
  // Operation headers, keyed by operation uuid. State lives separately in
  // object_states; per-target tracking lives in cluster_operation_targets.
  // Insert-only: rows are never mutated after creation.
  rpc CreateClusterOperation (CreateClusterOperationRequest) returns (StatusReply) {}
  rpc GetClusterOperation (GetClusterOperationRequest) returns (GetClusterOperationReply) {}
  rpc GetClusterOperationsByNode (GetClusterOperationsByNodeRequest) returns (GetClusterOperationsByNodeReply) {}
  rpc ListClusterOperationsForTarget (ListClusterOperationsForTargetRequest) returns (ListClusterOperationsForTargetReply) {}
  rpc DeleteClusterOperation (DeleteClusterOperationRequest) returns (StatusReply) {}

  // Atomic create + enqueue for cluster operations (MariaDB).
  // Writes cluster_operations, object_states and work_queue in a single
  // transaction. Audit events are emitted separately by the caller via
  // the eventlog service after this RPC succeeds.
  rpc CreateAndEnqueueClusterOperation (CreateAndEnqueueClusterOperationRequest) returns (StatusReply) {}

  // Cluster Operation Errors (MariaDB)
  // Persists the structured ErrorReport when an _apply_* method raises
  // inside the dispatcher. Upsert semantics: a retry that fails again
  // overwrites the prior report.
  rpc SetClusterOperationError (SetClusterOperationErrorRequest) returns (StatusReply) {}
  rpc GetClusterOperationError (GetClusterOperationErrorRequest) returns (GetClusterOperationErrorReply) {}
  rpc DeleteClusterOperationError (DeleteClusterOperationErrorRequest) returns (StatusReply) {}

  // Federation Abuse Resistance (MariaDB)
  // Replay refusal and rate limiting for /auth/federated. Both counters
  // live in the database rather than in the API worker so the
  // protection is cluster wide -- a per process counter would let a
  // caller multiply their allowance by the number of workers.
  rpc RecordFederatedExchange (RecordFederatedExchangeRequest) returns (RecordFederatedExchangeReply) {}
  rpc CountFederatedAttempt (CountFederatedAttemptRequest) returns (CountFederatedAttemptReply) {}
  rpc ReapFederationReplay (ReapFederationReplayRequest) returns (ReapFederationReply) {}
  rpc ReapFederationRateLimits (ReapFederationRateLimitsRequest) returns (ReapFederationReply) {}

  // Scheduler Capacity Operations (MariaDB)
  // Scheduler-reservations phase 2: the reconciler's single RPC. One
  // call expires stale namespace claims, refreshes per-node limits from
  // node_metrics, recomputes usage and expected demand from placement
  // ground truth, and rebuilds the cluster_capacity singleton. The
  // demand parameters ride in the request so the database daemon needs
  // no copy of the caller's scheduler configuration. See
  // docs/plans/PLAN-scheduler-reservations-phase-02-capacity-tables.md.
  rpc ReconcileSchedulerCapacity (ReconcileSchedulerCapacityRequest) returns (ReconcileSchedulerCapacityReply) {}

  // Scheduler-reservations phase 3: the atomicity primitive the plan
  // exists for (D1, D3). One transaction performs the guarded capacity
  // drawdown, the placement attribute write and the placement reference
  // rewrite, so two concurrent creates racing one remaining slot admit
  // exactly once and a stale duplicate placement row cannot be produced.
  // The scheduler configuration the guards need (the demand feedforward
  // term and the target load) rides in on the request, so the database
  // daemon needs no copy of it. Audit events are emitted by the caller
  // from the reply fields; sf-database emits none. See
  // docs/plans/PLAN-scheduler-reservations-phase-03-primitive.md.
  rpc AdmitInstancePlacement (AdmitInstancePlacementRequest) returns (AdmitInstancePlacementReply) {}
  rpc ReleaseInstancePlacement (ReleaseInstancePlacementRequest) returns (ReleaseInstancePlacementReply) {}

  // Read the materialised per-node capacity counters. The admin resources
  // summary must publish what admission would actually allow, and since
  // phase 3 that is these counters rather than a Python walk over
  // placement rows.
  rpc GetSchedulerNodeCapacity (GetSchedulerNodeCapacityRequest) returns (GetSchedulerNodeCapacityReply) {}

  // Scheduler-reservations phase 4: namespace claim CRUD. Creating,
  // growing and shrinking a claim are admission decisions in their own
  // right -- a claim is a promise of capacity the cluster has to be able
  // to keep -- so each writes cluster_capacity and namespace_claims in
  // one transaction, in the canonical order, opening with a guarded
  // UPDATE. Creation also migrates the namespace's existing drawdown out
  // of the cluster's unclaimed sums and into the new claim (D3), and
  // deletion migrates it back. See
  // docs/plans/PLAN-scheduler-reservations-phase-04-claims-api.md.
  rpc CreateNamespaceClaim (CreateNamespaceClaimRequest) returns (CreateNamespaceClaimReply) {}
  rpc GetNamespaceClaim (GetNamespaceClaimRequest) returns (GetNamespaceClaimReply) {}
  rpc GetNamespaceClaims (GetNamespaceClaimsRequest) returns (GetNamespaceClaimsReply) {}
  rpc UpdateNamespaceClaim (UpdateNamespaceClaimRequest) returns (UpdateNamespaceClaimReply) {}
  rpc DeleteNamespaceClaim (DeleteNamespaceClaimRequest) returns (DeleteNamespaceClaimReply) {}
}

// Generic status reply
message StatusReply {
  bool success = 1;
  string error = 2;
}

// Queue Operations

message EnqueueRequest {
  string queue_name = 1;
  string work_item = 2;  // JSON-encoded data
  double delay = 3;
}

message DequeueRequest {
  // Queue names in caller-supplied priority order: index 0 is the
  // highest priority. The server uses this order in ORDER BY
  // FIELD(queue_name, ...) so a single SELECT returns the most
  // important eligible work first.
  repeated string queue_names = 1;
  // Maximum number of items to claim in this call. Callers that
  // want one-at-a-time behaviour pass 1; pool workers pass their
  // free-slot count so they fill the pool in one round trip.
  int32 limit = 2;
}

message DequeuedItem {
  string queue_name = 1;
  string job_name = 2;
  string work_item = 3;  // JSON-encoded data
}

message DequeueReply {
  repeated DequeuedItem items = 1;
}

message ResolveRequest {
  string queue_name = 1;
  string job_name = 2;
}

message QueueLengthRequest {
  string queue_name = 1;
}

message QueueLengthReply {
  int64 processing = 1;
  int64 queued = 2;
  int64 deferred = 3;
}

message RestartQueueRequest {
  string queue_name = 1;
}

message ListStuckWorkQueueRowsRequest {
  double threshold_seconds = 1;
}

message StuckWorkQueueRow {
  int64 id = 1;
  string queue_name = 2;
  double claimed_at = 3;
  string claimed_by = 4;
  int64 attempts = 5;
  string payload_json = 6;
}

message ListStuckWorkQueueRowsReply {
  repeated StuckWorkQueueRow rows = 1;
}

message ClearWorkQueueClaimRequest {
  int64 row_id = 1;
}

message DeleteWorkQueueRowRequest {
  int64 row_id = 1;
}

message ClaimCoalescibleSiblingsRequest {
  // The op_type, target column (e.g. "network_uuid"), target uuid
  // and uuid of the surviving op together identify "other ops on
  // the same target object whose work the survivor is about to do."
  // The server folds anything matching by transitioning its state
  // to ``complete`` -- the worker that eventually picks that row
  // up out of the queue will see the terminal state and skip it
  // cleanly (see workitem.py terminal-state branch).
  string operation_type = 1;
  string target_column = 2;
  string target_uuid = 3;
  // Tasks the survivor is about to run that are flagged
  // coalescible. Only sibling ops whose entire task list is exactly
  // one of these names are folded -- multi-task siblings might
  // also carry non-coalescible work and must be left alone.
  repeated string task_names = 4;
  string exclude_op_uuid = 5;
}

message ClaimCoalescibleSiblingsReply {
  // Op uuids whose state was transitioned to ``complete``.
  repeated string folded_op_uuids = 1;
}

message FindExistingCoalescibleOpRequest {
  // Read-only lookup used by enqueue-side dedup: "is there already
  // a pending op on the same target whose entire task list is just
  // this one coalescible task?" -- if so the caller returns that
  // op's uuid to its caller instead of inserting a duplicate.
  string operation_type = 1;
  string target_column = 2;
  string target_uuid = 3;
  string task_name = 4;
}

message FindExistingCoalescibleOpReply {
  // Empty string when no match was found (proto3 has no string
  // null).
  string op_uuid = 1;
}

message CoalescibleKeyPair {
  // One (column, uuid) pair of the coalescing key. ``column`` names an
  // indexed column on the cluster_operations table and is validated
  // server side against a whitelist; ``uuid`` is the value that column
  // must equal for an op to be considered a sibling.
  string column = 1;
  string uuid = 2;
}

message ClaimCoalescibleSiblingsV2Request {
  // As ClaimCoalescibleSiblingsRequest, but the single
  // target_column/target_uuid pair is replaced by a list of them. Every
  // pair must match for an op to be folded, so a key of
  // (network_uuid, node_uuid) can distinguish two hypervisors' work on
  // the same network where the V1 key could not.
  string operation_type = 1;
  repeated CoalescibleKeyPair keys = 2;
  repeated string task_names = 3;
  string exclude_op_uuid = 4;
}

message FindExistingCoalescibleOpV2Request {
  // As FindExistingCoalescibleOpRequest, but with the multi-column key
  // described on ClaimCoalescibleSiblingsV2Request.
  string operation_type = 1;
  repeated CoalescibleKeyPair keys = 2;
  string task_name = 3;
}

