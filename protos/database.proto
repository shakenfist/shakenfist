syntax = "proto3";

package shakenfist.protos;

import "shakenfist_enums.proto";

service DatabaseService {
  // Key-Value Operations
  rpc Get (GetRequest) returns (GetReply) {}
  rpc GetPrefix (GetPrefixRequest) returns (GetPrefixReply) {}
  rpc Put (PutRequest) returns (StatusReply) {}
  rpc Create (CreateRequest) returns (StatusReply) {}
  rpc Delete (DeleteRequest) returns (StatusReply) {}
  rpc DeletePrefix (DeletePrefixRequest) returns (StatusReply) {}
  rpc ReplaceMany (ReplaceManyRequest) returns (ReplaceManyReply) {}

  // Queue Operations
  rpc Enqueue (EnqueueRequest) returns (StatusReply) {}
  rpc Dequeue (DequeueRequest) returns (DequeueReply) {}
  rpc Resolve (ResolveRequest) returns (StatusReply) {}
  rpc GetQueueLength (QueueLengthRequest) returns (QueueLengthReply) {}
  rpc RestartQueue (RestartQueueRequest) returns (StatusReply) {}

  // Lock Operations
  rpc AcquireLock (ClusterLockRequest) returns (ClusterLockReply) {}
  rpc ReleaseLock (ClusterReleaseLockRequest) returns (StatusReply) {}
  rpc GetLockHolder (ClusterGetLockHolderRequest) returns (ClusterLockHolderReply) {}
  rpc ClearStaleLocks (ClusterClearStaleLocksRequest) returns (StatusReply) {}
  rpc GetExistingLocks (ClusterGetExistingLocksRequest) returns (ClusterGetExistingLocksReply) {}

  // Maintenance
  rpc Compact (CompactRequest) returns (StatusReply) {}

  // Object State Operations (MariaDB)
  rpc GetObjectState (GetObjectStateRequest) returns (GetObjectStateReply) {}
  rpc SetObjectState (SetObjectStateRequest) returns (StatusReply) {}
  rpc DeleteObjectState (DeleteObjectStateRequest) returns (StatusReply) {}
  rpc GetObjectsByState (GetObjectsByStateRequest) returns (GetObjectsByStateReply) {}

  // IPAM Reservation Operations (MariaDB)
  rpc ReserveAddress (ReserveAddressRequest) returns (StatusReply) {}
  rpc ReleaseAddress (ReleaseAddressRequest) returns (StatusReply) {}
  rpc GetReservation (GetReservationRequest) returns (GetReservationReply) {}
  rpc GetReservationsForIPAM (GetReservationsForIPAMRequest) returns (GetReservationsForIPAMReply) {}
  rpc DeleteReservation (DeleteReservationRequest) returns (StatusReply) {}
  rpc DeleteReservationsForIPAM (DeleteReservationsForIPAMRequest) returns (DeleteCountReply) {}
  rpc ReleaseHaloedAddresses (ReleaseHaloedAddressesRequest) returns (DeleteCountReply) {}
  rpc GetAddressesInUse (GetAddressesInUseRequest) returns (GetAddressesInUseReply) {}

  // Upload Operations (MariaDB)
  rpc CreateUpload (CreateUploadRequest) returns (StatusReply) {}
  rpc GetUpload (GetUploadRequest) returns (GetUploadReply) {}
  rpc GetUploads (GetUploadsRequest) returns (GetUploadsReply) {}
  rpc DeleteUpload (DeleteUploadRequest) returns (StatusReply) {}
  rpc UpdateUpload (UpdateUploadRequest) returns (StatusReply) {}

  // DnsMasq Operations (MariaDB)
  rpc CreateDnsMasq (CreateDnsMasqRequest) returns (StatusReply) {}
  rpc GetDnsMasq (GetDnsMasqRequest) returns (GetDnsMasqReply) {}
  rpc GetDnsMasqs (GetDnsMasqsRequest) returns (GetDnsMasqsReply) {}
  rpc DeleteDnsMasq (DeleteDnsMasqRequest) returns (StatusReply) {}
  rpc UpdateDnsMasq (UpdateDnsMasqRequest) returns (StatusReply) {}

  // Object Reference Operations (MariaDB)
  rpc RecordRelationship (RecordRelationshipRequest) returns (StatusReply) {}
  rpc RemoveRelationship (RemoveRelationshipRequest) returns (StatusReply) {}
  rpc GetReferencesTo (GetReferencesToRequest) returns (GetReferencesReply) {}
  rpc GetReferencesFrom (GetReferencesFromRequest) returns (GetReferencesReply) {}
  rpc CountReferencesTo (CountReferencesToRequest) returns (CountReply) {}
  rpc RemoveAllReferencesFrom (RemoveAllReferencesFromRequest) returns (CountReply) {}
  rpc UpdateLastActive (UpdateLastActiveRequest) returns (StatusReply) {}
  rpc GetStaleReferences (GetStaleReferencesRequest) returns (GetReferencesReply) {}
}

// Generic status reply
message StatusReply {
  bool success = 1;
  string error = 2;
}

// Key-Value Operations

message GetRequest {
  string object_type = 1;
  string subtype = 2;
  string name = 3;
}

message GetReply {
  bool found = 1;
  string value = 2;  // JSON-encoded data
}

message GetPrefixRequest {
  string object_type = 1;
  string subtype = 2;
  string prefix = 3;
  int64 limit = 4;
}

message KeyValue {
  string key = 1;
  string value = 2;  // JSON-encoded data
}

message GetPrefixReply {
  repeated KeyValue results = 1;
}

message PutRequest {
  string object_type = 1;
  string subtype = 2;
  string name = 3;
  string data = 4;  // JSON-encoded data
}

message CreateRequest {
  string object_type = 1;
  string subtype = 2;
  string name = 3;
  string data = 4;  // JSON-encoded data
}

message DeleteRequest {
  string object_type = 1;
  string subtype = 2;
  string name = 3;
}

message DeletePrefixRequest {
  string path = 1;
}

message Mutation {
  string path = 1;
  string original_data = 2;  // JSON-encoded, empty string for None
  string new_data = 3;       // JSON-encoded, empty string for None (delete)
  bool original_is_none = 4;
  bool new_is_none = 5;
}

message ReplaceManyRequest {
  repeated Mutation mutations = 1;
  bool suppress_failure_audit = 2;
}

message MutationFailure {
  string path = 1;
  string desired = 2;
  string actual = 3;
  string replacement = 4;
}

message ReplaceManyReply {
  bool success = 1;
  repeated MutationFailure failures = 2;
}

// Queue Operations

message EnqueueRequest {
  string queue_name = 1;
  string work_item = 2;  // JSON-encoded data
  double delay = 3;
}

message DequeueRequest {
  string queue_name = 1;
}

message DequeueReply {
  bool found = 1;
  string job_name = 2;
  string work_item = 3;  // JSON-encoded data
}

message ResolveRequest {
  string queue_name = 1;
  string job_name = 2;
}

message QueueLengthRequest {
  string queue_name = 1;
}

message QueueLengthReply {
  int64 processing = 1;
  int64 queued = 2;
  int64 deferred = 3;
}

message RestartQueueRequest {
  string queue_name = 1;
}

// Lock Operations

message ClusterLockRequest {
  string object_type = 1;
  string subtype = 2;
  string name = 3;
  string lock_data = 4;  // JSON-encoded lock holder info
}

message ClusterLockReply {
  bool acquired = 1;
}

message ClusterReleaseLockRequest {
  string object_type = 1;
  string subtype = 2;
  string name = 3;
  string lock_data = 4;  // JSON-encoded, for CAS verification
}

message ClusterGetLockHolderRequest {
  string object_type = 1;
  string subtype = 2;
  string name = 3;
}

message ClusterLockHolderReply {
  bool held = 1;
  string holder = 2;  // JSON-encoded lock holder info
}

message ClusterClearStaleLocksRequest {
  string node_name = 1;
}

message ClusterGetExistingLocksRequest {}

message ClusterLockEntry {
  string key = 1;
  string holder = 2;  // JSON-encoded lock holder info
}

message ClusterGetExistingLocksReply {
  repeated ClusterLockEntry locks = 1;
}

// Maintenance Operations

message CompactRequest {
  int64 revision = 1;
}

// Object State Operations (MariaDB)
// These operations manage object state in MariaDB, which is used for
// efficient state queries and persistence.

message GetObjectStateRequest {
  ObjectType object_type = 1;  // The type of object
  string object_uuid = 2;
}

message GetObjectStateReply {
  bool found = 1;
  string state_value = 2;   // The state string, e.g., 'created', 'deleted'
  double update_time = 3;   // Unix timestamp of last update
  string message = 4;       // Optional message explaining the state
}

message SetObjectStateRequest {
  ObjectType object_type = 1;
  string object_uuid = 2;
  string state_value = 3;
  double update_time = 4;
  string message = 5;       // Optional
}

message DeleteObjectStateRequest {
  ObjectType object_type = 1;
  string object_uuid = 2;
}

message GetObjectsByStateRequest {
  ObjectType object_type = 1;
  repeated string state_values = 2;  // List of states to match
}

message GetObjectsByStateReply {
  repeated string object_uuids = 1;
}

// IPAM Reservation Operations (MariaDB)
// These operations manage IP address reservations in MariaDB for atomic
// address allocation and efficient queries.

message IPAMReservationData {
  string ipam_uuid = 1;
  string address = 2;
  ReservationType reservation_type = 3;  // How this address is being used
  ObjectType user_type = 4;              // Object type using this address
  string user_uuid = 5;                  // UUID of object using this address
  double reserved_at = 6;                // Unix timestamp when reserved
  string comment = 7;                    // Optional description
}

message ReserveAddressRequest {
  IPAMReservationData reservation = 1;
}

message ReleaseAddressRequest {
  string ipam_uuid = 1;
  string address = 2;
  IPAMReservationData halo_reservation = 3;  // The deletion-halo data to set
}

message GetReservationRequest {
  string ipam_uuid = 1;
  string address = 2;
}

message GetReservationReply {
  bool found = 1;
  IPAMReservationData reservation = 2;
}

message GetReservationsForIPAMRequest {
  string ipam_uuid = 1;
}

message GetReservationsForIPAMReply {
  repeated IPAMReservationData reservations = 1;
}

message DeleteReservationRequest {
  string ipam_uuid = 1;
  string address = 2;
}

message DeleteReservationsForIPAMRequest {
  string ipam_uuid = 1;
}

message DeleteCountReply {
  int64 count = 1;
}

message ReleaseHaloedAddressesRequest {
  string ipam_uuid = 1;
  double older_than = 2;  // Unix timestamp - delete halos reserved before this
}

message GetAddressesInUseRequest {
  string ipam_uuid = 1;
}

message GetAddressesInUseReply {
  repeated string addresses = 1;
}

// Upload Operations (MariaDB)
// These operations manage upload objects in MariaDB. Uploads are temporary
// objects that receive streamed data before being converted to artifacts.

message UploadData {
  string uuid = 1;        // UUID as string (consistent with other messages)
  string node = 2;        // Node name where the upload data is stored
  double created_at = 3;  // Unix timestamp when upload was created
  int32 version = 4;      // Object version number
}

message CreateUploadRequest {
  UploadData upload = 1;
}

message GetUploadRequest {
  string uuid = 1;
}

message GetUploadReply {
  bool found = 1;
  UploadData upload = 2;
}

message GetUploadsRequest {
  // Optional filters - if not set, returns all uploads
  string node = 1;              // Filter by node name (empty = all nodes)
  double created_before = 2;    // Filter by creation time (0 = no filter)
}

message GetUploadsReply {
  repeated UploadData uploads = 1;
}

message DeleteUploadRequest {
  string uuid = 1;
}

message UpdateUploadRequest {
  UploadData upload = 1;
}

// DnsMasq Operations (MariaDB)
// These operations manage DnsMasq objects in MariaDB. DnsMasq objects
// represent running dnsmasq processes that provide DHCP and/or DNS
// services for virtual networks.

message DnsMasqData {
  string uuid = 1;                // UUID as string (same as owning network)
  string namespace = 2;           // Namespace the DnsMasq belongs to
  ObjectType owner_type = 3;      // Type of the owning object (e.g., NETWORK)
  string owner_uuid = 4;          // UUID of the owning object
  int32 version = 5;              // Object version number
  bool provide_dhcp = 6;          // Whether DHCP services are provided
  bool provide_dns = 7;           // Whether DNS services are provided
}

message CreateDnsMasqRequest {
  DnsMasqData dnsmasq = 1;
}

message GetDnsMasqRequest {
  string uuid = 1;
}

message GetDnsMasqReply {
  bool found = 1;
  DnsMasqData dnsmasq = 2;
}

message GetDnsMasqsRequest {
  // Optional filters - if not set, returns all DnsMasq objects
  string namespace = 1;           // Filter by namespace (empty = all)
  string owner_uuid = 2;          // Filter by owner UUID (empty = all)
}

message GetDnsMasqsReply {
  repeated DnsMasqData dnsmasqs = 1;
}

message DeleteDnsMasqRequest {
  string uuid = 1;
}

message UpdateDnsMasqRequest {
  DnsMasqData dnsmasq = 1;
}

// Object Reference Operations (MariaDB)
// These operations manage references between objects, replacing the manual
// ref_count attribute on blobs. Enables queries like "which instances use
// this blob?" and "what does this instance reference?"

message ObjectReferenceData {
  ObjectType source_type = 1;      // Type of the source object
  string source_uuid = 2;          // UUID of the source object
  RelationshipType relationship = 3;  // Type of relationship
  string relationship_value = 4;   // Optional value (e.g., disk index)
  ObjectType target_type = 5;      // Type of the target object
  string target_uuid = 6;          // UUID of the target object
  double created = 7;              // Unix timestamp when created
  double last_active = 8;          // Unix timestamp, updated by cleaner
}

message RecordRelationshipRequest {
  ObjectType source_type = 1;
  string source_uuid = 2;
  RelationshipType relationship = 3;
  string relationship_value = 4;   // Empty string for NULL
  ObjectType target_type = 5;
  string target_uuid = 6;
}

message RemoveRelationshipRequest {
  ObjectType source_type = 1;
  string source_uuid = 2;
  RelationshipType relationship = 3;
  string relationship_value = 4;   // Empty string for NULL
  ObjectType target_type = 5;
  string target_uuid = 6;
}

message GetReferencesToRequest {
  ObjectType target_type = 1;
  string target_uuid = 2;
  optional RelationshipType relationship = 3;
}

message GetReferencesFromRequest {
  ObjectType source_type = 1;
  string source_uuid = 2;
  optional RelationshipType relationship = 3;
}

message GetReferencesReply {
  repeated ObjectReferenceData references = 1;
}

message CountReferencesToRequest {
  ObjectType target_type = 1;
  string target_uuid = 2;
}

message CountReply {
  int64 count = 1;
}

message RemoveAllReferencesFromRequest {
  ObjectType source_type = 1;
  string source_uuid = 2;
  RelationshipType relationship = 3;  // Optional: 0 (UNSPECIFIED) means all
}

message UpdateLastActiveRequest {
  ObjectType source_type = 1;
  string source_uuid = 2;
  RelationshipType relationship = 3;
  string relationship_value = 4;   // Empty string for NULL
  ObjectType target_type = 5;
  string target_uuid = 6;
}

message GetStaleReferencesRequest {
  double older_than = 1;  // Unix timestamp - return refs with last_active < this
}
