// MappingRule Operations (MariaDB)
// A MappingRule says which external identities a namespace will mint
// keys for, and what those keys may do. Owned by the namespace it
// targets; the (namespace, name) pair is unique.

message MappingRuleStaticData {
  string uuid = 1;            // MappingRule UUID
  string namespace = 2;       // Owning namespace
  string name = 3;            // Unique within the owning namespace
  int32 version = 4;          // Schema version
}

// The policy the rule expresses. bound_claims and scopes travel as JSON
// strings rather than as proto maps or repeated fields: a claim matcher
// is "an exact string or a list of acceptable strings", which a
// map<string, string> cannot carry without inventing an encoding, and
// an invented encoding is how the two sides of a wire drift apart. The
// same reasoning is why AgentOperationStaticData carries commands_json.
message MappingRuleAttributesProto {
  string uuid = 1;             // References mapping_rules.uuid
  string issuer = 2;           // Name of the TrustedIssuer accepted
  string bound_claims = 3;     // JSON object: claim name -> matcher
  string scopes = 4;           // JSON array of scope strings
  int64 key_ttl = 5;           // Seconds of life for minted keys
  string key_name_prefix = 6;  // Prefix for minted key names
}

message CreateMappingRuleRequest {
  MappingRuleStaticData data = 1;
}

message GetMappingRuleRequest {
  string uuid = 1;
}

message GetMappingRuleByNameRequest {
  string namespace = 1;
  string name = 2;
}

message GetMappingRuleReply {
  bool found = 1;
  MappingRuleStaticData data = 2;
}

message GetMappingRulesInNamespaceRequest {
  string namespace = 1;
}

message GetAllMappingRulesRequest {
}

message GetMappingRulesReply {
  repeated MappingRuleStaticData rules = 1;
}

message DeleteMappingRuleRequest {
  string uuid = 1;
}

message CreateMappingRuleAttributesRequest {
  MappingRuleAttributesProto data = 1;
}

message GetMappingRuleAttributesRequest {
  string uuid = 1;
}

message GetMappingRuleAttributesReply {
  bool found = 1;
  MappingRuleAttributesProto data = 2;

  // The row exists but its bound_claims or scopes will not decode.
  //
  // This is a data fault, not a transport fault, and the difference is
  // the whole point of the field. A damaged rule has two documented
  // behaviours -- the exchange refuses it with a generic 401, and
  // external_view() marks it unusable so one bad row does not take a
  // namespace's rule listing down -- and both are driven by catching
  // CorruptMappingRule in the API process. Without this flag the
  // exception is raised inside sf-database, the servicer's catch-all
  // turns it into INTERNAL, and _grpc_get_mapping_rule_attributes
  // cannot tell that from a database outage, so the API answers 503
  // and neither behaviour ever happens on a deployed cluster.
  //
  // Sent with found=true and no data: the caller is being told the
  // rule is there and cannot be read, which is a different answer to
  // found=false. The message deliberately carries no detail, because
  // the exception text names the rule uuid and this reply is produced
  // on behalf of an unauthenticated caller.
  bool corrupt = 3;
}

message UpdateMappingRuleAttributesRequest {
  MappingRuleAttributesProto data = 1;

  // Field mask: the MappingRuleAttributesData field names to write. An
  // empty list means write every column. See the equivalent comment on
  // UpdateInstanceAttributesRequest for the cross-attribute lost
  // update this prevents. A rule's policy is edited as one unit, so
  // today's only caller names every field -- the mask is here so a
  // later writer of one of them cannot silently revert the rest, which
  // for a rule would mean reverting the scopes it grants.
  repeated string fields = 2;
}

message DeleteMappingRuleAttributesRequest {
  string uuid = 1;
}

// AgentOperation Operations (MariaDB)
// These manage AgentOperation static values. AgentOperations represent
// in-guest agent tasks (execute, get-file, put-blob, chmod) queued
// against an Instance.

// deadline and progress_timeout use proto3 field presence: absent
// means SQL NULL, which for both of them means "no client intent was
// recorded, so the server default applies". An explicit 0 is
// different and means the client asked for none -- no wall-clock
// deadline, or the progress timeout disabled. Without presence the
// wire cannot tell those two apart, and every daemon except
// sf-database itself reaches MariaDB across this boundary.
message AgentOperationStaticData {
  string uuid = 1;                     // AgentOperation UUID
  string namespace = 2;                // Namespace
  string instance_uuid = 3;            // Instance this operation targets
  string commands_json = 4;            // JSON-encoded list of command dicts
  int32 version = 5;                   // Schema version
  optional double deadline = 6;        // Absolute epoch seconds; absent = server default
  optional double progress_timeout = 7; // Seconds; absent = server default
}

message CreateAgentOperationRequest {
  AgentOperationStaticData data = 1;
}

message GetAgentOperationRequest {
  string uuid = 1;
}

message GetAgentOperationReply {
  bool found = 1;
  AgentOperationStaticData data = 2;
}

message DeleteAgentOperationRequest {
  string uuid = 1;
}

// AgentOperation Attributes Operations (MariaDB)
// These store mutable AgentOperation attributes (results from executed
// commands).

// last_progress uses proto3 field presence for the same reason as the
// static values above: absent means SQL NULL, which here means no
// forward progress has been observed yet. attempts is not optional
// because the column is not nullable.
message AgentOperationAttributesProto {
  string uuid = 1;                  // References agent_operations.uuid
  string results_json = 2;          // JSON-encoded {index: result_dict}
  optional double last_progress = 3; // Epoch seconds; absent = none observed
  int64 attempts = 4;               // Dispatch counter for the retry bound
}

message CreateAgentOperationAttributesRequest {
  AgentOperationAttributesProto data = 1;
}

message GetAgentOperationAttributesRequest {
  string uuid = 1;
}

message GetAgentOperationAttributesReply {
  bool found = 1;
  AgentOperationAttributesProto data = 2;
}

message UpdateAgentOperationAttributesRequest {
  AgentOperationAttributesProto data = 1;

  // Field mask: the AgentOperationAttributesData field names to write. An
  // empty list means write every column. See the equivalent comment
  // on UpdateInstanceAttributesRequest for the cross-attribute lost
  // update this prevents.
  repeated string fields = 2;
}

message DeleteAgentOperationAttributesRequest {
  string uuid = 1;
}

