  string blob_uuid = 4;         // UUID of the blob being transferred
  string token = 5;             // Authentication token for TCP connection
  string server_state = 6;      // 'initial' or 'created'
  int32 port = 7;               // TCP port (0 if not yet set)
  double percentage = 8;        // Transfer progress (0.0 to 100.0)
  double created_at = 9;        // Unix timestamp when transfer was initiated
  double updated_at = 10;       // Unix timestamp of last update
}

