  string target_uuid = 2;
}

message GetClusterOperationTargetsForObjectReply {
  repeated ClusterOperationTargetProto targets = 1;
}

message GetLatestClusterOperationTargetRequest {
  ObjectType target_object_type = 1;
  string target_uuid = 2;
}

message HasPendingClusterOperationTargetRequest {
  ObjectType target_object_type = 1;
  string target_uuid = 2;
}

message HasPendingClusterOperationTargetReply {
  bool pending = 1;
}

message GetRecentTerminalOpStatesForTargetRequest {
  ObjectType target_object_type = 1;
  string target_uuid = 2;
  int32 limit = 3;
  // Empty string means "no op_type filter".
  string op_type = 4;
}

message TerminalOpState {
  string op_uuid = 1;
  string state_value = 2;
  double update_time = 3;
}

message GetRecentTerminalOpStatesForTargetReply {
  repeated TerminalOpState entries = 1;
}

message DeleteClusterOperationTargetRequest {
  string operation_uuid = 1;
}

message DeleteClusterOperationTargetsForObjectRequest {
  ObjectType target_object_type = 1;
  string target_uuid = 2;
}

message DeleteStaleClusterOperationTargetsRequest {
  // Unix timestamp - delete targets with created_at < this whose
  // operation is no longer in an active state.
  double older_than = 1;
}

// Node Metrics Operations (MariaDB)
// Ephemeral per-node resource metrics, upserted every 60s.

message NodeMetricsData {
  string node_uuid = 1;    // UUID as string
  string fqdn = 2;         // Node fully qualified domain name
  double timestamp = 3;    // Unix timestamp of metrics collection
  string metrics_json = 4; // JSON-encoded metrics dict
}

message UpsertNodeMetricsRequest {
  NodeMetricsData data = 1;
}

message GetNodeMetricsRequest {
  string node_uuid = 1;
}

message GetNodeMetricsReply {
  bool found = 1;
  NodeMetricsData data = 2;
}

message GetAllNodeMetricsRequest {}

message GetAllNodeMetricsReply {
  repeated NodeMetricsData items = 1;
}

message DeleteNodeMetricsRequest {
  string node_uuid = 1;
}

// Cluster Operations (MariaDB)
// Operation headers, keyed by operation uuid. State lives separately.

message ClusterOperationData {
  string uuid = 1;           // Operation UUID as string
  string operation_type = 2; // e.g. "instance_preflight"
  double created_at = 3;     // Unix timestamp of operation creation
  string metadata_json = 4;  // Full operation metadata dict as JSON
}

message CreateClusterOperationRequest {
  ClusterOperationData data = 1;
}

message GetClusterOperationRequest {
  string uuid = 1;
}

message GetClusterOperationReply {
  bool found = 1;
  ClusterOperationData data = 2;
}

message GetClusterOperationsByNodeRequest {
  string node_uuid = 1;
}

message GetClusterOperationsByNodeReply {
  repeated ClusterOperationData items = 1;
}

message ListClusterOperationsForTargetRequest {
  ObjectType target_object_type = 1;
  string target_uuid = 2;
}

message ListClusterOperationsForTargetReply {
  // Items are ordered newest-first by created_at.
  repeated ClusterOperationData items = 1;
}

message DeleteClusterOperationRequest {
  string uuid = 1;
}

// One cluster_operation_targets row to write in the same transaction
// as the operation itself. operation_uuid, operation_type and
// created_at are shared with the parent request and not repeated here.
message CreateAndEnqueueClusterOperationTarget {
  ObjectType target_object_type = 1;
  string target_uuid = 2;
}

message CreateAndEnqueueClusterOperationRequest {
  string uuid = 1;           // Operation UUID as string
  string operation_type = 2; // e.g. "node_net_op"
  double created_at = 3;     // Unix timestamp of operation creation
  string queue_name = 4;     // Target work queue name
  double delay = 5;          // Seconds to defer before the job is eligible
  string metadata_json = 6;  // Full operation metadata dict as JSON
  // cluster_operation_targets rows written atomically with the op so a
  // by-target query never sees an enqueued op without its target rows.
  repeated CreateAndEnqueueClusterOperationTarget targets = 7;
}

message SetClusterOperationErrorRequest {
  string op_uuid = 1;             // Operation UUID as string
  string error_report_json = 2;   // ErrorReport serialised as JSON
  double created_at = 3;          // Unix timestamp the report was written
}

message GetClusterOperationErrorRequest {
  string op_uuid = 1;             // Operation UUID as string
}

message GetClusterOperationErrorReply {
  bool found = 1;
  string error_report_json = 2;   // ErrorReport serialised as JSON
  // ``created_at`` is intentionally not exposed on the wire: no
  // caller of ``mariadb.get_cluster_operation_error`` consumes it,
  // and the table column stays for forensic queries by operators
  // hitting MariaDB directly. If a programmatic caller later wants
  // the timestamp, add it back here and thread it through
  // ``_direct_get_cluster_operation_error``.
}

message DeleteClusterOperationErrorRequest {
  string op_uuid = 1;             // Operation UUID as string
}

// Federation Abuse Resistance (MariaDB)

message RecordFederatedExchangeRequest {
  string token_id = 1;      // jti, or a hash of the signature
  string rule_uuid = 2;     // MappingRule UUID as string
  double expires_at = 3;    // The inbound token's exp
}

message RecordFederatedExchangeReply {
  // True if this (token, rule) pair was recorded for the first time,
  // false if it was already present and this is therefore a replay.
  bool recorded = 1;
  // Set only when we could not find out. "Already claimed" is not an
  // error, and the distinction matters: recorded=false means refuse
  // the exchange as a replay, whereas error set means refuse it
  // because we do not know. Both refuse, but only one is worth paging
  // an operator about.
  string error = 2;
  // Whether the claim was actually evaluated. Carried here for symmetry
  // with CountFederatedAttemptReply rather than because this message
  // needs it: recorded=false with an empty error degrades to "treat as
  // a replay", which refuses, so this one already failed closed. Having
  // both replies answer the same way keeps the next reader from having
  // to work out which of the two was the safe one.
  bool ok = 3;
}

message CountFederatedAttemptRequest {
  string source = 1;        // Source address of the attempt
  int64 window_start = 2;   // Unix timestamp of the one minute window
}

message CountFederatedAttemptReply {
  int32 attempts = 1;       // Attempts in this window, including this one
  string error = 2;         // Diagnostics only. Never test this to decide.
  // Whether attempts means anything. Set true only on the success path.
  //
  // The client used to infer this from error being non-empty, which put
  // the fail closed property in the hands of message formatting: an
  // exception whose str() is empty -- KeyError(), a bare
  // AttributeError(), anything raised with no args -- arrived as
  // attempts=0, error='' and read as "nobody has tried this minute",
  // which is the one answer this reply must never be able to give by
  // accident. A field that has to be set deliberately cannot be
  // produced by a formatting accident.
  bool ok = 3;
}

message ReapFederationReplayRequest {
  double cutoff = 1;        // Delete rows whose token expired before this
}

message ReapFederationRateLimitsRequest {
  int64 cutoff = 1;         // Delete windows which started before this
}

message ReapFederationReply {
  int32 removed = 1;
}

// Scheduler Capacity Operations (MariaDB)
// Scheduler-reservations phase 2 (see docs/plans/
// PLAN-scheduler-reservations-phase-02-capacity-tables.md). The demand
// parameters come from the caller's configuration (D13): placement adds
// vcpus x demand_per_vcpu of expected load, and the reconciler decays
// each placement's contribution linearly to zero over
// demand_decay_seconds of instance age.

message ReconcileSchedulerCapacityRequest {
  double demand_per_vcpu = 1;      // Expected load per placed vCPU
  int64 demand_decay_seconds = 2;  // Linear decay window for placements
  double disk_overcommit = 3;      // Multiplier on the disk limit's free-space headroom term (P3)
}

// One scheduler_node_capacity row after the pass. The delta_used_*
// fields are the change relative to the row's previous values; until
// phase 3 adds guarded-UPDATE drawdown they are ordinary between-pass
// churn, after which they become the drift-detection signal (D5).
message NodeCapacity {
  string node_uuid = 1;  // Dashed uuid form
  int64 limit_cpus = 2;
  int64 limit_memory_mb = 3;
  int64 limit_disk_gb = 4;
  int64 used_cpus = 5;
  int64 used_memory_mb = 6;
  int64 used_disk_gb = 7;
  double expected_demand = 8;
  int64 delta_used_cpus = 9;
  int64 delta_used_memory_mb = 10;
  int64 delta_used_disk_gb = 11;
}

// The cluster_capacity singleton after the pass.
message ClusterCapacity {
  int64 total_cpus = 1;
  int64 total_memory_mb = 2;
  int64 total_disk_gb = 3;
  int64 claimed_cpus = 4;
  int64 claimed_memory_mb = 5;
  int64 claimed_disk_gb = 6;
  int64 unclaimed_used_cpus = 7;
  int64 unclaimed_used_memory_mb = 8;
  int64 unclaimed_used_disk_gb = 9;
}

message ReconcileSchedulerCapacityReply {
  bool success = 1;
  int64 nodes_added = 2;
  int64 nodes_removed = 3;
  int64 claims_expired = 4;
  repeated NodeCapacity nodes = 5;
  ClusterCapacity cluster = 6;
}

// Scheduler placement admission and release (MariaDB)
// Scheduler-reservations phase 3 (see docs/plans/
// PLAN-scheduler-reservations-phase-03-primitive.md). Admission draws
// down the materialised counters and writes the placement in one
// transaction, in D1's canonical order: cluster_capacity, then
// namespace_claims, then scheduler_node_capacity.

message AdmitInstancePlacementRequest {
  string instance_uuid = 1;   // Dashed uuid form
  string namespace = 2;       // The instance's namespace, for the claim lookup
  string node_uuid = 3;       // Dashed uuid form, the node being claimed
  // Dashed uuid form of the node the instance is moving off, empty for a
  // first placement. A move never changes namespace, so the cluster and
  // claim rows are untouched by the old node's decrement.
  string old_node_uuid = 4;
  int64 cpus = 5;
  int64 memory_mb = 6;
  int64 disk_gb = 7;          // Virtual size summed from disk_spec
  // The D13 demand feedforward the placement adds to the node's
  // expected_demand, and the D13 target load the demand clause tests
  // against. Both are computed by the caller from its own scheduler
  // configuration (cpus x SCHEDULER_DEMAND_PER_VCPU, and
  // SCHEDULER_TARGET_LOAD) so the database daemon needs no copy of it.
  double demand_add = 8;
  double target_load = 9;
  // False for the ground-truth writers (the cleaner's placement rewrites
  // and the queues daemon's reference reconciliation, per P5): they
  // record where a libvirt domain already is, which a guard cannot
  // refuse. Every counter update still happens, only the guard clauses
  // are dropped.
  bool enforce = 10;
  // The JSON written to instance_attributes.placement, masked to that
  // one column exactly as the generic attribute write path does.
  string placement_json = 11;
}

// One dimension's numbers at the moment a guard refused, assembled from
// a fresh read after the transaction rolled back so the caller's audit
// event and its eventual 507 carry the depth the scheduler's Python
// rejection reasons do. The values are doubles because the demand
// dimension is fractional; the three allocation dimensions are exact
// integers far inside the range a double represents exactly.
message CapacityDimensionDetail {
  string dimension = 1;   // cpus, memory_mb, disk_gb or demand
  double limit = 2;
  double used = 3;
  double requested = 4;
  bool exceeded = 5;      // Did this dimension actually fail?
  // Set only on the demand dimension, whose used is the sum of two terms
  // that mean different things: cpu_load_1 is measured ground truth (a
  // high value means the node really is busy), expected_demand is the
  // D13 feedforward estimate (a high value on an idle node means the
  // estimator is wrong). Reported separately so a correct refusal can be
  // told from an estimator defect (issue 3913); used stays their sum.
  // optional so a reply from an sf-database predating these fields reads
  // as "no breakdown available" rather than a breakdown of zeroes.
  optional double cpu_load_1 = 6;
  optional double expected_demand = 7;
}

message AdmitInstancePlacementReply {
  bool success = 1;       // The RPC ran; false means an error, see error
  string error = 2;
  bool admitted = 3;
  // The target node (or the cluster singleton) had no capacity row, so
  // the placement was made without a guard (P7). The reconciler creates
  // the row on its next pass; the caller logs this loudly.
  bool unguarded = 4;
  // A floored decrement of the old node's counters hit zero rather than
  // subtracting cleanly (P6) -- a release racing the reconciler. The
  // counters are still correct after the next reconcile pass.
  bool clamped = 5;
  string failing_stage = 6;   // '', 'cluster', 'claim' or 'node'
  repeated CapacityDimensionDetail dimensions = 7;
  // The target node's counters after a successful admission, read back
  // by PK SELECT inside the transaction (MariaDB has no UPDATE ...
  // RETURNING). Zero when the admission was denied or unguarded.
  int64 node_used_cpus = 8;
  int64 node_used_memory_mb = 9;
  int64 node_used_disk_gb = 10;
  double node_expected_demand = 11;
  // Advisory claim accounting (D5/D16). The admission was charged to a
  // namespace claim and, read back inside the same transaction, that
  // claim's used_* now stands above its limit_*. The placement was
  // *admitted* -- claim ceilings are advisory for one release -- so this
  // is deliberately not reported through failing_stage or dimensions,
  // which both mean "this was refused". claim_dimensions carries only
  // the dimensions actually over, in the same shape dimensions uses:
  // used is what the claim held before this admission, requested is this
  // admission's allocation, limit is the claim's ceiling.
  bool claim_over_limit = 12;
  repeated CapacityDimensionDetail claim_dimensions = 13;
}

message ReleaseInstancePlacementRequest {
  string instance_uuid = 1;   // Dashed uuid form
  string namespace = 2;
  // Dashed uuid form of the node to release. Empty releases wherever the
  // instance's instance_location rows point, which is what a delete
  // path wants: it knows the instance, not necessarily its node.
  string node_uuid = 3;
  int64 cpus = 4;
  int64 memory_mb = 5;
  int64 disk_gb = 6;
}

message ReleaseInstancePlacementReply {
  bool success = 1;       // The RPC ran; false means an error, see error
  // False when there was nothing to release: no reference rows and no
  // node named, so no counters were touched. Double release is harmless
  // by construction (floored decrements over zero reference rows), and
  // this is how the caller tells a real release from a repeat.
  bool released = 2;
  bool clamped = 3;
  string error = 4;
}

message GetSchedulerNodeCapacityRequest {}

// One scheduler_node_capacity row as the admin resources summary reads
// it. Deliberately not the reconciler's NodeCapacity message: the
// delta_used_* fields there describe one reconcile pass and mean nothing
// to a reader of the current counters.
message SchedulerNodeCapacityRow {
  string node_uuid = 1;  // Dashed uuid form
  int64 limit_cpus = 2;
  int64 limit_memory_mb = 3;
  int64 limit_disk_gb = 4;
  int64 used_cpus = 5;
  int64 used_memory_mb = 6;
  int64 used_disk_gb = 7;
  double expected_demand = 8;
}

message GetSchedulerNodeCapacityReply {
  repeated SchedulerNodeCapacityRow rows = 1;
}

// Namespace claim CRUD (MariaDB)
// Scheduler-reservations phase 4 (see docs/plans/
// PLAN-scheduler-reservations-phase-04-claims-api.md). Creating, growing
// and shrinking a claim are themselves admission decisions against the
// cluster_capacity singleton (D14's mirror guard), so each of them is one
// transaction in D1's canonical order -- cluster_capacity, then
// namespace_claims -- opening with a guarded UPDATE.

// One namespace_claims row as its readers see it. The two timestamps are
// epoch seconds computed server side with UNIX_TIMESTAMP(), because the
// column is a DATETIME written from the server's NOW() and a client that
// reinterpreted it in its own timezone would report an expiry hours from
// the one the expiry sweep will actually use.
//
// ``state`` is *coverage* ('active' or 'expired'), not object existence
// (D2). The claim object's baseobject-managed state lives in
// object_states like every other object's and is not carried here.
message NamespaceClaim {
  string uuid = 1;       // Dashed uuid form
  string namespace = 2;
  int64 limit_cpus = 3;
  int64 limit_memory_mb = 4;
  int64 limit_disk_gb = 5;
  int64 used_cpus = 6;
  int64 used_memory_mb = 7;
  int64 used_disk_gb = 8;
  string state = 9;
  double expires_at = 10;
  double updated_at = 11;
}

// The expiry rides in as a duration rather than an absolute time, and is
// applied server side as NOW() + INTERVAL. A client-computed datetime
// silently expires the claim at the wrong moment -- or immediately -- if
// the client's clock or timezone differs from the server's, which is the
// same trap the reconciler's live suite records having fallen into.
message CreateNamespaceClaimRequest {
  string uuid = 1;       // Dashed uuid form, allocated by the caller
  string namespace = 2;
  int64 limit_cpus = 3;
  int64 limit_memory_mb = 4;
  int64 limit_disk_gb = 5;
  int64 expires_in_seconds = 6;
}

message CreateNamespaceClaimReply {
  bool success = 1;      // The RPC ran; false means an error, see error
  string error = 2;
  bool created = 3;
  // Why a run that succeeded did not create: 'capacity' (the mirror
  // guard refused), 'no_cluster_capacity' (the reconciler has never
  // built the singleton, so there is nothing to guard against) or
  // 'exists' (the namespace already holds an active claim).
  string refused_reason = 4;
  repeated CapacityDimensionDetail dimensions = 5;
  NamespaceClaim claim = 6;
}

message GetNamespaceClaimRequest {
  string uuid = 1;       // Dashed uuid form
}

message GetNamespaceClaimReply {
  bool found = 1;
  NamespaceClaim claim = 2;
}

// An empty namespace lists every claim; a non-empty one is pushed down
// to the namespace index rather than filtered in Python.
message GetNamespaceClaimsRequest {
  string namespace = 1;
}

message GetNamespaceClaimsReply {
  repeated NamespaceClaim claims = 1;
}

// D8: growing a dimension is an admission decision against the same
// mirror guard creation uses, shrinking one is permitted down to the
// claim's current used_* and no further, and one request may do both.
// ``fields`` is the field mask naming which of limit_cpus,
// limit_memory_mb, limit_disk_gb and expires_in_seconds this request
// actually sets; an unnamed field is left exactly as it is, which is how
// an unset proto3 zero is told from a deliberate zero.
message UpdateNamespaceClaimRequest {
  string uuid = 1;       // Dashed uuid form
  int64 limit_cpus = 2;
  int64 limit_memory_mb = 3;
  int64 limit_disk_gb = 4;
  int64 expires_in_seconds = 5;
  repeated string fields = 6;
}

message UpdateNamespaceClaimReply {
  bool success = 1;      // The RPC ran; false means an error, see error
  string error = 2;
  bool updated = 3;
  // Why a run that succeeded did not update: 'capacity' (a grow the
  // mirror guard refused), 'below_usage' (a shrink under the claim's
  // current used_*), 'no_cluster_capacity' (a grow with no singleton to
  // guard it -- a shrink or an expiry change is allowed through),
  // 'not_active' (the claim's coverage state is not 'active', so its
  // limits are not in claimed_* to adjust), 'not_found', or 'conflict'
  // (concurrent writers kept taking the row out from under the attempt).
  string refused_reason = 4;
  repeated CapacityDimensionDetail dimensions = 5;
  NamespaceClaim claim = 6;
}

message DeleteNamespaceClaimRequest {
  string uuid = 1;       // Dashed uuid form
}

message DeleteNamespaceClaimReply {
  bool success = 1;      // The RPC ran; false means an error, see error
  string error = 2;
  // False when there was no claim row to delete, which is how a repeat
  // delete is told from a real one. Deleting twice is harmless: the
  // second call finds nothing and returns no capacity.
  bool deleted = 3;
  // What the claim still held, returned to the cluster's unclaimed side.
  int64 returned_cpus = 4;
  int64 returned_memory_mb = 5;
  int64 returned_disk_gb = 6;
  // The claimed_* decrement had to be floored at zero, meaning the
  // singleton and the claims disagreed before this delete. Corrected by
  // the next reconcile pass.
  bool clamped = 7;
}
