# gitleaks configuration for Shaken Fist.
#
# Run in CI by .github/workflows/supply-chain.yml, which invokes the
# gitleaks packaged by Debian 13 (8.16.0) directly rather than using
# gitleaks-action, because that action refuses to run on organization
# repositories without a paid licence.
#
# This file is written against 8.16's schema, which is not the one the
# current upstream documentation describes -- per-rule allowlists became
# a repeatable [[rules.allowlists]] array in a later release, while 8.16
# takes a single [rules.allowlist] table. Check any change against the
# packaged version rather than against the website.
#
# The custom rule below is bound to the code by a test:
# shakenfist/tests/test_credentials.py reads this file, extracts the
# rule's regex, and asserts that it matches what credentials.generate()
# actually produces. So the format and the scanner cannot drift apart
# silently, which is the failure this rule exists to avoid.

title = "Shaken Fist"

[extend]
# Keep the upstream rules for third party credential shapes -- cloud
# keys, tokens, private keys -- and add ours to them.
useDefault = true

[[rules]]
id = "shakenfist-key-secret"
description = "Shaken Fist cluster-minted namespace key secret"
# The shape only. A scanner cannot verify the trailing base62 CRC32,
# so this deliberately matches examples and test fixtures too; the
# checksum-aware check lives in the unit suite, in
# shakenfist/tests/test_no_committed_credentials.py, which is what
# distinguishes a real credential from a documented one.
#
# Not a bare "sfk_": several log lines and documents legitimately
# mention the prefix, and a rule which fires on its own documentation
# gets disabled.
regex = '''sfk_[A-Za-z0-9]{38}'''
keywords = ["sfk_"]
tags = ["key", "shakenfist", "namespace-key"]

[rules.allowlist]
description = """
Deliberately invalid examples of the credential shape. Each is the real
shape with the six checksum characters set to zzzzzz, which as base62 is
56800235583 and so exceeds the largest possible CRC32 (4294967295) -- no
input produces it, so these cannot be credentials by arithmetic rather
than by assertion. The documentation needs to show the shape, and the
functional leak detector needs to emit it to prove it can fire.
"""
regexes = ['''sfk_[A-Za-z0-9]{32}zzzzzz''']

[allowlist]
description = """
Repository-wide exceptions. Every entry here is a place a scanner
believes it has found a credential and has not; adding one is a claim
that has to be true, so each carries the reason it is safe.
"""
paths = [
  # PEM placeholders in unit tests: the literal text is
  # "-----BEGIN PRIVATE KEY-----\\nfoo\\n-----END PRIVATE KEY-----",
  # which the upstream private-key rule matches on its delimiters
  # without looking at what is between them. There is no key material
  # in this repository.
  '''shakenfist/tests/test_vdi_tokens\.py''',
  '''shakenfist/tests/external_api/test_admin\.py''',
]
