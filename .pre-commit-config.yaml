# Pre-commit hooks for Shaken Fist
#
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# For actionlint, install the binary:
#   - macOS: brew install actionlint
#   - Linux: https://github.com/rhysd/actionlint/releases

repos:
  # GitHub Actions workflow linter
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        description: Static checker for GitHub Actions workflow files

  # Ansible linter for the shakenfist.shakenfist deployer collection
  # Requires: pip install ansible-lint
  # Note: Uses 'local' repo because the upstream pre-commit hook has Python 3.13
  # compatibility issues. This requires ansible-lint to be installed in PATH.
  - repo: local
    hooks:
      - id: ansible-lint
        name: Lint Ansible playbooks
        description: Checks playbooks for practices and behavior that could be improved
        entry: ansible-lint --config-file=shakenfist/deploy/collection/.ansible-lint shakenfist/deploy/collection/
        language: system
        files: ^shakenfist/deploy/collection/
        pass_filenames: false

  # Flake8 style checking via tox
  # Requires: pip install tox flake8
  - repo: local
    hooks:
      - id: flake8
        name: Style check with flake8
        description: Run flake8 style checks on changes since HEAD~
        entry: tox -e flake8
        language: system
        files: ^(shakenfist|tools)/
        pass_filenames: false
        types: [python]

  # Unit tests via tox
  # Requires: pip install tox
  - repo: local
    hooks:
      - id: py3
        name: Run unit tests
        description: Run Python 3 unit tests with stestr
        entry: tox -e py3
        language: system
        files: ^(shakenfist|tools)/
        pass_filenames: false
        types: [python]

  # Namespace-scoping guardrail for from_db_by_ref calls in external_api/
  - repo: local
    hooks:
      - id: check-from-db-by-ref-namespace
        name: Check from_db_by_ref namespace scoping
        description: >-
          Reject from_db_by_ref(..., request_namespace()) in external_api/;
          callers must resolve the namespace via api_base.resolve_lookup_namespace
          first so the request body's `namespace` field is honoured for
          system tokens.
        entry: tools/check-from-db-by-ref-namespace.sh
        language: system
        files: ^shakenfist/external_api/.*\.py$
        pass_filenames: false

      - id: check-endpoint-authentication
        name: Check endpoints authenticate by default
        description: >-
          Authentication is applied to every resource method by
          api_base.Resource.method_decorators. Reject resources which
          subclass flask_restful.Resource directly (they would miss it
          entirely) and @api_base.public markers which are not the
          outermost decorator (they would be invisible at dispatch).
        entry: tools/check-endpoint-authentication.sh
        language: system
        files: ^shakenfist/external_api/.*\.py$
        pass_filenames: false

      - id: check-api-parameter-locations
        name: Check API parameter locations are derivable
        description: >-
          Every declared parameter location must agree with where the value
          really comes from: the mounted route, a webargs query schema, a
          flask.request.args read, or the body merge. Reports what it would
          change; re-run with --apply to fix.
        entry: python3 tools/fix-api-parameter-locations.py
        language: system
        files: ^shakenfist/external_api/.*\.py$
        pass_filenames: false

      - id: check-doc-anchors
        name: Check documentation links and anchors resolve
        description: >-
          An intra-documentation link to an anchor which does not exist still
          renders, and silently drops the reader at the top of the target page.
          Neither mkdocs nor the docs-tests workflow notices, so a renamed
          heading breaks inbound links invisibly. Check them here instead.
          The root markdown files are covered too: they are indexes into
          docs/ and are not part of the mkdocs site, so nothing else looks
          at their links at all.
        entry: python3 tools/check-doc-anchors.py
        language: system
        files: ^(docs/.*\.md|AGENTS\.md|ARCHITECTURE\.md|CLAUDE\.md|README\.md)$
        pass_filenames: false

      - id: check-plan-status
        name: Check plan statuses and index arithmetic agree
        description: >-
          The index's status and "N of M" for a plan are derived from that
          plan's own Execution table, so they drift the moment one is updated
          without the other. Recompute them, reject a status cell outside the
          shared vocabulary, and catch a master plan missing from index.md or
          order.yml.
        entry: python3 tools/check-plan-status.py
        language: system
        files: ^(docs/plans/.*\.(md|yml)|PLAN-TEMPLATE\.md)$
        pass_filenames: false

  # Type checking with mypy (incremental rollout via tox)
  # Requires: pip install tox mypy
  - repo: local
    hooks:
      - id: mypy
        name: Type check with mypy
        description: Run mypy type checking on selected files (incremental rollout)
        entry: tox -e mypy
        language: system
        files: ^shakenfist/(schema/|mariadb\.py|daemons/database/|operations/|resource_health\.py|node_health\.py|external_api/(declarations|base|validation)\.py)
        pass_filenames: false
        types: [python]
