# Pre-commit hooks for Shaken Fist
#
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# For actionlint, install the binary:
#   - macOS: brew install actionlint
#   - Linux: https://github.com/rhysd/actionlint/releases

repos:
  # GitHub Actions workflow linter
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        description: Static checker for GitHub Actions workflow files

  # Ansible linter for deployer playbooks
  # Requires: pip install ansible-lint
  #           ansible-galaxy install andrewrothstein.etcd-cluster
  # Note: Uses 'local' repo because the upstream pre-commit hook has Python 3.13
  # compatibility issues. This requires ansible-lint to be installed in PATH.
  - repo: local
    hooks:
      - id: ansible-lint
        name: Lint Ansible playbooks
        description: Checks playbooks for practices and behavior that could be improved
        entry: ansible-lint --config-file=shakenfist/deploy/ansible/.ansible-lint shakenfist/deploy/ansible/
        language: system
        files: ^shakenfist/deploy/ansible/
        pass_filenames: false

  # Type checking with mypy (incremental rollout via tox)
  # Requires: pip install tox mypy
  - repo: local
    hooks:
      - id: mypy
        name: Type check with mypy
        description: Run mypy type checking on selected files (incremental rollout)
        entry: tox -e mypy
        language: system
        files: ^shakenfist/(schema/|mariadb\.py|daemons/database/|operations/)
        pass_filenames: false
        types: [python]
