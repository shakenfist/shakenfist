[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[simple]>=6.2",
    "wheel",
    "build",
    "twine"
]
build-backend = "setuptools.build_meta"

[project]
name = "shakenfist"
dynamic = ["version"]

description = "An opinionated minimal cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # A bit vague because we expect this to come from an OS package
    #     Debian 12 shipped with psutil 5.9.4
    #     Ubuntu 24.04 shiped with psutil 5.9.8
    #
    # Both are deliberately left to float. Each has historically been
    # exciting in terms of what distros package, so a range which accepts
    # the system package is worth more here than reproducibility. Being
    # declared as ranges means the reconciler treats them as already
    # constrained and does not add them to the pinned indirect block, so
    # Renovate has no pin to bump for either and upgrades land silently
    # rather than as a reviewable PR. That is intended; pin them exactly
    # here if it ever stops being.
    "psutil>=5.9.4",                      # bsd
    "uv>=0.8.0",                          # mit

    # Our requirements -- we specify exact versions here and let renovate update
    # them for the develop branch as required. Releases never update requirements.
    "shakenfist-utilities==0.8.6",        # apache2
    "clingwrap==2.1",                  # apache2

    "fixtures==4.3.2",                    # apache2
    "PyYAML==6.0.3",                      # mit
    "Jinja2==3.1.6",                      # bsd
    "setproctitle==1.3.7",                # bsd
    "click==8.4.2",                       # bsd
    "werkzeug==3.1.8",                    # bsd
    "prometheus-client==0.26.0",          # apache2
    "bcrypt==5.0.0",                      # apache2
    "cryptography==50.0.0",               # apache2
    "python-magic==0.4.27",               # mit
    "webargs==8.7.1",                     # mit
    "py-cpuinfo==9.0.0",                  # mit
    "distro==1.9.0",                      # apache2
    "pbr==7.0.3",                         # apache2
    "symbolicmode==2.0.1",                # CC0 1.0 Universal (CC0 1.0) Public Domain Dedication
    "pycdlib==1.20.0",                    # lgpl
    "validators==0.35.0",                 # mit
    "pyprctl==0.1.3",                     # mit
    "schedule==1.2.2",                    # mit
    "semver==3.0.4",                      # bsd
    "SQLAlchemy==2.0.52",                 # mit

    "greenlet==3.5.5",                    # mit
    "gevent==26.8.0",                     # mit
    "gunicorn[gevent]==26.2.0",           # mit

    "flask==3.1.3",                       # bsd
    "Flask-RESTful==0.3.10",              # bsd
    "flasgger==0.9.7.1",                  # mit
    "Flask-JWT-Extended==4.7.4",          # mit
    "flask-request-id-middleware==1.1",   # mit

    # The 2026-06 grpcio bisect (1.81 -> 1.75.1 -> 1.72.2 -> 1.70.0)
    # is over: the "sf-database stops handling RPCs ~20 s after
    # start" wedge reproduced identically at every version because it
    # was never a grpcio regression. It was an ABBA deadlock between
    # the synchronous grpc_health HealthServicer (initial Watch
    # response sent under the servicer lock) and the gRPC server's
    # single event-dispatch thread (Watch close callbacks acquire
    # that lock inline), armed by client-side healthCheckConfig in
    # our channel factory. Fixed by disabling Watch-based client-side
    # health checking in shakenfist/util/grpc_channel.py.
    "protobuf==7.36.0",                   # bsd
    "grpcio==1.83.0",                     # apache2
    "grpcio-health-checking==1.83.0",     # apache2
    "grpcio-status==1.83.0",              # apache2
    "grpcio-tools==1.83.0",               # apache2
    "googleapis-common-protos==1.75.1",   # apache2

    "requests==2.34.2",                   # apache2
    "requests-toolbelt==1.0.0",           # apache2
    "chardet==7.6.0",                     # lgpl
    "urllib3==2.7.0",                     # mit

    # These must move as a set. pydantic-core is deliberately not pinned
    # here: pydantic pins it exactly (==), so the resolved version is fully
    # determined by the pydantic pin and an explicit pin here can only ever
    # agree with it or break resolution.
    # never-pin: pydantic-core
    "pydantic==2.13.4",                   # mit
    "pydantic-settings==2.15.0",          # mit
    "pydantic-extra-types==2.11.1",       # mit

    # Is difficult to get install working, use system packages instead.
    # libvirt-python                      # lgpl
    # mysqlclient                         # gpl

    # Indirect dependencies. We do not track license for these. This block
    # is regenerated by tools/pin-indirect-dependencies.sh, so do not edit
    # it by hand -- add direct dependencies above the marker instead.
    # START_OF_INDIRECT_DEPS
    "aniso8601==10.0.1",
    "annotated-types==0.8.0",
    "attrs==26.1.0",
    "blinker==1.9.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.1",
    "debtcollector==3.1.0",
    "fasteners==0.20",
    "idna==3.19",
    "iso8601==2.1.0",
    "itsdangerous==2.2.0",
    "jsonschema-specifications==2025.9.1",
    "jsonschema==4.26.0",
    "MarkupSafe==3.0.3",
    "marshmallow==4.3.1",
    "mistune==3.3.4",
    "netaddr==1.3.0",
    "oslo.concurrency==7.6.1",
    "oslo.config==10.7.0",
    "oslo.i18n==6.9.0",
    "oslo.utils==10.1.1",
    "packaging==26.3",
    "pycparser==3.0",
    "PyJWT==2.13.0",
    "pylogrus==0.4.0",
    "pyparsing==3.3.2",
    "python-dotenv==1.2.3",
    "pytz==2026.3.post1",
    "referencing==0.37.0",
    "rfc3986==2.0.0",
    "rpds-py==0.30.0",
    "six==1.17.0",
    "stevedore==5.9.1",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "wrapt==2.3.0",
    "zope.event==6.2",
    "zope.interface==8.6",
    # END_OF_INDIRECT_DEPS
]

[project.urls]
"Homepage" = "https://shakenfist.com"
"Bug Tracker" = "https://github.com/shakenfist/shakenfist/issues"

[project.scripts]
sf-ctl = "shakenfist.client.ctl:cli"
sf-backup = "shakenfist.client.backup:cli"

sf-cleaner = "shakenfist.daemons.cleaner.main:main"
sf-cluster = "shakenfist.daemons.cluster.main:main"
sf-database = "shakenfist.daemons.database.main:main"
sf-net = "shakenfist.daemons.network.main:main"
sf-queues = "shakenfist.daemons.queues.main:main"
sf-resources = "shakenfist.daemons.resources.main:main"
sf-sentinel-first = "shakenfist.daemons.sentinel_first.main:main"
sf-sentinel-last = "shakenfist.daemons.sentinel_last.main:main"
sf-sidechannel = "shakenfist.daemons.sidechannel.main:main"
sf-transfers = "shakenfist.daemons.transfers.main:main"

sf-privexec = "shakenfist.daemons.privexec.main:main"
sf-nodelock = "shakenfist.daemons.nodelock.main:main"

[tool.setuptools]
packages = ["shakenfist"]

[tool.setuptools.package-data]
shakenfist = [
    "data/*.yaml",
    "deploy/**"
]

[tool.setuptools_scm]
git_describe_command = "git describe --dirty --tags --match v* --first-parent"
write_to = "shakenfist/_version.py"

[project.optional-dependencies]
test = [
    "coverage==7.15.4",          # apache2
    "testtools==2.9.1",         # mit -- pinned <2.7.0, stestr 4.2.0
                                #        imports _b removed in 2.7.0
    "mock==5.2.0",              # bsd
    "stestr==4.2.1",            # apache2
    "python-subunit==1.4.6",    # apache2 -- pinned <1.4.5, 1.4.5+
                                #            requires testtools>=2.7
    "flake8==7.3.0",            # mit
    "tox==4.60.0",              # mit
    "mkdocs==1.6.1",            # bsd
    "mkdocs-material==9.7.7",   # mit
    "testscenarios==0.6.2",     # bsd
    "mypy==2.3.1",             # mit
    "mypy-protobuf==5.1.0",     # apache2
    "grpc-stubs==1.53.0.6",     # mit
    "types-protobuf==7.35.1.20260824",    # apache2
    "types-PyYAML==6.0.12.20260815",      # apache2
    "types-requests==2.33.0.20260712",    # apache2
    "openapi-spec-validator==0.9.0",      # apache2 -- test only: the API
                                          #            daemon never
                                          #            validates its own
                                          #            spec at runtime
]

# mypy configuration
# We're incrementally rolling out mypy, starting with the schema module.
# See docs/developer_guide/mypy.md for the rollout strategy.
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Strict checking for new/typed modules
[[tool.mypy.overrides]]
module = "shakenfist.schema.sqlalchemy"
strict = true

[[tool.mypy.overrides]]
module = "shakenfist.schema.ipam_reservation"
strict = true

[[tool.mypy.overrides]]
module = "shakenfist.ipam"
strict = true

# Generated gRPC stubs (mypy-protobuf output) are not hand-maintained, so we
# do not type check them. Newer mypy releases flag the type: ignore comments
# and overloads that mypy-protobuf emits, none of which we can fix without
# regenerating from upstream.
[[tool.mypy.overrides]]
module = "shakenfist.protos.*"
ignore_errors = true
warn_unused_ignores = false
