site_name: Shaken Fist
site_url: https://shakenfist.com
repo_url: https://github.com/shakenfist/shakenfist
repo_name: shakenfist/shakenfist
site_description: A minimal cloud aimed at small and edge deployments

theme:
  name: material
  custom_dir: docs-overrides
  icon:
    annotation: material/arrow-right-circle
    admonition:
      puzzle: material/puzzle-outline
      foreshadow: material/head-lightbulb-outline

  palette:

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - search
  - meta

extra_css:
  - stylesheets/extra.css

markdown_extensions:
    - abbr
    - admonition
    - attr_list
    - def_list
    - footnotes
    - md_in_html
    - toc:
        permalink: true
    - pymdownx.details
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.superfences:
        custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
        alternate_style: true
    - pymdownx.tasklist:
        custom_checkbox: true
    - pymdownx.magiclink:
        repo_url_shorthand: true
        user: shakenfist
    - pymdownx.snippets:
        base_path:
          - .

watch:
  - docs-include

